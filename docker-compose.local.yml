services:
  backend:
    image: ${BACKEND_IMAGE:-chatbe-backend:local}
    container_name: ${BACKEND_CONTAINER_NAME:-chatbe-backend-local}
    env_file:
      - ${BACKEND_ENV_FILE:-.env.local}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/health/live', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis:
    container_name: ${REDIS_CONTAINER_NAME:-chatbe-redis-local}
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
