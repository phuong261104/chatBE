services:
  backend:
    image: ${BACKEND_IMAGE:-chatbe-backend:local}
    container_name: ${BACKEND_CONTAINER_NAME:-chatbe-backend-local}
    env_file:
      - ${BACKEND_ENV_FILE:-.env.local}
    restart: unless-stopped

  redis:
    container_name: ${REDIS_CONTAINER_NAME:-chatbe-redis-local}
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
