        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== User Management Endpoints ====================
  /users:
    post:
      tags:
        - User Management
      summary: Create user
      description: Create a new user account (requires authenticated user with role user in current implementation)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                phone:
                  type: string
                username:
                  type: string
                password:
                  type: string
                  format: password
                displayName:
                  type: string
                avatarUrl:
                  type: string
                bio:
                  type: string
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardResponse"
                  - type: object
                    properties:
                      data:
                        type: string
                        description: New user ID
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Role is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      tags:
        - User Management
      summary: List users
      description: Get paginated list of users (public endpoint in current implementation)
      security: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: Number of items per page
        - in: query
          name: email
          schema:
            type: string
          description: Filter by email
        - in: query
          name: username
          schema:
            type: string
          description: Filter by username
        - in: query
          name: status
          schema:
            type: string
            enum: [active, disabled]
          description: Filter by status
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
                      meta:
                        type: object
                        properties:
                          page:
                            type: integer
                          limit:
                            type: integer
                          filter:
                            type: object
                            additionalProperties: true
              example:
                status: success
                msg: OK
                data:
                  - id: "user123"
                    email: "user@example.com"
                    username: "johndoe"
                    displayName: "John Doe"
                    status: "active"
                    createdAt: "2026-03-12T10:00:00Z"
                meta:
                  page: 1
                  limit: 20
                  filter:
                    status: active
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

