  /rpc/introspect:
    post:
      tags:
        - Internal RPC
      summary: Token introspection (Internal)
      description: Verify and introspect a JWT token (for internal microservices use)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: JWT token to verify
            example:
              token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        "200":
          description: Token is valid
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sub:
                            type: string
                            description: User ID
                          role:
                            type: string
                            description: User role
              example:
                status: success
                msg: OK
                data:
                  sub: "user123"
                  role: "user"
        "400":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

