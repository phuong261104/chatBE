  # ==================== Media Endpoints ====================
  /media/upload:
    post:
      tags:
        - Media
      summary: Upload single file
      description: Upload a single image or file (max 10MB)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File to upload (image or document)
      responses:
        "201":
          description: File uploaded successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/MediaUploadResponse"
              example:
                status: success
                msg: Created
                data:
                  url: "http://localhost:3000/uploads/1234567890-image.jpg"
                  filename: "1234567890-image.jpg"
                  originalName: "image.jpg"
                  mimetype: "image/jpeg"
                  size: 102400
                  path: "uploads/1234567890-image.jpg"
                  uploadedAt: "2026-03-19T09:00:00Z"
        "400":
          description: Bad request (no file or invalid file)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Upload failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /media/upload-multiple:
    post:
      tags:
        - Media
      summary: Upload multiple files
      description: Upload up to 10 files at once (each max 10MB)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - files
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  maxItems: 10
                  description: Files to upload (max 10)
      responses:
        "201":
          description: Files uploaded successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/MediaUploadMultipleResponse"
              example:
                status: success
                msg: Created
                data:
                  files:
                    - url: "http://localhost:3000/uploads/1234567890-image1.jpg"
                      filename: "1234567890-image1.jpg"
                      originalName: "image1.jpg"
                      mimetype: "image/jpeg"
                      size: 102400
                      path: "uploads/1234567890-image1.jpg"
                      uploadedAt: "2026-03-19T09:00:00Z"
                    - url: "http://localhost:3000/uploads/1234567891-image2.jpg"
                      filename: "1234567891-image2.jpg"
                      originalName: "image2.jpg"
                      mimetype: "image/jpeg"
                      size: 204800
                      path: "uploads/1234567891-image2.jpg"
                      uploadedAt: "2026-03-19T09:00:01Z"
                  count: 2
        "400":
          description: Bad request (no files, too many files, or invalid files)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Upload failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /media/{filename}:
    delete:
      tags:
        - Media
      summary: Delete file
      description: Delete an uploaded file from the server
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: filename
          required: true
          schema:
            type: string
          description: Name of file to delete
      responses:
        "204":
          description: File deleted successfully
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Delete failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== Authentication Endpoints ====================
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      description: Register a new user account with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: User email address
                password:
                  type: string
                  format: password
                  minLength: 6
                  description: User password
                username:
                  type: string
                  description: Username (optional)
                displayName:
                  type: string
                  description: Display name (optional)
            example:
              email: "user@example.com"
              password: "password123"
              username: "johndoe"
              displayName: "John Doe"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
              example:
                status: success
                msg: Created
                data:
                  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    id: "user123"
                    email: "user@example.com"
                    username: "johndoe"
                    fullName: "John Doe"
        "422":
          description: Validation error or email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login
      description: Authenticate user with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: User email address
                password:
                  type: string
                  format: password
                  description: User password
            example:
              email: "user@example.com"
              password: "password123"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
              example:
                status: success
                msg: OK
                data:
                  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== User Profile Endpoints ====================
  /profile:
    get:
      tags:
        - User Profile
      summary: Get current user profile
      description: Get profile information of the authenticated user
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/User"
                    description: User profile without password and salt
              example:
                data:
                  id: "user123"
                  email: "user@example.com"
                  username: "johndoe"
                  displayName: "John Doe"
                  status: "active"
                  verified:
                    email: true
                    phone: false
                  avatarUrl: "https://example.com/avatar.jpg"
                  createdAt: "2026-03-12T10:00:00Z"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      tags:
        - User Profile
      summary: Update current user profile
      description: Update profile information of the authenticated user
      requestBody:
        required: true
        content:
