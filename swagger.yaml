      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - lastDeliveredMessageId
              properties:
                lastDeliveredMessageId:
                  type: string
                  description: ID of last message that was delivered
            example:
              lastDeliveredMessageId: "msg123"
      responses:
        "200":
          description: Marked as delivered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success]
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: true
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

