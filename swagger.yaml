  # ==================== Message Endpoints ====================
  /conversations/{conversationId}/messages:
    get:
      tags:
        - Messages
      summary: Load messages
      description: Load messages with cursor-based pagination (newest first)
      parameters:
        - in: path
          name: conversationId
          required: true
          schema:
            type: string
          description: ID of conversation
        - in: query
          name: cursor
          schema:
            type: string
          description: Cursor for pagination (message ID)
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: Number of messages to load
      responses:
        "200":
          description: Messages loaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/LoadMessagesResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags:
        - Messages
      summary: Send message
      description: |
        Send a message to a conversation (text, media, or both).
        - Auto-detects conversation type (private/group)
        - Triggers real-time Socket.IO notification to recipients
        - At least one of text or media must be provided
      parameters:
        - in: path
          name: conversationId
          required: true
          schema:
            type: string
          description: ID of conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
            example:
              text: "Hello world!"
              media:
                - url: "https://example.com/uploads/image.jpg"
                  filename: "image.jpg"
                  mimetype: "image/jpeg"
                  size: 102400
      responses:
        "201":
          description: Message sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Message"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /conversations/{conversationId}/seen:
    post:
      tags:
        - Messages
