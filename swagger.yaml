openapi: 3.0.0
info:
  title: BEMVP Social Messaging API
  description: |
    REST API for social messaging application với real-time chat, friend management, user blocking, group conversations, và media upload.

    ## 🚀 Features
    - **Real-time messaging** qua Socket.IO (namespace `/messages`)
    - **Friend management** với hệ thống requests và approvals
    - **User blocking** để kiểm so interaction
    - **Group conversations** với admin controls
    - **Media upload** cho images, videos, và files
    - **Message status tracking** (delivered/seen)

    ## 📡 Socket.IO Documentation
    Xem Socket.IO API tại: `/_docs/socket-api.md`
    - Namespace: `/messages`
    - Authentication: JWT token qua `auth.token`
    - Events: sendMessage, joinGroup, leaveGroup, messageSeen, messageDelivered
    - Server events: receiveMessage, newGroupCreated, membersAdded, memberRemoved, etc.

  version: 2.0.0
  contact:
    name: API Support
    email: support@bemvp.com

servers:
  - url: http://localhost:3000/v1
    description: Local development server
  - url: https://api.bemvp.com/v1
    description: Production server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from authentication service

  schemas:
    # ==================== Common Schemas ====================
    StandardResponse:
      type: object
      required:
        - status
        - msg
      properties:
        status:
          type: string
          enum: [success]
        msg:
          type: string
        data:
          nullable: true
          description: Response payload
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: string
            - type: number
            - type: boolean
        meta:
          type: object
          additionalProperties: true
      example:
        status: success
        msg: OK
        data: {}
        meta:
          page: 1
          limit: 20

    ErrorResponse:
      type: object
      required:
        - status
        - msg
        - code
      properties:
        status:
          type: string
          enum: [error]
        msg:
          type: string
        code:
          type: string
          example: INTERNAL_ERROR
        details:
          nullable: true
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: string
      example:
        status: error
        msg: User not found
        code: NOT_FOUND

    ValidationErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
      example:
        status: error
        msg: Validation error
        code: VALIDATION_ERROR
        details:
          - path: [body, targetUserId]
            message: Invalid target user ID

    SuccessResponse:
      $ref: "#/components/schemas/StandardResponse"

    DataResponse:
      $ref: "#/components/schemas/StandardResponse"

    PaginatedResponse:
      type: object
      required:
        - status
        - msg
        - data
      properties:
        status:
          type: string
          enum: [success]
        msg:
          type: string
          example: OK
        data:
          type: object
          required:
            - items
            - total
            - page
            - limit
            - hasMore
          properties:
            items:
              type: array
              items:
                type: object
                additionalProperties: true
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            hasMore:
              type: boolean
      example:
        status: success
        msg: OK
        data:
          items: []
          total: 0
          page: 1
          limit: 20
          hasMore: false

    # ==================== Block Schemas ====================
    Block:
      type: object
      properties:
        id:
          type: string
        blockerId:
          type: string
        blockedUserId:
          type: string
        createdAt:
          type: string
          format: date-time

    # ==================== Friend Request Schemas ====================
    FriendRequest:
      type: object
      properties:
        id:
          type: string
        fromUserId:
          type: string
        toUserId:
          type: string
        status:
          type: string
          enum: [pending, accepted, rejected, canceled]
        createdAt:
          type: string
          format: date-time
        respondedAt:
          type: string
          format: date-time
          nullable: true

    # ==================== Friendship Schemas ====================
    Friendship:
      type: object
      properties:
        id:
          type: string
        userA:
          type: string
          description: min(userId1, userId2)
        userB:
          type: string
          description: max(userId1, userId2)
        createdAt:
          type: string
          format: date-time

    # ==================== Conversation Schemas ====================
    Conversation:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [private, group]
          description: Type of conversation
        pairKey:
          type: string
          nullable: true
          description: Unique key for private conversations (combination of two user IDs)
        name:
          type: string
          nullable: true
          description: Group name (only for group conversations)
        avatarUrl:
          type: string
          nullable: true
          description: Group avatar URL (only for group conversations)
        createdBy:
          type: string
          nullable: true
          description: User ID who created the group (only for group conversations)
        admins:
          type: array
          items:
            type: string
          description: List of admin user IDs (only for group conversations)
        membersCount:
          type: integer
          default: 0
          description: Total number of members in conversation
        lastMessage:
          allOf:
            - $ref: "#/components/schemas/LastMessage"
          nullable: true
          description: Last message in conversation
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of last message
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LastMessage:
      type: object
      properties:
        messageId:
          type: string
        senderId:
          type: string
        type:
          type: string
          enum: [text, image, file, system]
        textPreview:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    ConversationWithMetadata:
      allOf:
        - $ref: "#/components/schemas/Conversation"
        - type: object
          properties:
            unreadCount:
              type: integer
            role:
              type: string
              enum: [member, admin]

    ConversationDetail:
      type: object
      properties:
        conversation:
          $ref: "#/components/schemas/Conversation"
        members:
          type: array
          items:
            $ref: "#/components/schemas/ConversationMember"
        currentUserRole:
          type: string
          enum: [member, admin]

    ConversationMember:
      type: object
      properties:
        id:
          type: string
        conversationId:
          type: string
        userId:
          type: string
        role:
          type: string
          enum: [member, admin]
        joinedAt:
          type: string
          format: date-time
        leftAt:
          type: string
          format: date-time
          nullable: true
        unreadCount:
          type: integer
          default: 0
        lastReadMessageId:
          type: string
          nullable: true
          description: ID of the last message the user has read
        lastReadAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when user last read messages
        lastSeenMessageId:
          type: string
          nullable: true
          description: ID of the last message the user has seen
        lastDeliveredMessageId:
          type: string
          nullable: true
          description: ID of the last message delivered to user
        muteUntil:
          type: string
          format: date-time
          nullable: true
          description: Mute notifications until this time
        pinned:
          type: boolean
          default: false
          description: Whether conversation is pinned
        archived:
          type: boolean
          default: false
          description: Whether conversation is archived
        updatedAt:
          type: string
          format: date-time

    # ==================== Message Schemas ====================
    Message:
      type: object
      properties:
        id:
          type: string
        conversationId:
          type: string
        senderId:
          type: string
        type:
          type: string
          enum: [text, image, file, system]
        text:
          type: string
          nullable: true
        media:
          type: array
          items:
            $ref: "#/components/schemas/MessageMedia"
          nullable: true
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when message was edited
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when message was deleted

    MessageMedia:
      type: object
      properties:
        url:
          type: string
        mediaType:
          type: string
          enum: [image, file]
        name:
          type: string
          nullable: true
        size:
          type: integer
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true

    MediaAttachment:
      type: object
      description: From upload API response
      properties:
        url:
          type: string
        filename:
          type: string
        mimetype:
          type: string
        size:
          type: integer

    # ==================== User Schemas ====================
    UserVerified:
      type: object
      properties:
        email:
          type: boolean
        phone:
          type: boolean

    UserPrivacy:
      type: object
      properties:
        searchableByEmail:
          type: boolean
        searchableByPhone:
          type: boolean
        searchableByUsername:
          type: boolean

    UserSettings:
      type: object
      properties:
        notifications:
          type: object
          properties:
            push:
              type: boolean
            inApp:
              type: boolean

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        password:
          type: string
          description: Hashed password (not returned in API responses)
        salt:
          type: string
          description: Password salt (not returned in API responses)
        status:
          type: string
          enum: [active, disabled]
        verified:
          $ref: "#/components/schemas/UserVerified"
        displayName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        privacy:
          $ref: "#/components/schemas/UserPrivacy"
        settings:
          $ref: "#/components/schemas/UserSettings"
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserInfo:
      type: object
      description: Simplified user info for display purposes
      properties:
        id:
          type: string
        displayName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, disabled]

    # ==================== Request/Response Schemas (not DTOs) ====================

    SendMessageRequest:
      type: object
      properties:
        text:
          type: string
          maxLength: 5000
        media:
          type: array
          items:
            $ref: "#/components/schemas/MediaAttachment"

    LoadMessagesResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        nextCursor:
          type: string
        hasMore:
          type: boolean

    # ==================== Group Schemas ====================
    CreateGroupRequest:
      type: object
      required:
        - name
        - memberIds
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        avatarUrl:
          type: string
        memberIds:
          type: array
          items:
            type: string
          minItems: 2

    CreateGroupResponse:
      type: object
      properties:
        conversation:
          $ref: "#/components/schemas/Conversation"
        members:
          type: array
          items:
            $ref: "#/components/schemas/ConversationMember"
        systemMessage:
          $ref: "#/components/schemas/Message"

    UpdateGroupRequest:
      type: object
      properties:
        name:
          type: string
        avatarUrl:
          type: string

    AddMembersRequest:
      type: object
      required:
        - memberIds
      properties:
        memberIds:
          type: array
          items:
            type: string
          minItems: 1

    # ==================== Media Schemas ====================
    MediaUploadResponse:
      type: object
      properties:
        filename:
          type: string
        originalName:
          type: string
        mimetype:
          type: string
        size:
          type: integer
        url:
          type: string
        path:
          type: string
        uploadedAt:
          type: string
          format: date-time

    MediaUploadMultipleResponse:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/MediaUploadResponse"
        count:
          type: integer

security:
  - bearerAuth: []

paths:
  # ==================== Block Endpoints ====================
  /blocks/{blockedUserId}:
    post:
      tags:
        - Blocks
      summary: Block user
      parameters:
        - in: path
          name: blockedUserId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User blocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      message:
                        type: string
        "400":
          description: Error
        "401":
          description: Unauthorized

    delete:
      tags:
        - Blocks
      summary: Unblock user
      parameters:
        - in: path
          name: blockedUserId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: User unblocked successfully
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Block not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /blocks:
    get:
      tags:
        - Blocks
      summary: List blocked users
      description: Get paginated list of users blocked by current user
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: Number of items per page
      responses:
        "200":
          description: List of blocked users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedResponse"
              example:
                data:
                  items:
                    - id: "abc123"
                      blockerId: "user1"
                      blockedUserId: "user2"
                      createdAt: "2026-03-12T10:00:00Z"
                  total: 1
                  page: 1
                  limit: 20
                  hasMore: false
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /blocks/{blockedUserId}/check:
    get:
      tags:
        - Blocks
      summary: Check block status
      description: Check if current user has blocked a specific user
      parameters:
        - in: path
          name: blockedUserId
          required: true
          schema:
            type: string
          description: ID of user to check
      responses:
        "200":
          description: Block status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      isBlocked:
                        type: boolean
                        description: True if user is blocked
              example:
                data:
                  isBlocked: true
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== Friend Request Endpoints ====================
  /friend-requests/{receiverId}:
    post:
      tags:
        - Friend Requests
      summary: Send friend request
      description: Send a friend request to another user
      parameters:
        - in: path
          name: receiverId
          required: true
          schema:
            type: string
          description: ID of user to send request to
      responses:
        "201":
          description: Friend request created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
              example:
                status: success
                msg: Created
                data:
                  id: "req123"
                  status: "pending"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /friend-requests/{requestId}:
    patch:
      tags:
        - Friend Requests
      summary: Update friend request status
      description: Update status of a friend request
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
          description: ID of friend request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [accepted, rejected, canceled]
      responses:
        "200":
          description: Friend request updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
              example:
                status: success
                msg: OK
                data:
                  id: "req123"
                  status: "accepted"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Not authorized to update this request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Friend request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - Friend Requests
      summary: Cancel friend request
      description: Cancel a friend request that was sent
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
          description: ID of friend request to cancel
      responses:
        "204":
          description: Friend request canceled successfully
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Friend request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /friend-requests/received:
    get:
      tags:
        - Friend Requests
      summary: List received requests
      description: Get paginated list of received friend requests
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: Number of items per page
      responses:
        "200":
          description: List of received friend requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedResponse"
              example:
                data:
                  items:
                    - id: "req123"
                      fromUserId: "user1"
                      toUserId: "user2"
                      status: "pending"
                      createdAt: "2026-03-12T10:00:00Z"
                  total: 1
                  page: 1
                  limit: 20
                  hasMore: false
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /friend-requests/sent:
    get:
      tags:
        - Friend Requests
      summary: List sent requests
      description: Get paginated list of sent friend requests
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: Number of items per page
      responses:
        "200":
          description: List of sent friend requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedResponse"
              example:
                data:
                  items:
                    - id: "req123"
                      fromUserId: "user1"
                      toUserId: "user2"
                      status: "pending"
                      createdAt: "2026-03-12T10:00:00Z"
                  total: 1
                  page: 1
                  limit: 20
                  hasMore: false
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== Friendship Endpoints ====================
  /friendships:
    get:
      tags:
        - Friendships
      summary: List friends
      description: Get paginated list of user's friends
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: Number of items per page
      responses:
        "200":
          description: List of friends
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedResponse"
              example:
                data:
                  items:
                    - id: "friendship123"
                      userA: "user1"
                      userB: "user2"
                      createdAt: "2026-03-12T10:00:00Z"
                  total: 1
                  page: 1
                  limit: 20
                  hasMore: false
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /friendships/{friendId}:
    delete:
      tags:
        - Friendships
      summary: Unfriend
      description: Remove friendship with a user
      parameters:
        - in: path
          name: friendId
          required: true
          schema:
            type: string
          description: ID of friend to unfriend
      responses:
        "204":
          description: Unfriended successfully
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Friendship not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /friendships/{friendId}/check:
    get:
      tags:
        - Friendships
      summary: Check friendship
      description: Check if two users are friends
      parameters:
        - in: path
          name: friendId
          required: true
          schema:
            type: string
          description: ID of user to check friendship with
      responses:
        "200":
          description: Friendship status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      isFriend:
                        type: boolean
                        description: True if users are friends
              example:
                data:
                  isFriend: true
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== Conversation Endpoints ====================
  /conversations:
    get:
      tags:
        - Conversations
      summary: Get conversations
      description: Get all conversations for current user (private + group) with pagination
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
