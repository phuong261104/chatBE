                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: true
        "400":
          description: Bad request (e.g., last admin trying to leave)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ValidationErrorResponse"
