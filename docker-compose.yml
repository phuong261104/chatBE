# ============================================================================
# Đặc tả: Chạy Docker để khởi động Database và Cache
# ============================================================================
# Boss muốn chạy npm run start trên máy host (không chạy trong container)
# Nên comment lại phần api service.
#
# Cách sử dụng:
#   docker-compose up -d        # Chỉ khởi động MongoDB và Redis
#   npm run start               # Chạy app trên máy host (port 3000)
#
# Kết nối từ host:
#   - MongoDB: localhost:27018
#   - Redis: localhost:6379
# ============================================================================

services:

  mongodb:
    image: mongo:latest
    container_name: mongodb-chat
    restart: always
    ports:
      - "27018:27017" # Host mapping 27018 to avoid collision with local DB
    volumes:
      - mongodb_data:/data/db
    networks:
      - chat-network

  redis:
    image: redis:7
    container_name: redis-chat
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - chat-network

volumes:
  mongodb_data:
  redis_data:

networks:
  chat-network:
    driver: bridge
