version: "3.8"

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb-chat
    restart: always
    ports:
      - "27018:27017"
    # volumes:
    #   - mongodb_data:/data/db
    networks:
      - chat-network

  redis:
    image: redis:7
    container_name: redis-chat
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    # volumes:
    #   - redis_data:/data
    networks:
      - chat-network

volumes:
  mongodb_data:
  redis_data:

networks:
  chat-network:
    # driver: bridge
