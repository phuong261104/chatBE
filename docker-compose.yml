# ============================================================================
# Đặc tả: Chạy Docker để khởi động Database và Cache
# ============================================================================
# Boss muốn chạy npm run start trên máy host (không chạy trong container)
#
# Cách sử dụng:
#   docker-compose up -d        # Khởi động Redis và DynamoDB Local
#   npm run start              # Chạy app trên máy host (port 3000)
#
# Kết nối từ host:
#   - DynamoDB Local: localhost:8000
#   - Redis: localhost:6379
# ============================================================================

services:
  redis:
    image: redis:7
    container_name: redis-chat
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - chat-network

  # dynamodb-local:
  #   image: amazon/dynamodb-local:latest
  #   container_name: dynamodb-local-chat
  #   restart: always
  #   ports:
  #     - "8000:8000"
  #   command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
  #   volumes:
  #     - ./docker/dynamodb:/home/dynamodblocal/data
  #   networks:
  #     - chat-network

volumes:
  redis_data:

networks:
  chat-network:
    driver: bridge
