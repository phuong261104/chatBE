paths:
  /v1/messages/{messageId}/pin:
    post:
      summary: Pin a message
      description: Each conversation can have at most 5 pinned messages. When the limit is reached, pinning another message returns 400.
      tags: [Chat - Messages]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: messageId
          schema:
            type: string
          example: "msg_001"
          required: true
      responses:
        "200":
          description: Message pinned successfully
          content:
            application/json:
              example:
                data:
                  _id: "msg_001"
                  isPinned: true
        "401":
          description: Unauthorized
        "403":
          description: Only group admins can pin messages
        "400":
          description: Message is already pinned or the conversation already has 5 pinned messages
    delete:
      summary: Unpin a message
      tags: [Chat - Messages]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: messageId
          schema:
            type: string
          example: "msg_001"
          required: true
      responses:
        "200":
          description: Message unpinned successfully
          content:
            application/json:
              example:
                data:
                  _id: "msg_001"
                  isPinned: false
        "401":
          description: Unauthorized

  /v1/messages/forward:
    post:
      summary: Forward messages to conversations
      description: |
        Forwards messages to target conversations. Original messages are not modified.
        System messages cannot be forwarded.
      tags: [Chat - Messages]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - messageIds
                - targetConversationIds
              properties:
                messageIds:
                  type: array
                  items:
                    type: string
                  description: IDs of messages to forward
                  minItems: 1
                  example: ["msg_001", "msg_002"]
                targetConversationIds:
                  type: array
                  items:
                    type: string
                  description: Target conversation IDs
                  minItems: 1
                  example: ["conv_001", "conv_002"]
      responses:
        "201":
          description: Messages forwarded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "./chat-schemas.yaml#/components/schemas/MessageResponse"
              example:
                data:
                  - _id: "msg_new_001"
                    conversationId: "conv_001"
                    senderId: "user_123"
                    type: "text"
                    text: "Hello https://example.com"
                    links: ["https://example.com"]
                    pinned: false
                    createdAt: "2024-01-15T12:00:00Z"
                  - _id: "msg_new_002"
                    conversationId: "conv_001"
                    senderId: "user_123"
                    type: "image"
                    text: null
                    media:
                      [
                        {
                          "url": "https://cdn.example.com/img.jpg",
                          "mediaType": "image",
                          "name": "photo.jpg",
                          "size": 102400,
                        },
                      ]
                    pinned: false
                    createdAt: "2024-01-15T12:00:00Z"
        "401":
          description: Unauthorized

  /v1/messages/save-to-my-document:
    post:
      summary: Save messages to Saved Messages
      description: |
        Saves one or more chat messages into the current user's Saved Messages conversation.
        This endpoint is mounted from `MessagingHttpService.saveMessagesToMyDocumentAPI`.
      tags: [Chat - Messages]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - messageIds
              properties:
                messageIds:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
                  example: ["0192a3bc-def0-7abc-8901-23456789abcd"]
      responses:
        "201":
          description: Messages saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        "401":
          description: Unauthorized
        "422":
          description: Validation error

  /v1/saved-messages/messages:
    post:
      summary: Save messages to Saved Messages
      description: Alias of `POST /v1/messages/save-to-my-document`.
      tags: [Chat - Messages]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - messageIds
              properties:
                messageIds:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
                  example: ["0192a3bc-def0-7abc-8901-23456789abcd"]
      responses:
        "201":
          description: Messages saved
        "401":
          description: Unauthorized
        "422":
          description: Validation error

  /v1/messages/{messageId}/quote:
    post:
      summary: Quote and reply to a message (returns Message)
      description: |
        Sends a reply that quotes a specific message. The conversationId is automatically determined from the quoted message.
        Similar to send message, supports text/media/link splitting.
      tags: [Chat - Messages]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: messageId
          schema:
            type: string
            example: "msg_001"
          required: true
          description: Message ID to quote/reply
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  maxLength: 5000
                  example: "Tôi đồng ý với ý kiến này"
                media:
                  type: array
                  items:
                    $ref: "./chat-schemas.yaml#/components/schemas/MediaAttachment"
              description: At least one of text or media is required.
      responses:
        "201":
          description: Quote message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "./chat-schemas.yaml#/components/schemas/MessageResponse"
              example:
                data:
                  _id: "msg_quote_001"
                  conversationId: "conv_001"
                  senderId: "user_123"
                  type: "link"
                  text: "Great point! https://example.com/article"
                  links: ["https://example.com/article"]
                  media: null
                  quotedMessageId: "msg_001"
                  quotedMessagePreview: "Original message..."
                  pinned: false
                  createdAt: "2024-01-15T12:30:00Z"
        "401":
          description: Unauthorized
        "404":
          description: Original message not found

  /v1/conversations/{conversationId}/messages/bulk:
    delete:
      summary: Delete multiple messages at once (for me only)
      tags: [Chat - Messages]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
          example: "0192a3bc-def0-7abc-8901-23456789abcd"
          required: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                before:
                  type: string
                  format: date-time
                  description: Delete messages sent before this time
                  example: "2024-01-15T12:00:00Z"
                after:
                  type: string
                  format: date-time
                  description: Delete messages sent after this time
                  example: "2024-01-01T00:00:00Z"
                messageIds:
                  type: array
                  items:
                    type: string
                  description: Specific message IDs to delete. At least one of before, after, or messageIds required.
                  example: ["0192a3bc-def0-7abc-8901-23456789abcd"]
            example:
              messageIds: ["0192a3bc-def0-7abc-8901-23456789abcd", "0192a3bc-def0-7abc-8901-23456789abce"]
      responses:
        "200":
          description: Messages deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deletedCount:
                        type: integer
                        description: Number of messages deleted
                        example: 2
              example:
                data:
                  deletedCount: 2
        "401":
          description: Unauthorized
        "403":
          description: Not a member of this conversation

  /v1/messages/{messageId}/translate:
    post:
      summary: Translate a message using AI
      tags: [Chat - Messages]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: messageId
          schema:
            type: string
          example: "0192a3bc-def0-7abc-8901-23456789abcd"
          required: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                targetLanguage:
                  type: string
                  description: Target language code (e.g., "vi", "en", "zh"). Defaults to "en" if not provided.
                  example: "en"
            example:
              targetLanguage: "en"
      responses:
        "200":
          description: Translated text
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      originalText:
                        type: string
                        description: Original message text
                        example: "Xin chào"
                      translatedText:
                        type: string
                        description: Translated text
                        example: "Hello"
                      detectedLanguage:
                        type: string
                        description: Detected source language code
                        example: "vi"
                      targetLanguage:
                        type: string
                        description: Target language code used
                        example: "en"
              example:
                data:
                  originalText: "Xin chào"
                  translatedText: "Hello"
                  detectedLanguage: "vi"
                  targetLanguage: "en"
        "401":
          description: Unauthorized
        "404":
          description: Message not found
