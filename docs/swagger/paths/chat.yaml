paths:
  # ==================== CONVERSATIONS ====================
  /conversations/private:
    post:
      summary: Get or create private 1-1 conversation
      tags: [Chat - Conversations]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - targetUserId
              properties:
                targetUserId:
                  type: string
                  description: Target user ID to start conversation with
                  example: "60d0fe4f5311236168a109cc"
      responses:
        '200':
          description: Private conversation found or created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '401':
          description: Unauthorized
        '422':
          description: Validation error

  /conversations:
    get:
      summary: List all conversations for current user
      tags: [Chat - Conversations]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            example: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
            example: 20
      responses:
        '200':
          description: List of conversations
          content:
            application/json:
              example:
                data:
                  conversations:
                    - _id: "conv_001"
                      name: "Nhóm Dev Team"
                      type: "GROUP"
                      avatarUrl: "https://cdn.example.com/avatar.png"
                      lastMessage:
                        _id: "msg_001"
                        text: "Chào mọi người!"
                        senderId: "user_123"
                        createdAt: "2024-01-15T10:30:00Z"
                      unreadCount: 3
                      isPinned: true
                      isMuted: false
                  total: 50
                  page: 1
                  limit: 20
        '401':
          description: Unauthorized

  /conversations/{conversationId}:
    get:
      summary: Get conversation details
      tags: [Chat - Conversations]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
            example: "60d0fe4f5311236168a109cc"
          required: true
      responses:
        '200':
          description: Conversation details
          content:
            application/json:
              example:
                data:
                  conversation:
                    _id: "conv_001"
                    name: "Nhóm Dev Team"
                    type: "GROUP"
                    avatarUrl: "https://cdn.example.com/avatar.png"
                    createdAt: "2024-01-01T00:00:00Z"
                    members: [...]
                    settings:
                      allowSendLink: true
                      requireApproval: false
                      allowMemberInvite: true
        '401':
          description: Unauthorized
        '403':
          description: Not a member of this conversation
        '404':
          description: Conversation not found

  /conversations/{conversationId}/mute:
    post:
      summary: Mute conversation
      tags: [Chat - Conversations]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
            example: "60d0fe4f5311236168a109cc"
          required: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                duration:
                  type: integer
                  description: Mute duration in seconds (optional, permanent if not provided)
                  example: 3600
                muteUntil:
                  type: string
                  format: date-time
                  description: Specific time to unmute (optional)
                  example: "2024-01-20T00:00:00Z"
      responses:
        '200':
          description: Conversation muted successfully
          content:
            application/json:
              example:
                success: true
        '401':
          description: Unauthorized
        '403':
          description: Not a member of this conversation

    delete:
      summary: Unmute conversation
      tags: [Chat - Conversations]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
            example: "60d0fe4f5311236168a109cc"
          required: true
      responses:
        '200':
          description: Conversation unmuted successfully
          content:
            application/json:
              example:
                success: true
        '401':
          description: Unauthorized

  /conversations/{conversationId}/pin-conversation:
    post:
      summary: Pin conversation
      tags: [Chat - Conversations]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
            example: "60d0fe4f5311236168a109cc"
          required: true
      responses:
        '200':
          description: Conversation pinned successfully
          content:
            application/json:
              example:
                success: true
        '401':
          description: Unauthorized

    delete:
      summary: Unpin conversation
      tags: [Chat - Conversations]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
            example: "60d0fe4f5311236168a109cc"
          required: true
      responses:
        '200':
          description: Conversation unpinned successfully
          content:
            application/json:
              example:
                success: true
        '401':
          description: Unauthorized

  /conversations/{conversationId}/archive:
    post:
      summary: Archive conversation
      tags: [Chat - Conversations]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
            example: "60d0fe4f5311236168a109cc"
          required: true
      responses:
        '200':
          description: Conversation archived successfully
          content:
            application/json:
              example:
                success: true
        '401':
          description: Unauthorized

    delete:
      summary: Unarchive conversation
      tags: [Chat - Conversations]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
            example: "60d0fe4f5311236168a109cc"
          required: true
      responses:
        '200':
          description: Conversation unarchived successfully
          content:
            application/json:
              example:
                success: true
        '401':
          description: Unauthorized

  /conversations/unread-count:
    get:
      summary: Get total unread message count
      tags: [Chat - Conversations]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Total unread count
          content:
            application/json:
              example:
                totalUnread: 42
        '401':
          description: Unauthorized

  # ==================== MESSAGES ====================
  /conversations/{conversationId}/messages:
    get:
      summary: Load messages with cursor-based pagination
      tags: [Chat - Messages]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
            example: "60d0fe4f5311236168a109cc"
          required: true
        - in: query
          name: cursor
          schema:
            type: string
          description: Cursor for pagination (message ID or timestamp)
          example: "msg_abc123"
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
            example: 20
      responses:
        '200':
          description: List of messages
          content:
            application/json:
              example:
                data:
                  messages:
                    - _id: "msg_001"
                      conversationId: "conv_001"
                      senderId: "user_123"
                      senderName: "Nguyễn Văn A"
                      senderAvatar: "https://cdn.example.com/avatars/user123.png"
                      type: "TEXT"
                      text: "Xin chào mọi người!"
                      media: []
                      reactions:
                        - emoji: "👍"
                          count: 5
                          userIds: ["user_1", "user_2"]
                      replyTo:
                        _id: "msg_000"
                        text: "Cuộc họp bắt đầu lúc 2h"
                        senderName: "Trần Thị B"
                      isPinned: false
                      isRevoked: false
                      createdAt: "2024-01-15T10:30:00Z"
                      updatedAt: "2024-01-15T10:30:00Z"
                      seenBy: ["user_1", "user_2"]
                      deliveredTo: ["user_1", "user_2", "user_3"]
                  nextCursor: "msg_abc456"
                  hasMore: true
        '401':
          description: Unauthorized
        '403':
          description: Not a member of this conversation

    post:
      summary: Send a message (returns Message[])
      description: |
        Sends a message to a conversation. Depending on content, message may be split into multiple messages:
        - `text` + `media` (no link): 1 message IMAGE/FILE
        - `text` + `media` + `link`: 2 messages: IMAGE/FILE + LINK
        - `text` + `link` (no media): 1 message LINK
        - Multiple `media` items: each IMAGE/FILE becomes separate message
        - `text` only: 1 message TEXT
        - `media` only: 1 message IMAGE/FILE
      tags: [Chat - Messages]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
            example: "60d0fe4f5311236168a109cc"
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  description: Message text content
                  maxLength: 10000
                  example: "Xin chào mọi người!"
                media:
                  type: array
                  items:
                    $ref: '#/components/schemas/MediaAttachment'
                  description: Attached media files
      responses:
        '201':
          description: Messages sent successfully (returns array of Message)
          content:
            application/json:
              example:
                data:
                  - _id: "msg_001"
                    conversationId: "conv_001"
                    senderId: "user_123"
                    type: "image"
                    text: null
                    media: [{ "url": "https://cdn.example.com/img.jpg", "mediaType": "image", "name": "photo.jpg", "size": 102400 }]
                    links: []
                    pinned: false
                    createdAt: "2024-01-15T10:30:00Z"
                  - _id: "msg_002"
                    conversationId: "conv_001"
                    senderId: "user_123"
                    type: "link"
                    text: "Hello https://example.com"
                    media: null
                    links: ["https://example.com"]
                    pinned: false
                    createdAt: "2024-01-15T10:30:00.001Z"
        '401':
          description: Unauthorized
        '422':
          description: Validation error

  /conversations/{conversationId}/seen:
    post:
      summary: Mark messages as seen
      tags: [Chat - Messages]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
            example: "60d0fe4f5311236168a109cc"
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - lastSeenMessageId
              properties:
                lastSeenMessageId:
                  type: string
                  description: ID of the last seen message
                  example: "msg_001"
      responses:
        '200':
          description: Messages marked as seen
          content:
            application/json:
              example:
                success: true
        '401':
          description: Unauthorized

  /conversations/{conversationId}/delivered:
    post:
      summary: Mark messages as delivered
      tags: [Chat - Messages]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
            example: "60d0fe4f5311236168a109cc"
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - lastDeliveredMessageId
              properties:
                lastDeliveredMessageId:
                  type: string
                  description: ID of the last delivered message
                  example: "msg_001"
      responses:
        '200':
          description: Messages marked as delivered
          content:
            application/json:
              example:
                success: true
        '401':
          description: Unauthorized

  /conversations/{conversationId}/pinned-messages:
    get:
      summary: Get all pinned messages in a conversation (sorted by pinnedAt ascending - oldest first)
      tags: [Chat - Messages]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
          example: "60d0fe4f5311236168a109cc"
          required: true
      responses:
        '200':
          description: List of pinned messages
          content:
            application/json:
              example:
                data:
                  messages:
                    - _id: "msg_001"
                      text: "Thông báo quan trọng"
                      pinnedAt: "2024-01-10T10:00:00Z"
                      pinnedBy: "user_123"
                    - _id: "msg_002"
                      text: "Thông báo mới hơn"
                      pinnedAt: "2024-01-15T10:00:00Z"
                      pinnedBy: "user_123"
        '401':
          description: Unauthorized

  /conversations/{conversationId}/media:
    get:
      summary: Get media/files/links in a conversation (cursor-based pagination)
      tags: [Chat - Messages]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
          example: "60d0fe4f5311236168a109cc"
          required: true
        - in: query
          name: cursor
          schema:
            type: string
          description: Cursor for pagination (from previous response nextCursor)
          example: "msg_abc123"
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: So luong tin nhan moi trang
        - in: query
          name: type
          schema:
            type: string
            enum: [all, image, file, link]
            default: all
          description: "Loc theo loai: all (tat ca), image (chinh anh), file (chinh file), link (chinh link)"
      responses:
        '200':
          description: List of media/files/links
          content:
            application/json:
              example:
                data:
                  images:
                    - messageId: "msg_001"
                      url: "https://cdn.example.com/img/photo.jpg"
                      name: "photo.jpg"
                      size: 102400
                      width: 1920
                      height: 1080
                      mediaType: "image"
                      senderId: "user_123"
                      createdAt: "2024-01-15T10:30:00Z"
                  files:
                    - messageId: "msg_002"
                      url: "https://cdn.example.com/files/doc.pdf"
                      name: "doc.pdf"
                      size: 204800
                      mediaType: "file"
                      senderId: "user_123"
                      createdAt: "2024-01-15T11:00:00Z"
                  links:
                    - messageId: "msg_003"
                      url: "https://example.com/article"
                      senderId: "user_123"
                      createdAt: "2024-01-15T12:00:00Z"
                  nextCursor: "msg_xyz789"
                  hasMore: true
        '401':
          description: Unauthorized
        '403':
          description: Not a member of this conversation

  /messages/{messageId}:
    put:
      summary: Edit message
      tags: [Chat - Messages]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: messageId
          schema:
            type: string
            example: "msg_001"
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  maxLength: 10000
                  example: "Nội dung đã chỉnh sửa"
      responses:
        '200':
          description: Message edited successfully
          content:
            application/json:
              example:
                data:
                  _id: "msg_001"
                  text: "Nội dung đã chỉnh sửa"
                  isEdited: true
                  editedAt: "2024-01-15T11:00:00Z"
        '401':
          description: Unauthorized
        '403':
          description: Can only edit your own messages
        '404':
          description: Message not found

  /messages/{messageId}/revoke:
    post:
      summary: Revoke/recall a message
      tags: [Chat - Messages]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: messageId
          schema:
            type: string
            example: "msg_001"
          required: true
      responses:
        '200':
          description: Message revoked successfully
          content:
            application/json:
              example:
                data:
                  _id: "msg_001"
                  isRevoked: true
                  revokedAt: "2024-01-15T11:30:00Z"
        '401':
          description: Unauthorized
        '403':
          description: Can only revoke your own messages within time limit

  /messages/{messageId}/delete:
    post:
      summary: Delete message for me only
      tags: [Chat - Messages]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: messageId
          schema:
            type: string
            example: "msg_001"
          required: true
      responses:
        '200':
          description: Message deleted for current user
          content:
            application/json:
              example:
                success: true
        '401':
          description: Unauthorized

  /messages/{messageId}/delete-for-everyone:
    post:
      summary: Delete message for everyone (revoke)
      tags: [Chat - Messages]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: messageId
          schema:
            type: string
            example: "msg_001"
          required: true
      responses:
        '200':
          description: Message deleted for everyone
          content:
            application/json:
              example:
                data:
                  _id: "msg_001"
                  isRevoked: true
                  revokedAt: "2024-01-15T11:30:00Z"
        '401':
          description: Unauthorized
        '403':
          description: Can only revoke your own messages within time limit

  /messages/{messageId}/pin:
    post:
      summary: Pin a message
      tags: [Chat - Messages]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: messageId
          schema:
            type: string
            example: "msg_001"
          required: true
      responses:
        '200':
          description: Message pinned successfully
          content:
            application/json:
              example:
                data:
                  _id: "msg_001"
                  isPinned: true
        '401':
          description: Unauthorized
        '403':
          description: Only group admins can pin messages

    delete:
      summary: Unpin a message
      tags: [Chat - Messages]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: messageId
          schema:
            type: string
            example: "msg_001"
          required: true
      responses:
        '200':
          description: Message unpinned successfully
          content:
            application/json:
              example:
                data:
                  _id: "msg_001"
                  isPinned: false
        '401':
          description: Unauthorized

  /messages/forward:
    post:
      summary: Forward messages to conversations
      description: |
        Forwards messages to target conversations. Original messages are not modified.
        System messages cannot be forwarded.
      tags: [Chat - Messages]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - messageIds
                - targetConversationIds
              properties:
                messageIds:
                  type: array
                  items:
                    type: string
                  description: IDs of messages to forward
                  example: ["msg_001", "msg_002"]
                targetConversationIds:
                  type: array
                  items:
                    type: string
                  description: Target conversation IDs
                  example: ["conv_001", "conv_002"]
      responses:
        '201':
          description: Messages forwarded successfully
          content:
            application/json:
              example:
                data:
                  - _id: "msg_new_001"
                    conversationId: "conv_001"
                    senderId: "user_123"
                    type: "text"
                    text: "Hello https://example.com"
                    links: ["https://example.com"]
                    pinned: false
                    createdAt: "2024-01-15T12:00:00Z"
                  - _id: "msg_new_002"
                    conversationId: "conv_001"
                    senderId: "user_123"
                    type: "image"
                    text: null
                    media: [{ "url": "https://cdn.example.com/img.jpg", "mediaType": "image", "name": "photo.jpg", "size": 102400 }]
                    pinned: false
                    createdAt: "2024-01-15T12:00:00Z"
        '401':
          description: Unauthorized

  /messages/{messageId}/quote:
    post:
      summary: Quote and reply to a message (returns Message)
      description: |
        Sends a reply that quotes a specific message. The conversationId is automatically determined from the quoted message.
        Similar to send message, supports text/media/link splitting.
      tags: [Chat - Messages]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: messageId
          schema:
            type: string
            example: "msg_001"
          required: true
          description: Message ID to quote/reply
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  maxLength: 10000
                  example: "Tôi đồng ý với ý kiến này"
                media:
                  type: array
                  items:
                    $ref: '#/components/schemas/MediaAttachment'
      responses:
        '201':
          description: Quote message sent
          content:
            application/json:
              example:
                data:
                  _id: "msg_quote_001"
                  conversationId: "conv_001"
                  senderId: "user_123"
                  type: "link"
                  text: "Great point! https://example.com/article"
                  links: ["https://example.com/article"]
                  media: null
                  quotedMessageId: "msg_001"
                  quotedMessagePreview: "Original message..."
                  pinned: false
                  createdAt: "2024-01-15T12:30:00Z"
        '401':
          description: Unauthorized
        '404':
          description: Original message not found

  # ==================== REACTIONS ====================
  /messages/{messageId}/reactions:
    get:
      summary: Get all reactions on a message
      tags: [Chat - Reactions]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: messageId
          schema:
            type: string
            example: "msg_001"
          required: true
      responses:
        '200':
          description: List of reactions
          content:
            application/json:
              example:
                data:
                  reactions:
                    - emoji: "👍"
                      users:
                        - _id: "user_1"
                          name: "Nguyễn Văn A"
                          avatar: "https://cdn.example.com/avatars/a.png"
                        - _id: "user_2"
                          name: "Trần Thị B"
                          avatar: "https://cdn.example.com/avatars/b.png"
                      count: 2
                    - emoji: "❤️"
                      users:
                        - _id: "user_3"
                          name: "Lê Văn C"
                          avatar: "https://cdn.example.com/avatars/c.png"
                      count: 1
        '401':
          description: Unauthorized

    delete:
      summary: Remove all reactions from message
      tags: [Chat - Reactions]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: messageId
          schema:
            type: string
            example: "msg_001"
          required: true
      responses:
        '200':
          description: All reactions removed
          content:
            application/json:
              example:
                success: true
                deletedCount: 5
        '401':
          description: Unauthorized

  /messages/{messageId}/react:
    post:
      summary: Add reaction to message
      tags: [Chat - Reactions]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: messageId
          schema:
            type: string
            example: "msg_001"
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - emoji
              properties:
                emoji:
                  type: string
                  description: Emoji unicode or emoji code
                  example: "👍"
      responses:
        '201':
          description: Reaction added
          content:
            application/json:
              example:
                data:
                  _id: "react_001"
                  messageId: "msg_001"
                  userId: "user_123"
                  emoji: "👍"
                  createdAt: "2024-01-15T10:35:00Z"
        '401':
          description: Unauthorized
        '409':
          description: Reaction already exists

    delete:
      summary: Remove specific reaction (emoji) from message
      tags: [Chat - Reactions]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: messageId
          schema:
            type: string
            example: "msg_001"
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - emoji
              properties:
                emoji:
                  type: string
                  description: Emoji to remove
                  example: "👍"
      responses:
        '200':
          description: Reaction removed
          content:
            application/json:
              example:
                success: true
                deletedCount: 1
        '401':
          description: Unauthorized

  # ==================== GROUPS ====================
  /groups:
    post:
      summary: Create a new group
      tags: [Chat - Groups]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - memberIds
              properties:
                name:
                  type: string
                  maxLength: 100
                  example: "Nhóm Dev Team"
                memberIds:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  description: Initial member IDs (excluding creator)
                  example: ["user_001", "user_002", "user_003"]
                avatarUrl:
                  type: string
                  format: uri
                  description: Group avatar URL
                  example: "https://cdn.example.com/groups/avatar.png"
      responses:
        '201':
          description: Group created successfully
          content:
            application/json:
              example:
                data:
                  conversation:
                    _id: "conv_group_001"
                    name: "Nhóm Dev Team"
                    type: "GROUP"
                    avatarUrl: "https://cdn.example.com/groups/avatar.png"
                    ownerId: "user_123"
                    createdAt: "2024-01-15T10:00:00Z"
                  systemMessage:
                    _id: "sys_001"
                    type: "SYSTEM"
                    text: "Nguyễn Văn A đã tạo nhóm"
                    createdAt: "2024-01-15T10:00:00Z"
                  members: [...]
        '401':
          description: Unauthorized
        '422':
          description: Validation error

  /groups/{groupId}/info:
    get:
      summary: Get group info
      tags: [Chat - Groups]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
            example: "conv_group_001"
          required: true
      responses:
        '200':
          description: Group information
          content:
            application/json:
              example:
                data:
                  _id: "conv_group_001"
                  name: "Nhóm Dev Team"
                  type: "GROUP"
                  avatarUrl: "https://cdn.example.com/groups/avatar.png"
                  description: "Nhóm thảo luận công việc"
                  ownerId: "user_123"
                  adminIds: ["user_001", "user_002"]
                  memberCount: 15
                  createdAt: "2024-01-01T00:00:00Z"
        '401':
          description: Unauthorized
        '403':
          description: Not a member of this group
        '404':
          description: Group not found

  /groups/{groupId}:
    put:
      summary: Update group info
      tags: [Chat - Groups]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
            example: "conv_group_001"
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 100
                  example: "Dev Team - Updated"
                avatarUrl:
                  type: string
                  format: uri
                  example: "https://cdn.example.com/groups/avatar-new.png"
      responses:
        '200':
          description: Group updated
          content:
            application/json:
              example:
                data:
                  _id: "conv_group_001"
                  name: "Dev Team - Updated"
                  avatarUrl: "https://cdn.example.com/groups/avatar-new.png"
        '401':
          description: Unauthorized
        '403':
          description: Only owner or admins can update group

  /groups/{groupId}/members:
    get:
      summary: Get group members
      tags: [Chat - Groups]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
            example: "conv_group_001"
          required: true
      responses:
        '200':
          description: List of group members
          content:
            application/json:
              example:
                data:
                  members:
                    - _id: "mem_001"
                      userId: "user_123"
                      name: "Nguyễn Văn A"
                      avatar: "https://cdn.example.com/avatars/a.png"
                      role: "OWNER"
                      joinedAt: "2024-01-01T00:00:00Z"
                    - _id: "mem_002"
                      userId: "user_001"
                      name: "Trần Thị B"
                      avatar: "https://cdn.example.com/avatars/b.png"
                      role: "ADMIN"
                      joinedAt: "2024-01-02T00:00:00Z"
        '401':
          description: Unauthorized

    post:
      summary: Add members to group
      tags: [Chat - Groups]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
            example: "conv_group_001"
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - memberIds
              properties:
                memberIds:
                  type: array
                  items:
                    type: string
                  example: ["user_004", "user_005"]
      responses:
        '200':
          description: Members added
          content:
            application/json:
              example:
                data:
                  newMembers:
                    - _id: "mem_new_001"
                      userId: "user_004"
                      name: "Lê Văn D"
                      avatar: "https://cdn.example.com/avatars/d.png"
                      role: "MEMBER"
                      joinedAt: "2024-01-15T11:00:00Z"
        '401':
          description: Unauthorized
        '403':
          description: Only owner or admins can add members

  /groups/{groupId}/members/{userId}:
    delete:
      summary: Remove member from group
      tags: [Chat - Groups]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
            example: "conv_group_001"
          required: true
        - in: path
          name: userId
          schema:
            type: string
          required: true
          description: User ID to remove
          example: "user_003"
      responses:
        '204':
          description: Member removed
        '401':
          description: Unauthorized
        '403':
          description: Only owner or admins can remove members

  /groups/{groupId}/leave:
    post:
      summary: Leave group
      tags: [Chat - Groups]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
            example: "conv_group_001"
          required: true
      responses:
        '200':
          description: Left group successfully
          content:
            application/json:
              example:
                success: true
        '401':
          description: Unauthorized
        '400':
          description: Owner cannot leave, must transfer ownership first

  /groups/{groupId}/set-admin:
    post:
      summary: Set/remove admin
      tags: [Chat - Groups]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
            example: "conv_group_001"
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - targetUserId
                - isAdmin
              properties:
                targetUserId:
                  type: string
                  example: "user_001"
                isAdmin:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Admin status updated
          content:
            application/json:
              example:
                data:
                  _id: "conv_group_001"
                  adminIds: ["user_001", "user_002"]
        '401':
          description: Unauthorized
        '403':
          description: Only owner can change admin status

  /groups/{groupId}/transfer-owner:
    post:
      summary: Transfer group ownership
      tags: [Chat - Groups]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
            example: "conv_group_001"
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newOwnerId
              properties:
                newOwnerId:
                  type: string
                  example: "user_001"
      responses:
        '200':
          description: Ownership transferred
          content:
            application/json:
              example:
                data:
                  _id: "conv_group_001"
                  ownerId: "user_001"
                  oldOwnerId: "user_123"
        '401':
          description: Unauthorized
        '403':
          description: Only current owner can transfer ownership

  /groups/{groupId}/members/pending:
    get:
      summary: Get pending member requests
      tags: [Chat - Groups]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
            example: "conv_group_001"
          required: true
      responses:
        '200':
          description: List of pending members
          content:
            application/json:
              example:
                data:
                  pendingMembers:
                    - _id: "req_001"
                      userId: "user_006"
                      name: "Phạm Thị F"
                      avatar: "https://cdn.example.com/avatars/f.png"
                      requestedAt: "2024-01-15T10:00:00Z"
        '401':
          description: Unauthorized

  /groups/{groupId}/members/{userId}/approve:
    patch:
      summary: Approve pending member
      tags: [Chat - Groups]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
            example: "conv_group_001"
          required: true
        - in: path
          name: userId
          schema:
            type: string
            example: "user_006"
          required: true
      responses:
        '200':
          description: Member approved
          content:
            application/json:
              example:
                data:
                  member:
                    _id: "mem_new_001"
                    userId: "user_006"
                    name: "Phạm Thị F"
                    role: "MEMBER"
                    joinedAt: "2024-01-15T12:00:00Z"
        '401':
          description: Unauthorized
        '403':
          description: Only admins can approve members

  /groups/{groupId}/members/{userId}/reject:
    patch:
      summary: Reject pending member
      tags: [Chat - Groups]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
            example: "conv_group_001"
          required: true
        - in: path
          name: userId
          schema:
            type: string
            example: "user_006"
          required: true
      responses:
        '200':
          description: Member rejected
          content:
            application/json:
              example:
                success: true
        '401':
          description: Unauthorized
        '403':
          description: Only admins can reject members

  /groups/{groupId}/settings:
    patch:
      summary: Update group settings
      tags: [Chat - Groups]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
            example: "conv_group_001"
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allowSendLink:
                  type: boolean
                  description: Allow members to send links
                  example: true
                requireApproval:
                  type: boolean
                  description: Require admin approval for new members
                  example: false
                allowMemberInvite:
                  type: boolean
                  description: Allow members to invite others
                  example: true
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              example:
                data:
                  settings:
                    allowSendLink: true
                    requireApproval: false
                    allowMemberInvite: true
        '401':
          description: Unauthorized
        '403':
          description: Only owner or admins can update settings

  # ==================== POLLS ====================
  /groups/{groupId}/polls:
    get:
      summary: Get all polls in a group
      tags: [Chat - Polls]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
            example: "conv_group_001"
          required: true
      responses:
        '200':
          description: List of polls
          content:
            application/json:
              example:
                data:
                  polls:
                    - _id: "poll_001"
                      conversationId: "conv_group_001"
                      question: "Chọn ngày họp?"
                      options:
                        - _id: "opt_001"
                          text: "Thứ 2"
                          voteCount: 5
                        - _id: "opt_002"
                          text: "Thứ 3"
                          voteCount: 3
                      isMultipleChoice: false
                      allowAddOption: true
                      createdBy: "user_123"
                      createdAt: "2024-01-15T10:00:00Z"
                      expiresAt: "2024-01-20T10:00:00Z"
                      totalVotes: 8
        '401':
          description: Unauthorized

    post:
      summary: Create a poll
      tags: [Chat - Polls]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
            example: "conv_group_001"
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - question
                - options
              properties:
                question:
                  type: string
                  maxLength: 500
                  example: "Chọn ngày họp?"
                options:
                  type: array
                  items:
                    type: string
                  minItems: 2
                  maxItems: 20
                  example: ["Thứ 2", "Thứ 3", "Thứ 4"]
                isMultipleChoice:
                  type: boolean
                  default: false
                  description: Allow voting for multiple options
                  example: false
                allowAddOption:
                  type: boolean
                  default: true
                  description: Allow members to add new options
                  example: true
                expiresAt:
                  type: string
                  format: date-time
                  description: Poll expiration time (optional)
                  example: "2024-01-20T10:00:00Z"
      responses:
        '201':
          description: Poll created
          content:
            application/json:
              example:
                data:
                  _id: "poll_001"
                  conversationId: "conv_group_001"
                  question: "Chọn ngày họp?"
                  options: [...]
                  createdAt: "2024-01-15T10:00:00Z"
        '401':
          description: Unauthorized
        '403':
          description: Only group members can create polls

  /groups/{groupId}/polls/{pollId}/vote:
    post:
      summary: Vote on a poll
      tags: [Chat - Polls]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
            example: "conv_group_001"
          required: true
        - in: path
          name: pollId
          schema:
            type: string
            example: "poll_001"
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - optionIds
              properties:
                optionIds:
                  type: array
                  items:
                    type: string
                  description: Option IDs to vote for
                  example: ["opt_001"]
      responses:
        '200':
          description: Vote recorded
          content:
            application/json:
              example:
                data:
                  _id: "poll_001"
                  options: [...]
                  totalVotes: 9
        '401':
          description: Unauthorized
        '400':
          description: Poll has expired
        '422':
          description: Invalid option IDs

  /groups/{groupId}/polls/{pollId}/results:
    get:
      summary: Get poll results
      tags: [Chat - Polls]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
            example: "conv_group_001"
          required: true
        - in: path
          name: pollId
          schema:
            type: string
            example: "poll_001"
          required: true
      responses:
        '200':
          description: Poll results
          content:
            application/json:
              example:
                data:
                  _id: "poll_001"
                  question: "Chọn ngày họp?"
                  options:
                    - _id: "opt_001"
                      text: "Thứ 2"
                      voteCount: 5
                      percentage: 62.5
                      votedBy:
                        - userId: "user_001"
                          votedAt: "2024-01-15T10:30:00Z"
                    - _id: "opt_002"
                      text: "Thứ 3"
                      voteCount: 3
                      percentage: 37.5
                      votedBy:
                        - userId: "user_002"
                          votedAt: "2024-01-15T10:35:00Z"
                  totalVotes: 8
                  isExpired: false
        '401':
          description: Unauthorized

components:
  schemas:
    ConversationResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            _id:
              type: string
              example: "conv_001"
            name:
              type: string
              example: "Nhóm Dev Team"
            type:
              type: string
              enum: [PRIVATE, GROUP]
              example: "GROUP"
            avatarUrl:
              type: string
              format: uri
            lastMessage:
              type: object
            unreadCount:
              type: integer
            isPinned:
              type: boolean
            isMuted:
              type: boolean

    MediaAttachment:
      type: object
      properties:
        fileId:
          type: string
          description: File ID from media service
          example: "file_abc123"
        type:
          type: string
          enum: [IMAGE, VIDEO, AUDIO, DOCUMENT]
          example: "IMAGE"
        url:
          type: string
          format: uri
          description: URL of the media file
        thumbnailUrl:
          type: string
          format: uri
          description: Thumbnail URL (for video/images)
        filename:
          type: string
          example: "photo.jpg"
        size:
          type: integer
          description: File size in bytes
        width:
          type: integer
          description: Image/video width in pixels
        height:
          type: integer
          description: Image/video height in pixels
        duration:
          type: integer
          description: Audio/video duration in seconds
        mimeType:
          type: string
          example: "image/jpeg"
