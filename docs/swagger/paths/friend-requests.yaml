paths:
  /friend-requests/{receiverId}:
    post:
      summary: Send a friend request
      tags: [Friend Requests]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: receiverId
          schema:
            type: string
            example: "60d0fe4f5311236168a10001"
          required: true
          description: "ID người dùng muốn kết bạn"
      responses:
        "201":
          description: Request sent
          content:
            application/json:
              example:
                data:
                  id: "60d0fe4f5311236168a20000"
                  status: "pending"

  /friend-requests/{requestId}:
    patch:
      summary: Update friend request status (accept/reject/cancel)
      tags: [Friend Requests]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: requestId
          schema:
            type: string
            example: "60d0fe4f5311236168a20000"
          required: true
          description: "ID của lời mời kết bạn"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [accepted, rejected, canceled]
                  example: "accepted"
      responses:
        "200":
          description: Request updated
          content:
            application/json:
              example:
                data:
                  id: "60d0fe4f5311236168a20000"
                  status: "accepted"
    delete:
      summary: Cancel a sent friend request
      tags: [Friend Requests]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: requestId
          schema:
            type: string
            example: "60d0fe4f5311236168a20000"
          required: true
          description: "ID của lời mời kết bạn muốn hủy"
      responses:
        "204":
          description: Request cancelled

  /friend-requests/received:
    get:
      summary: Get received friend requests
      tags: [Friend Requests]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: "So trang"
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: "So luong moi trang"
      responses:
        "200":
          description: List of received requests
          content:
            application/json:
              example:
                data:
                  items:
                    - id: "60d0fe4f5311236168a20000"
                      fromUserId: "60d0fe4f5311236168a10002"
                      toUserId: "60d0fe4f5311236168a10001"
                      status: "pending"
                      createdAt: "2026-04-01T10:00:00.000Z"
                  total: 1
                  page: 1
                  limit: 20
                  hasMore: false

  /friend-requests/sent:
    get:
      summary: Get sent friend requests
      tags: [Friend Requests]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: "So trang"
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: "So luong moi trang"
      responses:
        "200":
          description: List of sent requests
          content:
            application/json:
              example:
                data:
                  items:
                    - id: "60d0fe4f5311236168a20000"
                      fromUserId: "60d0fe4f5311236168a10001"
                      toUserId: "60d0fe4f5311236168a10002"
                      status: "pending"
                      createdAt: "2026-04-01T10:00:00.000Z"
                  total: 1
                  page: 1
                  limit: 20
                  hasMore: false

  /friend-requests/check/{targetUserId}:
    get:
      summary: Check friend request status with a user
      tags: [Friend Requests]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: targetUserId
          schema:
            type: string
            example: "60d0fe4f5311236168a10001"
          required: true
          description: "ID người dùng muốn kiểm tra"
      responses:
        "200":
          description: Friend request status
          content:
            application/json:
              example:
                data:
                  status: "PENDING"
                  requestId: "60d0fe4f5311236168a20000"
                  direction: "OUTGOING"

  /friend-requests/count:
    get:
      summary: Get friend request counts
      tags: [Friend Requests]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Number of received and sent friend requests
          content:
            application/json:
              example:
                data:
                  received: 3
                  sent: 1
