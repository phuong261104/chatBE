                        type: string
                        format: email
                        example: "phuong.boss@example.com"
              example:
                status: "success"
                msg: "OK"
                data:
                  email: "phuong.boss@example.com"
        '404':
          description: "No active account with an unverified email was found for this phone"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
