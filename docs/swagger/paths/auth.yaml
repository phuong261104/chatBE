  /v1/auth/send-verification:
    post:
      summary: "Send email verification code"
      tags: [Auth]
      description: |
        Public endpoint. Send a 6-digit verification code to email address.
        
        ## Rate Limiting
        
        - Maximum **5 requests per hour** per email
        - Returns `429` if limit exceeded
        - Show countdown to user before allowing resend
        
        ## Frontend Implementation (JavaScript)
        
        ```javascript
        async function sendVerification(email) {
          const response = await fetch('/auth/send-verification', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email })
          });
          
          if (response.status === 429) {
            showToast('Too many requests. Please try again later.');
            return { success: false, waitTime: 3600 };
          }
          
          if (response.ok) {
            showToast('Verification code sent to your email');
            return { success: true };
          }
        }
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: "phuong.boss@example.com"
      responses:
        '200':
          description: "Verification code sent successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Verification code sent successfully"
        '404':
          description: "Email not found in the system"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Email not found"
        '429':
          description: "Rate limit exceeded - too many requests"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Too many requests. Please try again later."

  /v1/auth/verify-email:
    post:
      summary: "Verify email with code"
      tags: [Auth]
      description: |
        Verify email address using 6-digit code received via email.
        
        ## Constraints
        
        - Code expires in **5 minutes** (300 seconds)
        - Maximum **3 failed attempts** before code is invalidated
        - After max attempts → must request new code
        
        ## Response Codes
        
        | Status | Meaning |
        |--------|---------|
        | 200 | Email verified successfully |
        | 400 | Invalid code or code expired |
        | 429 | Too many failed attempts - code invalidated |
        
        ## Frontend Implementation (JavaScript)
        
        ```javascript
        async function verifyEmail(email, code) {
          const response = await fetch('/auth/verify-email', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, code })
          });
          
          if (response.ok) {
            showToast('Email verified successfully!');
            navigate('/home');
            return { success: true };
          }
          
          const { message } = await response.json();
          
          if (response.status === 429) {
            showToast('Too many attempts. Please request a new code.');
            return { success: false, needNewCode: true };
          }
          
          showToast(message);
          return { success: false };
        }
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
              properties:
                email:
                  type: string
                  format: email
                  example: "phuong.boss@example.com"
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
                  example: "123456"
                  description: "Mã xác thực 6 chữ số"
      responses:
        '200':
          description: "Email verified successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      verified:
                        type: boolean
                        example: true
                  message:
                    type: string
                    example: "Email verified successfully"
        '400':
          description: "Invalid verification code or code expired"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "Unauthorized - valid access token required"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: "Too many failed attempts - code is invalidated"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Too many attempts"

  /v1/auth/resend-verification:
    post:
      summary: "Resend email verification code"
      tags: [Auth]
      description: |
        Public endpoint. Resend verification code to email.
        Uses same rate limit as `/auth/send-verification` (5 requests/hour).
        
        ## Frontend Implementation (JavaScript)
        
        ```javascript
        async function resendVerification(email) {
          // Check local cooldown first
          const lastSent = localStorage.getItem('lastVerificationSent');
          if (lastSent && Date.now() - lastSent < 60000) {
            const remaining = Math.ceil((60000 - (Date.now() - lastSent)) / 1000);
            showToast(`Please wait ${remaining}s before resending`);
            return;
          }
          
          const response = await fetch('/auth/resend-verification', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email })
          });
          
          if (response.ok) {
            localStorage.setItem('lastVerificationSent', Date.now());
            showToast('New verification code sent');
          }
        }
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: "phuong.boss@example.com"
      responses:
        '200':
          description: "Verification code resent successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Verification code resent successfully"
        '404':
          description: "Email not found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Email not found"
        '429':
          description: "Rate limit exceeded"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/forgot-password:
    post:
      summary: "Send password reset OTP"
      tags: [Auth]
      description: |
        Send a 6-digit OTP to email for password reset.
        
        ## Password Reset Flow
        
        ```
        1. /auth/forgot-password     → receive OTP via email
        2. /auth/verify-reset-otp     → verify OTP → receive tempToken
        3. /auth/reset-password      → set new password with tempToken
        ```
        
        ## Rate Limiting
        
        - Maximum **5 requests per hour** per email
        - OTP expires in **5 minutes** (300 seconds)
        
        ## Frontend Implementation (JavaScript)
        
        ```javascript
        async function requestPasswordReset(email) {
          const response = await fetch('/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          
          if (response.ok) {
            // Navigate to OTP input screen
            navigate('/reset-password/verify', { email });
          }
          
          return response.json();
        }
        ```
        
        ## UI Flow
        
        1. User enters email
        2. Show loading state
        3. On success → navigate to OTP input screen
        4. Show countdown timer (5 minutes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: "phuong.boss@example.com"
      responses:
        '200':
          description: "OTP sent to email"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Verification code has been sent to your email"
                  expiresIn:
                    type: integer
                    example: 300
                    description: "OTP expiration time in seconds"
        '404':
          description: "Email not found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Email not found"
        '401':
          description: "Unauthorized - valid access token required"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Unauthorized"
        '429':
          description: "Rate limit exceeded"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/verify-reset-otp:
    post:
      summary: "Verify password reset OTP"
      tags: [Auth]
      description: |
        Verify OTP received via email for password reset.
        
        ## Password Reset Flow
        
        ```
        1. /auth/forgot-password     → receive OTP via email
        2. /auth/verify-reset-otp    → verify OTP → receive tempToken  ← THIS ENDPOINT
        3. /auth/reset-password      → set new password with tempToken
        ```
        
        ## Constraints
        
        - OTP expires in **5 minutes** (300 seconds)
        - Maximum **3 failed attempts** before OTP is invalidated
        - After max attempts → must request new OTP
        
        ## Frontend Implementation (JavaScript)
        
        ```javascript
        async function verifyResetOTP(email, otp) {
          const response = await fetch('/auth/verify-reset-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, otp })
          });
          
          if (response.ok) {
            const { data } = await response.json();
            // Navigate to new password screen with tempToken
            navigate('/reset-password/set', { 
              tempToken: data.tempToken,
              email 
            });
            return { success: true };
          }
          
          const { message } = await response.json();
          return { success: false, message };
        }
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                  format: email
                  example: "phuong.boss@example.com"
                otp:
                  type: string
                  pattern: '^[0-9]{6}$'
                  example: "123456"
                  description: "Mã OTP 6 chữ số"
      responses:
        '200':
          description: "OTP verified successfully - returns tempToken"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetOTPVerifyResponse'
              example:
                data:
                  tempToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  expiresIn: 300
                message: "OTP verified successfully"
        '400':
          description: "Invalid OTP"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Email not found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: "OTP has expired"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: "Too many failed attempts - OTP is invalidated"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

