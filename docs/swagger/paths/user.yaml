paths:
  /v1/users/profile:
    get:
      summary: Xem profile tài khoản
      tags: [Profile]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Thông tin profile tài khoản
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "660c1d..."
                      displayName:
                        type: string
                        example: "Boss Phương"
                      avatarUrl:
                        type: string
                        example: "https://example.com/avatar.jpg"
                      bio:
                        type: string
                        example: "Giới thiệu bản thân"
                      phone:
                        type: string
                        example: "0912345678"
                      email:
                        type: string
                        example: "phuong.boss@example.com"
                      verified:
                        type: object
                        properties:
                          email:
                            type: boolean
                          phone:
                            type: boolean
                      privacy:
                        type: object
                        properties:
                          searchableByEmail:
                            type: boolean
                          searchableByPhone:
                            type: boolean
                          searchableByUsername:
                            type: boolean
                      settings:
                        type: object
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
    patch:
      summary: Cập nhật profile tài khoản
      tags: [Profile]
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: "Phương Nguyễn Cập Nhật"
                avatarUrl:
                  type: string
                  format: uri
                  example: "https://example.com/new-avatar.jpg"
                bio:
                  type: string
                  maxLength: 500
                  example: "Giới thiệu bản thân"
              example:
                displayName: "Phương Nguyễn Cập Nhật"
                avatarUrl: "https://example.com/new-avatar.jpg"
                bio: "Đây là bio mới của tôi"
      responses:
        '200':
          description: Profile đã được cập nhật
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: boolean
                    example: true

  /v1/users:
    get:
      summary: Get list of users
      tags: [Users]
      security: []
      responses:
        '200':
          description: A list of users
    post:
      summary: Create user (Admin)
      tags: [Users]
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: 
                  type: string
                  example: "0988776655"
                password: 
                  type: string
                  example: "Secret123!"
                role: 
                  type: string
                  example: "ADMIN"
                  enum: [USER, ADMIN]
      responses:
        '201':
          description: Created user

  /v1/users/search:
    get:
      summary: Tim kiem nguoi dung theo tu khoa
      tags: [Users]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: q
          schema:
            type: string
            example: "Phuong"
          required: true
          description: "Tu khoa tim kiem (theo displayName hoac username)"
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            example: 20
          required: false
          description: "So luong ket qua toi da (mac dinh 20)"
      responses:
        '200':
          description: Danh sach nguoi dung phu hop
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: "660c1d..."
                        displayName:
                          type: string
                          example: "Boss Phuong"
                        avatarUrl:
                          type: string
                          example: "https://example.com/avatar.jpg"
                        username:
                          type: string
                          example: "phuongboss2026"
        '422':
          description: Tu khoa trong

  /v1/users/search-by-phone:
    get:
      summary: Tim nguoi dung bang so dien thoai
      tags: [Users]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: phone
          schema:
            type: string
            example: "0912345678"
          required: true
          description: "So dien thoai chinh xac (10 chu so)"
      responses:
        '200':
          description: Tim thay nguoi dung
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "660c1d..."
                      displayName:
                        type: string
                        example: "Boss Phuong"
                      avatarUrl:
                        type: string
                        example: "https://example.com/avatar.jpg"
                      bio:
                        type: string
                        example: "Gioi thieu ban than"
                      phone:
                        type: string
                        example: "0912345678"
                      email:
                        type: string
                        example: "phuong.boss@example.com"
                      username:
                        type: string
                        example: "phuongboss2026"
                      verified:
                        type: object
                        properties:
                          email:
                            type: boolean
                          phone:
                            type: boolean
                      privacy:
                        type: object
                        properties:
                          searchableByEmail:
                            type: boolean
                          searchableByPhone:
                            type: boolean
                          searchableByUsername:
                            type: boolean
                      settings:
                        type: object
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        '404':
          description: Khong tim thay nguoi dung
        '422':
          description: So dien thoai khong hop le

  /v1/users/{id}/public:
    get:
      summary: Lay ho so cong khai cua nguoi dung
      tags: [Users]
      parameters:
        - in: path
          name: id
          schema:
            type: string
            example: "660c1d..."
          required: true
          description: "ID cua nguoi dung can xem ho so"
      responses:
        '200':
          description: Ho so cong khai cua nguoi dung
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "660c1d..."
                      displayName:
                        type: string
                        example: "Boss Phuong"
                      username:
                        type: string
                        example: "phuongboss2026"
                      avatarUrl:
                        type: string
                        example: "https://example.com/avatar.jpg"
                      coverUrl:
                        type: string
                        example: "https://example.com/cover.jpg"
                      bio:
                        type: string
                        example: "Gioi thieu ban than"
                      birthday:
                        type: string
                        format: date-time
                      gender:
                        type: string
                        enum: [male, female, other]
                      phone:
                        type: string
                        example: "0912345678"
                      email:
                        type: string
                        description: "Chi tra khi viewer la chinh user hoac ban be active"
                      verified:
                        type: object
                        properties:
                          email:
                            type: boolean
                          phone:
                            type: boolean
                      relationship:
                        type: object
                        properties:
                          status:
                            type: string
                            enum: [self, friend, blocked_by_me, blocking_me, none]
                          isSelf:
                            type: boolean
                          isFriend:
                            type: boolean
                          isBlockedByMe:
                            type: boolean
                          isBlockingMe:
                            type: boolean
                      fieldVisibility:
                        type: object
                        properties:
                          avatarUrl:
                            type: string
                            enum: [visible, hidden]
                          coverUrl:
                            type: string
                            enum: [visible, hidden]
                          birthday:
                            type: string
                            enum: [visible, hidden]
                          phone:
                            type: string
                            enum: [visible, hidden]
                          email:
                            type: string
                            enum: [visible, hidden]
                      canSendMessage:
                        type: boolean
        '400':
          description: Khong lay duoc ho so

  /v1/users/{id}:
    get:
      summary: Get user details
      tags: [Users]
      security: []
      parameters:
        - in: path
          name: id
          schema: 
            type: string
            example: "60d0fe4f5311236168a109ca"
          required: true
      responses:
        '200':
          description: User details
    patch:
      summary: Update user (Admin)
      tags: [Users]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema: 
            type: string
            example: "60d0fe4f5311236168a109ca"
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                displayName: "Updated User"
      responses:
        '200':
          description: User updated
    delete:
      summary: Delete user (Admin)
      tags: [Users]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema: 
            type: string
            example: "60d0fe4f5311236168a109ca"
          required: true
      responses:
        '200':
          description: User deleted

  /v1/users/{id}/presence:
    get:
      summary: Lay trang thai online cua nguoi dung
      tags: [Users]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
            example: "660c1d..."
          required: true
          description: "ID cua nguoi dung can kiem tra"
      responses:
        '200':
          description: Trang thai online cua nguoi dung
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      userId:
                        type: string
                        example: "660c1d..."
                      isOnline:
                        type: boolean
                        example: true
                      lastSeen:
                        type: string
                        format: date-time
                        example: "2026-04-01T10:15:30Z"
        '422':
          description: ID nguoi dung khong hop le
