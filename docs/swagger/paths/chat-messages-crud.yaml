paths:
  /v1/conversations/{conversationId}/messages:
    get:
      summary: Load messages with cursor-based pagination
      tags: [Chat - Messages]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
            example: "0192a3bc-def0-7abc-8901-23456789abcd"
          required: true
        - in: query
          name: cursor
          schema:
            type: string
          description: Cursor for pagination (message ID or timestamp)
          example: "0192a3bc-def0-7abc-8901-23456789abce"
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
            example: 20
      responses:
        "200":
          description: List of messages with pagination and seen status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      messages:
                        type: array
                        items:
                          $ref: "./chat-schemas.yaml#/components/schemas/MessageResponse"
                      nextCursor:
                        type: string
                        nullable: true
                        description: Cursor for next page (message ID). Empty string if no more messages.
                        example: "0192a3bc-def0-7abc-8901-23456789abcf"
                      hasMore:
                        type: boolean
                        description: Whether there are more messages after this page.
                        example: true
                      memberSeenMap:
                        type: object
                        additionalProperties:
                          type: string
                          description: The last message ID seen by this member.
                          example: "0192a3bc-def0-7abc-8901-23456789abca"
                        description: |
                          Map of userId -> lastSeenMessageId for other members in the conversation.
                          Used by frontend to compute isSeen: message.id <= memberSeenMap[otherUserId].
                          Only includes members who have called markAsSeen (excludes current viewer).
              example:
                data:
                  messages:
                    - _id: "msg_001"
                      conversationId: "conv_001"
                      senderId: "user_123"
                      senderName: "Nguyễn Văn A"
                      senderAvatar: "https://cdn.example.com/avatars/user123.png"
                      type: "text"
                      text: "Xin chào mọi người!"
                      media: []
                      reactions:
                        - emoji: "👍"
                          count: 2
                          users:
                            - _id: "user_1"
                              displayName: "Nguyễn Văn B"
                              avatarUrl: "https://cdn.example.com/avatars/b.png"
                            - _id: "user_2"
                              displayName: "Trần Thị C"
                              avatarUrl: "https://cdn.example.com/avatars/c.png"
                      replyToId: "msg_000"
                      replyTo:
                        _id: "msg_000"
                        senderId: "user_456"
                        senderName: "Trần Thị B"
                        text: "Cuộc họp bắt đầu lúc 2h"
                      isPinned: false
                      isRevoked: false
                      createdAt: "2024-01-15T10:30:00Z"
                      updatedAt: "2024-01-15T10:30:00Z"
                  nextCursor: "msg_abc456"
                  hasMore: true
                  memberSeenMap:
                    user_456: "msg_001"
                    user_789: "msg_003"
        "401":
          description: Unauthorized - Missing or invalid token
        "403":
          description: Forbidden - User is not a member of this conversation

    post:
      summary: Send a message (returns Message[])
      description: |
        Sends a message to a conversation. Depending on content, message may be split into multiple messages:
        - `text` + `media` (no link): 1 message IMAGE/FILE
        - `text` + `media` + `link`: 2 messages: IMAGE/FILE + LINK
        - `text` + `link` (no media): 1 message LINK
        - Multiple `media` items: each IMAGE/FILE becomes separate message
        - `text` only: 1 message TEXT
        - `media` only: 1 message IMAGE/FILE
      tags: [Chat - Messages]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
            example: "0192a3bc-def0-7abc-8901-23456789abcd"
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: Message text content (optional if media is provided)
                  maxLength: 5000
                  example: "Xin chào mọi người!"
                media:
                  type: array
                  items:
                    $ref: "./chat-schemas.yaml#/components/schemas/MediaAttachment"
                  description: Attached media files
                links:
                  type: array
                  items:
                    type: string
                  description: URLs detected in the message text (optional, auto-detected if not provided)
                  example: ["https://example.com"]
      responses:
        "201":
          description: Messages sent successfully (returns array of Message)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "./chat-schemas.yaml#/components/schemas/MessageResponse"
              example:
                data:
                  - _id: "msg_001"
                    conversationId: "conv_001"
                    senderId: "user_123"
                    type: "image"
                    text: null
                    media:
                      [
                        {
                          "url": "https://cdn.example.com/img.jpg",
                          "mediaType": "image",
                          "name": "photo.jpg",
                          "size": 102400,
                        },
                      ]
                    links: []
                    pinned: false
                    createdAt: "2024-01-15T10:30:00Z"
                  - _id: "msg_002"
                    conversationId: "conv_001"
                    senderId: "user_123"
                    type: "link"
                    text: "Hello https://example.com"
                    media: null
                    links: ["https://example.com"]
                    pinned: false
                    createdAt: "2024-01-15T10:30:00.001Z"
        "401":
          description: Unauthorized
        "422":
          description: Validation error

  /v1/messages/{messageId}:
    put:
      summary: Edit message
      tags: [Chat - Messages]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: messageId
          schema:
            type: string
            example: "msg_001"
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  maxLength: 5000
                  example: "Nội dung đã chỉnh sửa"
      responses:
        "200":
          description: Message edited successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "./chat-schemas.yaml#/components/schemas/MessageResponse"
              example:
                data:
                  _id: "msg_001"
                  conversationId: "conv_001"
                  senderId: "user_123"
                  senderName: "Nguyễn Văn A"
                  type: "text"
                  text: "Nội dung đã chỉnh sửa"
                  media: []
                  links: []
                  isEdited: true
                  editedAt: "2024-01-15T11:00:00Z"
                  createdAt: "2024-01-15T10:30:00Z"
                  updatedAt: "2024-01-15T11:00:00Z"
        "401":
          description: Unauthorized
        "403":
          description: Can only edit your own messages
        "404":
          description: Message not found
