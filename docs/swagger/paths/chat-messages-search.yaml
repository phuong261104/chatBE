paths:
  /v1/conversations/{conversationId}/pinned-messages:
    get:
      summary: Get all pinned messages in a conversation (sorted by pinnedAt ascending - oldest first)
      tags: [Chat - Messages]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
          example: "0192a3bc-def0-7abc-8901-23456789abcd"
          required: true
      responses:
        "200":
          description: List of pinned messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "./chat-schemas.yaml#/components/schemas/MessageResponse"
              example:
                data:
                  - _id: "msg_001"
                    conversationId: "conv_001"
                    senderId: "user_123"
                    senderName: "Nguyễn Văn A"
                    type: "text"
                    text: "Thông báo quan trọng"
                    media: []
                    isPinned: true
                    pinnedAt: "2024-01-10T10:00:00Z"
                    createdAt: "2024-01-10T09:00:00Z"
                  - _id: "msg_002"
                    conversationId: "conv_001"
                    senderId: "user_456"
                    senderName: "Trần Thị B"
                    type: "text"
                    text: "Thông báo mới hơn"
                    media: []
                    isPinned: true
                    pinnedAt: "2024-01-15T10:00:00Z"
                    createdAt: "2024-01-15T09:00:00Z"
        "401":
          description: Unauthorized
        "403":
          description: Not a member of this conversation

  /v1/conversations/{conversationId}/search:
    get:
      summary: Search messages within a conversation
      tags: [Chat - Messages]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
          required: true
        - in: query
          name: query
          schema:
            type: string
          required: true
          description: Từ khóa tìm kiếm
          example: "hợp đồng"
        - in: query
          name: cursor
          schema:
            type: string
          description: Cursor cho phân trang
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            example: 20
      responses:
        "200":
          description: Kết quả tìm kiếm
          content:
            application/json:
              example:
                data:
                  messages: []
                  nextCursor: "msg_xyz"
                  hasMore: false
        "401":
          description: Unauthorized
        "403":
          description: Not a member of this conversation

  /v1/conversations/{conversationId}/media:
    get:
      summary: Get media/files/links in a conversation (cursor-based pagination)
      tags: [Chat - Messages]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
          example: "60d0fe4f5311236168a109cc"
          required: true
        - in: query
          name: cursor
          schema:
            type: string
          description: Cursor for pagination (from previous response nextCursor)
          example: "msg_abc123"
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: So luong tin nhan moi trang
        - in: query
          name: type
          schema:
            type: string
            enum: [all, image, file, link]
            default: all
          description: "Loc theo loai: all (tat ca), image (chinh anh), file (chinh file), link (chinh link)"
      responses:
        "200":
          description: List of media/files/links
          content:
            application/json:
              example:
                data:
                  images:
                    - messageId: "msg_001"
                      url: "https://cdn.example.com/img/photo.jpg"
                      name: "photo.jpg"
                      size: 102400
                      width: 1920
                      height: 1080
                      mediaType: "image"
                      senderId: "user_123"
                      createdAt: "2024-01-15T10:30:00Z"
                  files:
                    - messageId: "msg_002"
                      url: "https://cdn.example.com/files/doc.pdf"
                      name: "doc.pdf"
                      size: 204800
                      mediaType: "file"
                      senderId: "user_123"
                      createdAt: "2024-01-15T11:00:00Z"
                  links:
                    - messageId: "msg_003"
                      url: "https://example.com/article"
                      senderId: "user_123"
                      createdAt: "2024-01-15T12:00:00Z"
                  nextCursor: "msg_xyz789"
                  hasMore: true
        "401":
          description: Unauthorized
        "403":
          description: Not a member of this conversation
