openapi: 3.0.0
info:
  title: Posts API
  version: 1.0.0

components:
  schemas:
    PostMedia:
      type: object
      properties:
        url:
          type: string
          example: "https://example.com/image.jpg"
        type:
          type: string
          enum: [image, video]
          example: "image"
        thumbnail:
          type: string
          example: "https://example.com/thumb.jpg"
    Post:
      type: object
      properties:
        id:
          type: string
          example: "post-123"
        authorId:
          type: string
          example: "user-456"
        content:
          type: string
          example: "Hôm nay trời đẹp quá!"
        media:
          type: array
          items:
            $ref: '#/components/schemas/PostMedia'
        privacy:
          type: string
          enum: [public, friends, private]
          example: "friends"
        reactionsCount:
          type: integer
          example: 10
        commentsCount:
          type: integer
          example: 5
        sharesCount:
          type: integer
          example: 2
        sharedPostId:
          type: string
          example: "post-789"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PostComment:
      type: object
      properties:
        id:
          type: string
          example: "comment-123"
        postId:
          type: string
          example: "post-123"
        userId:
          type: string
          example: "user-789"
        content:
          type: string
          example: "Tuyệt vời!"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

paths:
  /v1/posts:
    post:
      summary: Tạo bài viết (text, image, video)
      description: Tạo một bài viết mới (Timeline như Zalo). Bài viết có thể chứa text, danh sách media, và thiết lập quyền riêng tư.
      tags:
        - Posts
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  example: "Hôm nay trời đẹp quá!"
                  maxLength: 5000
                media:
                  type: array
                  maxItems: 10
                  items:
                    $ref: '#/components/schemas/PostMedia'
                privacy:
                  type: string
                  enum: [public, friends, private]
                  default: friends
      responses:
        '201':
          description: Created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Post'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
    get:
      summary: Lấy feed (Home timeline)
      description: Trả về danh sách bài viết từ bạn bè và chính người dùng, sắp xếp theo thời gian mới nhất.
      tags:
        - Posts
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Số trang
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: Số lượng bài viết mỗi trang (max 50)
      responses:
        '200':
          description: Feed list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      posts:
                        type: array
                        items:
                          $ref: '#/components/schemas/Post'
                      total:
                        type: integer
                        example: 100
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 20
                      hasMore:
                        type: boolean
                        example: true

  /v1/posts/{id}:
    get:
      summary: Lấy chi tiết bài viết
      description: Xem chi tiết một bài viết cụ thể. Hệ thống sẽ kiểm tra quyền riêng tư (chỉ bạn bè hoặc public mới được xem).
      tags:
        - Posts
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID của bài viết
      responses:
        '200':
          description: Post details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Post'
        '403':
          description: Forbidden - Không có quyền xem bài viết
        '404':
          description: Not Found - Bài viết không tồn tại
    delete:
      summary: Xóa bài viết
      description: Quản lý content. Chỉ người tạo mới có quyền xóa bài viết.
      tags:
        - Posts
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted successfully
        '403':
          description: Forbidden
        '404':
          description: Not Found

  /v1/posts/{id}/react:
    post:
      summary: Reaction bài viết
      description: Tương tác thả cảm xúc vào bài viết. Nếu gửi lại cùng một emoji hoặc thay đổi sẽ trả về kết quả action là added hoặc removed (Kiểu toggle state).
      tags:
        - Posts
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - emoji
              properties:
                emoji:
                  type: string
                  enum: [like, love, haha, wow, sad, angry]
                  example: "love"
      responses:
        '200':
          description: Reaction acted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      action:
                        type: string
                        enum: [added, removed]
                        example: "added"

  /v1/posts/{id}/comments:
    get:
      summary: Lấy comments bài viết
      description: Lấy danh sách bình luận của bài viết phân trang.
      tags:
        - Posts
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Comments list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      comments:
                        type: array
                        items:
                          $ref: '#/components/schemas/PostComment'
                      total:
                        type: integer
                        example: 25
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 20
                      hasMore:
                        type: boolean
                        example: true
    post:
      summary: Thêm comment
      description: Bình luận vào bài viết
      tags:
        - Posts
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  example: "Tuyệt vời quá!"
                  maxLength: 2000
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PostComment'

  /v1/posts/{id}/comments/{commentId}:
    delete:
      summary: Xóa comment
      description: Quản lý bình luận. Người đăng bài hoặc người viết bình luận đều có quyền xóa.
      tags:
        - Posts
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: commentId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Comment deleted
        '403':
          description: Forbidden - Không có quyền xóa

  /v1/posts/{id}/share:
    post:
      summary: Chia sẻ bài viết (Re-share)
      description: Chia sẻ lại bài viết lên Timeline của mình. Không thể tự share bài mình hoặc share bài đã share (Chỉ share được post gốc).
      tags:
        - Posts
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  example: "Mọi người xem nè, bài hay quá!"
                  description: "Nội dung trích dẫn thêm khi chia sẻ."
                privacy:
                  type: string
                  enum: [public, friends, private]
                  example: "friends"
      responses:
        '201':
          description: Shared successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Post'
        '400':
          description: Cannot share shared post or own post
