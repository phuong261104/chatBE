paths:
  /media/upload:
    post:
      summary: Upload a single file
      tags: [Media]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: "Single file (image, video, document)"
      responses:
        '200':
          description: Upload successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      filename:
                        type: string
                        description: "Name of the uploaded file"
                      url:
                        type: string
                        description: "URL of the uploaded file"
                      originalName:
                        type: string
                        description: "Original name of the file"
                      size:
                        type: number
                        description: "File size in bytes"
                      mimetype:
                        type: string
                        description: "MIME type of the file"
              example:
                data:
                  filename: "abc123-uuid.jpg"
                  url: "https://storage.example.com/uploads/abc123-uuid.jpg"
                  originalName: "photo.jpg"
                  size: 102400
                  mimetype: "image/jpeg"

  /media/upload-multiple:
    post:
      summary: Upload multiple files
      tags: [Media]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: "Multiple files (max 10 files)"
      responses:
        '200':
          description: Upload successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        filename:
                          type: string
                        url:
                          type: string
                        originalName:
                          type: string
                        size:
                          type: number
                        mimetype:
                          type: string
              example:
                data:
                  - filename: "abc123-uuid1.jpg"
                    url: "https://storage.example.com/uploads/abc123-uuid1.jpg"
                    originalName: "photo1.jpg"
                    size: 102400
                    mimetype: "image/jpeg"
                  - filename: "def456-uuid2.png"
                    url: "https://storage.example.com/uploads/def456-uuid2.png"
                    originalName: "photo2.png"
                    size: 204800
                    mimetype: "image/png"

  /media/{filename}:
    delete:
      summary: Delete a file
      tags: [Media]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: filename
          schema:
            type: string
            example: "abc123-uuid.jpg"
          required: true
          description: "Name of the file to delete"
      responses:
        '200':
          description: Deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: boolean
                    example: true
              example:
                data: true
        '404':
          description: File not found
          content:
            application/json:
              example:
                error:
                  code: "NOT_FOUND"
                  message: "File not found"
