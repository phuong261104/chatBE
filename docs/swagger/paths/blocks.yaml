paths:
  /v1/blocks/{blockedUserId}:
    post:
      summary: Block a user
      tags: [Blocks]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: blockedUserId
          schema: 
            type: string
            example: "60d0fe4f5311236168a2"
          required: true
          description: "ID người dùng muốn chặn"
      responses:
        '200':
          description: User blocked successfully
          content:
            application/json:
              example:
                data:
                  _id: "60d0fe..."
                  blockerId: "60d0fe4f5311236168a1"
                  blockedId: "60d0fe4f5311236168a2"
    delete:
      summary: Unblock a user
      tags: [Blocks]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: blockedUserId
          schema: 
            type: string
            example: "60d0fe4f5311236168a2"
          required: true
      responses:
        '200':
          description: User unblocked successfully
          content:
            application/json:
              example:
                data: true

  /v1/blocks:
    get:
      summary: Get list of blocked users
      tags: [Blocks]
      security:
        - BearerAuth: []
      description: Returns blocked records with nested `blockedUser`; `blockedUser.phone` is optional and only returned when phone privacy allows the requester to view it.
      responses:
        '200':
          description: A list of blocked users
          content:
            application/json:
              example:
                data:
                  items:
                    - id: "018f03d3-9d68-7a7b-9b13-8c0d9f0e8a2a"
                      blockerId: "60d0fe4f5311236168a1"
                      blockedUserId: "60d0fe4f5311236168a2"
                      createdAt: "2026-04-01T10:00:00Z"
                      blockedUser:
                        id: "60d0fe4f5311236168a2"
                        displayName: "Blocked User"
                        username: "blocked_user"
                        phone: "+84901234567"
                        avatarUrl: "https://cdn.example.com/avatar.png"
                        coverUrl: "https://cdn.example.com/cover.png"
                        bio: "Profile bio"
                        verified:
                          email: true
                          phone: true
                        status: "active"
                      blockedUserUnavailable: false
                  total: 1
                  page: 1
                  limit: 20
                  hasMore: false

  /v1/blocks/cursor:
    get:
      summary: Get blocked users with cursor pagination
      tags: [Blocks]
      security:
        - BearerAuth: []
      description: Returns cursor-paginated blocked records with nested `blockedUser`; `blockedUser.phone` is optional and only returned when phone privacy allows the requester to view it.
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
          required: false
          description: Cursor returned from the previous page.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
      responses:
        '200':
          description: A cursor-paginated list of blocked users
          content:
            application/json:
              example:
                data:
                  items:
                    - id: "018f03d3-9d68-7a7b-9b13-8c0d9f0e8a2a"
                      blockerId: "60d0fe4f5311236168a1"
                      blockedUserId: "60d0fe4f5311236168a2"
                      createdAt: "2026-04-01T10:00:00Z"
                      blockedUser:
                        id: "60d0fe4f5311236168a2"
                        displayName: "Blocked User"
                        username: "blocked_user"
                        phone: "+84901234567"
                        avatarUrl: "https://cdn.example.com/avatar.png"
                        coverUrl: "https://cdn.example.com/cover.png"
                        bio: "Profile bio"
                        verified:
                          email: true
                          phone: true
                        status: "active"
                      blockedUserUnavailable: false
                  nextCursor: "eyJibG9ja2VySWQiOiI2MGQwZmU0ZjUzMTEyMzYxNjhhMSJ9"
                  hasMore: true
                  limit: 20

  /v1/blocks/{blockedUserId}/check:
    get:
      summary: Check if a user is blocked
      tags: [Blocks]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: blockedUserId
          schema: 
            type: string
            example: "60d0fe4f5311236168a2"
          required: true
      responses:
        '200':
          description: Block status
          content:
            application/json:
              example:
                data:
                  isBlocked: true
