paths:
  /messages/{messageId}/reactions:
    get:
      summary: Get all reactions on a message
      tags: [Chat - Reactions]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: messageId
          schema:
            type: string
          example: "msg_001"
          required: true
      responses:
        "200":
          description: List of reactions grouped by emoji
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      reactions:
                        type: array
                        items:
                          $ref: "./chat-schemas.yaml#/components/schemas/ReactionItem"
              example:
                data:
                  reactions:
                    - emoji: "👍"
                      users:
                        - _id: "user_1"
                          displayName: "Nguyễn Văn A"
                          avatarUrl: "https://cdn.example.com/avatars/a.png"
                        - _id: "user_2"
                          displayName: "Trần Thị B"
                          avatarUrl: "https://cdn.example.com/avatars/b.png"
                      count: 2
                    - emoji: "❤️"
                      users:
                        - _id: "user_3"
                          displayName: "Lê Văn C"
                          avatarUrl: "https://cdn.example.com/avatars/c.png"
                      count: 1
        "401":
          description: Unauthorized

    delete:
      summary: Remove all reactions from a message
      description: |
        Removes ALL reactions from the message. Requires admin permission.
        Returns the count of reactions removed.
      tags: [Chat - Reactions]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: messageId
          schema:
            type: string
          example: "msg_001"
          required: true
      responses:
        "200":
          description: All reactions removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: true
                      deletedCount:
                        type: integer
                        description: Number of reactions removed
                        example: 5
              example:
                data:
                  success: true
                  deletedCount: 5
        "401":
          description: Unauthorized
        "403":
          description: Only conversation admins can clear all reactions

  /messages/{messageId}/react:
    post:
      summary: Add a reaction to a message
      tags: [Chat - Reactions]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: messageId
          schema:
            type: string
          example: "msg_001"
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - emoji
              properties:
                emoji:
                  type: string
                  description: Emoji unicode or emoji code to add
                  example: "👍"
      responses:
        "201":
          description: Reaction added
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "./chat-schemas.yaml#/components/schemas/ReactionDetail"
              example:
                data:
                  _id: "react_001"
                  messageId: "msg_001"
                  userId: "user_123"
                  emoji: "👍"
                  createdAt: "2024-01-15T10:35:00Z"
        "401":
          description: Unauthorized
        "409":
          description: Reaction already exists

    delete:
      summary: Remove a specific reaction or all reactions from a message
      description: |
        - If `emoji` is provided: removes only that specific emoji reaction from the current user
        - If `emoji` is omitted: removes ALL reactions by the current user from this message
      tags: [Chat - Reactions]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: messageId
          schema:
            type: string
          example: "msg_001"
          required: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                emoji:
                  type: string
                  description: Specific emoji to remove. If omitted, removes all reactions by the current user.
                  example: "👍"
      responses:
        "200":
          description: Reaction(s) removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: true
                      deletedCount:
                        type: integer
                        description: Number of reactions removed
                        example: 1
              example:
                data:
                  success: true
                  deletedCount: 1
        "401":
          description: Unauthorized
