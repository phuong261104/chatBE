                  data:
                    type: object
                    properties:
                      callId:
                        type: string
                        format: uuid
                      status:
                        type: string
                        example: "ended"
                      duration:
                        type: integer
                        example: 120
        "400":
          description: Call already ended
        "401":
          description: Unauthorized
        "404":
          description: Call not found
