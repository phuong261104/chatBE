components:
  schemas:
    CallType:
      type: string
      enum: [audio, video]
      description: Loai cuoc goi
      example: "video"
    CallStatus:
      type: string
      enum: [initiated, ringing, answered, rejected, missed, ended, cancelled]
      description: Trang thai cuoc goi
    ParticipantStatus:
      type: string
      enum: [invited, ringing, joined, declined, missed, left, busy]
      description: Trang thai participant trong call
    CallResponse:
      type: object
      description: Thong tin cuoc goi
      properties:
        callId:
          type: string
          format: uuid
          example: "0192a3bc-def0-7abc-8901-23456789abcd"
        conversationId:
          type: string
          format: uuid
        callerId:
          type: string
          format: uuid
        initiatorId:
          type: string
          format: uuid
        calleeIds:
          type: array
          items:
            type: string
            format: uuid
        type:
          $ref: "#/components/schemas/CallType"
        isGroup:
          type: boolean
          description: True neu goi nhom
        status:
          $ref: "#/components/schemas/CallStatus"
        apiVersion:
          type: string
          enum: [v1, v2]
          example: "v2"
        livekitProvider:
          type: string
          enum: [cloud]
          example: "cloud"
        livekitRoomName:
          type: string
          example: "call-v2-conversation-id-xxxxxxxx"
        roomName:
          type: string
          example: "call-room-0192a3bc"
        participants:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Participant"
        busyUserIds:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Participant:
      type: object
      description: Thong tin participant trong call
      properties:
        userId:
          type: string
        status:
          $ref: "#/components/schemas/ParticipantStatus"
        joinedAt:
          type: string
          format: date-time
          nullable: true
        invitedAt:
          type: string
          format: date-time
          nullable: true
    CallTokenResponse:
      type: object
      description: Token de tham gia cuoc goi LiveKit
      properties:
        token:
          type: string
        roomName:
          type: string
        wsUrl:
          type: string
          description: WebSocket URL for LiveKit
          example: "wss://livekit.example.com"
        callId:
          type: string
          format: uuid
        livekitProvider:
          type: string
          enum: [cloud]

paths:
  # ============================================================
  # CALL V2 - LiveKit Cloud (PRIMARY - uu tien su dung)
  # Mounted tai: /v2/calls/*
  # Socket namespace: /v2/calls
  # ============================================================

  # Create V2 Call
  /v2/calls:
    post:
      summary: "[V2] Tao cuoc goi LiveKit cloud"
      tags: [Calls V2]
      security:
        - BearerAuth: []
      description: |
        Tao cuoc goi LiveKit cloud.
        - Private call: khong can truyen `inviteeIds`; backend tu lay thanh vien con lai.
        - Group call: ho tro `inviteAll` hoac `inviteeIds`.
        - Neu user busy: tra `409` voi `busyUserIds`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversationId, type]
              properties:
                conversationId:
                  type: string
                  format: uuid
                type:
                  $ref: "#/components/schemas/CallType"
                inviteAll:
                  type: boolean
                  default: false
                  description: Moi tat ca active members (tru caller)
                inviteeIds:
                  type: array
                  items:
                    type: string
                  description: Danh sach user duoc goi cu the
            example:
              conversationId: "0192a3bc-def0-7abc-8901-23456789abcd"
              type: "audio"
              inviteAll: true
      responses:
        "201":
          description: Call created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      call:
                        $ref: "#/components/schemas/CallResponse"
                      invitedUserIds:
                        type: array
                        items:
                          type: string
                      busyUserIds:
                        type: array
                        items:
                          type: string
              example:
                data:
                  call:
                    callId: "0192a3bc-def0-7abc-8901-23456789abcd"
                    conversationId: "0192a3bc-def0-7abc-8901-23456789abce"
                    callerId: "0192a3bc-def0-7abc-8901-23456789abcf"
                    type: "audio"
                    isGroup: true
                    status: "initiated"
                    apiVersion: "v2"
                    livekitProvider: "cloud"
                    livekitRoomName: "call-v2-conversation-id-xxxxxxxx"
                    participants:
                      "0192a3bc-def0-7abc-8901-23456789abcf":
                        userId: "0192a3bc-def0-7abc-8901-23456789abcf"
                        status: "joined"
                        joinedAt: "2026-05-15T10:00:00.000Z"
                    busyUserIds: []
                  invitedUserIds: ["0192a3bc-def0-7abc-8901-23456789abcd"]
                  busyUserIds: []
        "401":
          description: Unauthorized
        "403":
          description: Khong phai thanh vien cuoc tro chuyen
        "404":
          description: Cuoc tro chuyen khong ton tai
        "409":
          description: Call dang dien ra

  # Get Active Call by Conversation (V2)
  /v2/calls/conversations/{conversationId}/active:
    get:
      summary: "[V2] Lay call dang active theo conversation"
      tags: [Calls V2]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
            format: uuid
          required: true
      responses:
        "200":
          description: Active call found or no active call
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    nullable: true
                    properties:
                      call:
                        $ref: "#/components/schemas/CallResponse"
        "401":
          description: Unauthorized
        "403":
          description: Khong phai thanh vien

  # Alias - Get Active Call (V2)
  /v2/calls/active-by-conversation/{conversationId}:
    get:
      summary: "[V2] Alias - lay call active theo conversation"
      tags: [Calls V2]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
            format: uuid
          required: true
      responses:
        "200":
          description: Active call found or no active call
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    nullable: true
        "401":
          description: Unauthorized

  # Join V2 Call (lay token)
  /v2/calls/{callId}/join:
    post:
      summary: "[V2] Join va lay LiveKit token"
      tags: [Calls V2]
      security:
        - BearerAuth: []
      description: |
        Join cuoc goi va lay LiveKit token.
        Tra ve token, wsUrl, roomName de ket noi LiveKit.
      parameters:
        - in: path
          name: callId
          schema:
            type: string
            format: uuid
          required: true
      responses:
        "200":
          description: Joined call
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      call:
                        $ref: "#/components/schemas/CallResponse"
                      token:
                        type: string
                      wsUrl:
                        type: string
                      roomName:
                        type: string
                      livekitProvider:
                        type: string
                        enum: [cloud]
              example:
                data:
                  call:
                    callId: "0192a3bc-def0-7abc-8901-23456789abcd"
                    status: "answered"
                  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  wsUrl: "wss://livekit.example.com"
                  roomName: "call-v2-xxxxxxxx"
                  livekitProvider: "cloud"
        "401":
          description: Unauthorized
        "403":
          description: Khong phai participant hop le
        "404":
          description: Call khong ton tai

  # Leave V2 Call
  /v2/calls/{callId}/leave:
    post:
      summary: "[V2] Roi cuoc goi"
      tags: [Calls V2]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: callId
          schema:
            type: string
            format: uuid
          required: true
      responses:
        "200":
          description: Left call
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      callId:
                        type: string
                      status:
                        type: string
        "401":
          description: Unauthorized
        "404":
          description: Call khong ton tai

  # Reject V2 Call
  /v2/calls/{callId}/reject:
    post:
      summary: "[V2] Tu choi cuoc goi"
      tags: [Calls V2]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: callId
          schema:
            type: string
            format: uuid
          required: true
      responses:
        "200":
          description: Call rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      callId:
                        type: string
                      status:
                        type: string
                        example: "rejected"
                      rejectedBy:
                        type: string
        "401":
          description: Unauthorized
        "404":
          description: Call khong ton tai

  # Missed V2 Call
  /v2/calls/{callId}/missed:
    post:
      summary: "[V2] Danh dau cuoc goi la missed"
      tags: [Calls V2]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: callId
          schema:
            type: string
            format: uuid
          required: true
      responses:
        "200":
          description: Call marked missed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      callId:
                        type: string
                      status:
                        type: string
                        example: "missed"
        "401":
          description: Unauthorized
        "404":
          description: Call khong ton tai

  # End V2 Call
  /v2/calls/{callId}/end:
    post:
      summary: "[V2] Ket thuc cuoc goi"
      tags: [Calls V2]
      security:
        - BearerAuth: []
      description: Ket thuc cuoc goi (cung endpoint voi DELETE).
      parameters:
        - in: path
          name: callId
          schema:
            type: string
            format: uuid
          required: true
      responses:
        "200":
          description: Call ended
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      callId:
                        type: string
                      status:
                        type: string
                        example: "ended"
                      duration:
                        type: integer
                        description: Thoi luong cuoc goi (giay)
        "400":
          description: Call da ket thuc
        "401":
          description: Unauthorized
        "403":
          description: Khong phai participant
        "404":
          description: Call khong ton tai

  # Delete/End V2 Call
  /v2/calls/{callId}:
    delete:
      summary: "[V2] Ket thuc cuoc goi"
      tags: [Calls V2]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: callId
          schema:
            type: string
            format: uuid
          required: true
      responses:
        "200":
          description: Call ended
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      callId:
                        type: string
                      status:
                        type: string
                        example: "ended"
                      duration:
                        type: integer
        "400":
          description: Call da ket thuc
        "401":
          description: Unauthorized
        "403":
          description: Khong phai participant
        "404":
          description: Call khong ton tai

  # Get V2 Call Token
  /v2/calls/{callId}/token:
    get:
      summary: "[V2] Lay LiveKit token"
      tags: [Calls V2]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: callId
          schema:
            type: string
            format: uuid
          required: true
      responses:
        "200":
          description: Token generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CallTokenResponse"
              example:
                data:
                  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  wsUrl: "wss://livekit.example.com"
                  roomName: "call-v2-xxxxxxxx"
                  callId: "0192a3bc-def0-7abc-8901-23456789abcd"
                  livekitProvider: "cloud"
        "401":
          description: Unauthorized
        "403":
          description: Khong phai participant
        "404":
          description: Call khong ton tai
        "410":
          description: Call da ket thuc

  # ============================================================
  # CALL V1 - Legacy (van hoat dong, khong doi)
  # Mounted tai: /v1/calls/*
  # Socket namespace: /socket/calls
  # ============================================================

  /v1/calls:
    post:
      summary: "[V1] Tao cuoc goi (legacy)"
      tags: [Calls V1]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - conversationId
                - type
              properties:
                conversationId:
                  type: string
                  format: uuid
                type:
                  $ref: "#/components/schemas/CallType"
                calleeIds:
                  type: array
                  items:
                    type: string
                    format: uuid
            example:
              conversationId: "0192a3bc-def0-7abc-8901-23456789abcd"
              type: "video"
              calleeIds: []
      responses:
        "201":
          description: Call created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CallResponse"
        "401":
          description: Unauthorized
        "409":
          description: Call already in progress
  /v1/calls/{callId}/answer:
    post:
      summary: "[V1] Tra loi cuoc goi (legacy)"
      tags: [Calls V1]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: callId
          schema:
            type: string
            format: uuid
          required: true
      responses:
        "200":
          description: Call answered
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CallResponse"
        "401":
          description: Unauthorized
        "404":
          description: Call not found
  /v1/calls/{callId}/reject:
    post:
      summary: "[V1] Tu choi cuoc goi (legacy)"
      tags: [Calls V1]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: callId
          schema:
            type: string
            format: uuid
          required: true
      responses:
        "200":
          description: Call rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      callId:
                        type: string
                        format: uuid
                      status:
                        type: string
                        example: "rejected"
        "401":
          description: Unauthorized
        "404":
          description: Call not found
  /v1/calls/{callId}/missed:
    post:
      summary: "[V1] Danh dau missed (legacy)"
      tags: [Calls V1]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: callId
          schema:
            type: string
            format: uuid
          required: true
      responses:
        "200":
          description: Call marked missed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      callId:
                        type: string
                        format: uuid
                      status:
                        type: string
                        example: "missed"
        "401":
          description: Unauthorized
        "404":
          description: Call not found
  /v1/calls/{callId}/token:
    get:
      summary: "[V1] Lay token (legacy)"
      tags: [Calls V1]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: callId
          schema:
            type: string
            format: uuid
          required: true
      responses:
        "200":
          description: Token generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CallTokenResponse"
        "401":
          description: Unauthorized
        "404":
          description: Call not found
  /v1/calls/{callId}:
    delete:
      summary: "[V1] Ket thuc cuoc goi (legacy)"
      tags: [Calls V1]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: callId
          schema:
            type: string
            format: uuid
          required: true
      responses:
        "200":
          description: Call ended
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      callId:
                        type: string
                        format: uuid
                      status:
                        type: string
                        example: "ended"
                      duration:
                        type: integer
                        example: 120
        "400":
          description: Call already ended
        "401":
          description: Unauthorized
        "404":
          description: Call not found
