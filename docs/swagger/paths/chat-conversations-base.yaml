paths:
  /conversations/private:
    post:
      summary: Get or create private 1-1 conversation
      tags: [Chat - Conversations]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - targetUserId
              properties:
                targetUserId:
                  type: string
                  format: uuid
                  description: Target user ID to start conversation with
                  example: "60d0fe4f5311236168a109cc"
      responses:
        "200":
          description: Private conversation found or created
          content:
            application/json:
              schema:
                $ref: "./chat-schemas.yaml#/components/schemas/ConversationResponse"
        "401":
          description: Unauthorized
        "422":
          description: Validation error

  /conversations:
    get:
      summary: List all conversations for current user
      tags: [Chat - Conversations]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            example: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
            example: 20
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              example:
                data:
                  conversations:
                    - _id: "conv_001"
                      name: "Nhóm Dev Team"
                      type: "group"
                      avatarUrl: "https://cdn.example.com/avatar.png"
                      lastMessage:
                        _id: "msg_001"
                        text: "Chào mọi người!"
                        senderId: "user_123"
                        createdAt: "2024-01-15T10:30:00Z"
                      unreadCount: 3
                      isPinned: true
                      isMuted: false
                      lastMessageStatus: "delivered"
                      lastMessageTimeFormatted: "10:30"
                  total: 50
                  page: 1
                  limit: 20
        "401":
          description: Unauthorized

  /conversations/cursor:
    get:
      summary: List conversations with cursor-based pagination
      tags: [Chat - Conversations]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
          description: Cursor cho phân trang (ID tinh nhắn hoặc timestamp)
          example: "60d0fe4f5311236168a109cc"
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
            example: 20
      responses:
        "200":
          description: Danh sách hội thoại theo cursor
          content:
            application/json:
              example:
                status: "success"
                msg: "OK"
                pinned: []
                data: []
                nextCursor: "msg_abc123"
                hasMore: true
        "401":
          description: Unauthorized

  /conversations/{conversationId}:
    get:
      summary: Get conversation details
      tags: [Chat - Conversations]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
            example: "60d0fe4f5311236168a109cc"
          required: true
      responses:
        "200":
          description: Conversation details
          content:
            application/json:
              example:
                data:
                  conversation:
                    _id: "conv_001"
                    name: "Nhóm Dev Team"
                    type: "group"
                    avatarUrl: "https://cdn.example.com/avatar.png"
                    createdAt: "2024-01-01T00:00:00Z"
                    members: [...]
                    settings:
                      allowSendLink: true
                      requireApproval: false
                      allowMemberInvite: true
        "401":
          description: Unauthorized
        "403":
          description: Not a member of this conversation
        "404":
          description: Conversation not found

  /conversations/unread-count:
    get:
      summary: Get total unread message count
      tags: [Chat - Conversations]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Total unread count
          content:
            application/json:
              example:
                totalUnread: 42
        "401":
          description: Unauthorized
