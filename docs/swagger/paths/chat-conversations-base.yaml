paths:
  /conversations/private:
    post:
      summary: Get or create private 1-1 conversation
      tags: [Chat - Conversations]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - targetUserId
              properties:
                targetUserId:
                  type: string
                  format: uuid
                  description: Target user ID to start conversation with
                  example: "60d0fe4f5311236168a109cc"
      responses:
        "200":
          description: Private conversation found or created
          content:
            application/json:
              schema:
                $ref: "./chat-schemas.yaml#/components/schemas/ConversationDetail"
        "401":
          description: Unauthorized
        "422":
          description: Validation error

  /conversations:
    get:
      summary: List all conversations for current user
      tags: [Chat - Conversations]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            example: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
            example: 20
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              example:
                data:
                  conversations:
                    - _id: "conv_001"
                      name: "Nhóm Dev Team"
                      type: "group"
                      avatarUrl: "https://cdn.example.com/avatar.png"
                      lastMessage:
                        _id: "msg_001"
                        text: "Chào mọi người!"
                        senderId: "user_123"
                        createdAt: "2024-01-15T10:30:00Z"
                      unreadCount: 3
                      isPinned: true
                      isMuted: false
                      membersCount: 5
                      lastMessageAt: "2024-01-15T10:30:00Z"
                  total: 50
                  page: 1
                  limit: 20
        "401":
          description: Unauthorized

  /conversations/cursor:
    get:
      summary: List conversations with cursor-based pagination
      tags: [Chat - Conversations]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
          description: Cursor for pagination (last message ID from previous response). Empty/null to start from the beginning.
          example: "0192a3bc-def0-7abc-8901-23456789abcd"
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
            example: 20
      responses:
        "200":
          description: Conversations grouped by pinned and unpinned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  msg:
                    type: string
                    example: "OK"
                  pinned:
                    type: array
                    items:
                      $ref: "./chat-schemas.yaml#/components/schemas/ConversationListItem"
                  data:
                    type: array
                    items:
                      $ref: "./chat-schemas.yaml#/components/schemas/ConversationListItem"
                  nextCursor:
                    type: string
                    nullable: true
                    description: Cursor for next page. Null if no more conversations.
                    example: "0192a3bc-def0-7abc-8901-23456789abcd"
                  hasMore:
                    type: boolean
                    example: true
              example:
                status: "success"
                msg: "OK"
                pinned: []
                data:
                  - _id: "conv_001"
                    name: "Nguyễn Văn A"
                    type: "private"
                    avatarUrl: "https://cdn.example.com/avatars/a.png"
                    lastMessage:
                      _id: "msg_001"
                      text: "Chào bạn!"
                      senderId: "user_123"
                      senderName: "Nguyễn Văn A"
                      createdAt: "2024-01-15T10:30:00Z"
                    unreadCount: 0
                    isPinned: false
                    isMuted: false
                    isArchived: false
                    members:
                      - userId: "user_123"
                        displayName: "Nguyễn Văn A"
                        avatarUrl: "https://cdn.example.com/avatars/a.png"
                    lastMessageAt: "2024-01-15T10:30:00Z"
                nextCursor: "0192a3bc-def0-7abc-8901-23456789abcd"
                hasMore: true
        "401":
          description: Unauthorized

  /conversations/{conversationId}:
    get:
      summary: Get conversation details with members
      tags: [Chat - Conversations]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
          example: "0192a3bc-def0-7abc-8901-23456789abcd"
          required: true
      responses:
        "200":
          description: Conversation details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      conversation:
                        $ref: "./chat-schemas.yaml#/components/schemas/ConversationDetail"
                      members:
                        type: array
                        items:
                          $ref: "./chat-schemas.yaml#/components/schemas/ConversationMemberItem"
        "401":
          description: Unauthorized
        "403":
          description: Not a member of this conversation
        "404":
          description: Conversation not found

  /conversations/unread-count:
    get:
      summary: Get total unread message count across all conversations
      tags: [Chat - Conversations]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Total unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalUnread:
                    type: integer
                    example: 42
              example:
                totalUnread: 42
        "401":
          description: Unauthorized

  /conversations/{conversationId}/statistics:
    get:
      summary: Get conversation statistics
      tags: [Chat - Conversations]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
          example: "0192a3bc-def0-7abc-8901-23456789abcd"
          required: true
      responses:
        "200":
          description: Conversation statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "./chat-schemas.yaml#/components/schemas/ConversationStatistics"
        "401":
          description: Unauthorized
        "403":
          description: Not a member of this conversation
        "404":
          description: Conversation not found

  /conversations/{conversationId}/members/online:
    get:
      summary: Get online members in a conversation
      tags: [Chat - Conversations]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
          example: "0192a3bc-def0-7abc-8901-23456789abcd"
          required: true
      responses:
        "200":
          description: List of online members
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "./chat-schemas.yaml#/components/schemas/OnlineMember"
              example:
                data:
                  - userId: "user_123"
                    isOnline: true
                    lastSeen: "2024-01-15T10:00:00Z"
                  - userId: "user_456"
                    isOnline: false
                    lastSeen: null
        "401":
          description: Unauthorized
        "403":
          description: Not a member of this conversation

  /conversations/{conversationId}/drafts:
    get:
      summary: Get message drafts for a conversation
      tags: [Chat - Conversations]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
          example: "0192a3bc-def0-7abc-8901-23456789abcd"
          required: true
      responses:
        "200":
          description: List of drafts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      drafts:
                        type: array
                        items:
                          $ref: "./chat-schemas.yaml#/components/schemas/Draft"
              example:
                data:
                  drafts:
                    - id: "draft_001"
                      conversationId: "0192a3bc-def0-7abc-8901-23456789abcd"
                      userId: "user_123"
                      text: "Draft message text..."
                      media: []
                      createdAt: "2024-01-15T10:00:00Z"
                      updatedAt: "2024-01-15T10:30:00Z"
        "401":
          description: Unauthorized
        "403":
          description: Not a member of this conversation

  /conversations/{conversationId}/copy:
    post:
      summary: Copy messages from a conversation to another (or self)
      tags: [Chat - Conversations]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
          example: "0192a3bc-def0-7abc-8901-23456789abcd"
          required: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                targetUserId:
                  type: string
                  format: uuid
                  description: Target user to copy to (creates/uses private conversation). Either this or memberIds required.
                  example: "0192a3bc-def0-7abc-8901-23456789abce"
                memberIds:
                  type: array
                  items:
                    type: string
                  description: Specific members to copy to. Either this or targetUserId required.
                  example: ["0192a3bc-def0-7abc-8901-23456789abce"]
                before:
                  type: string
                  format: date-time
                  description: Only copy messages sent before this time
                  example: "2024-01-20T00:00:00Z"
                after:
                  type: string
                  format: date-time
                  description: Only copy messages sent after this time
                  example: "2024-01-01T00:00:00Z"
      responses:
        "201":
          description: Messages copied successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "./chat-schemas.yaml#/components/schemas/CopyConversationResult"
        "401":
          description: Unauthorized
        "403":
          description: Not a member of this conversation
        "404":
          description: Conversation not found

  /users/{userId}/conversations:
    get:
      summary: Get shared conversations between current user and target user
      tags: [Chat - Conversations]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: userId
          schema:
            type: string
          example: "0192a3bc-def0-7abc-8901-23456789abcd"
          required: true
      responses:
        "200":
          description: Shared conversations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "./chat-schemas.yaml#/components/schemas/ConversationListItem"
              example:
                data:
                  - _id: "conv_001"
                    name: "Nguyễn Văn A"
                    type: "private"
                    avatarUrl: "https://cdn.example.com/avatars/a.png"
                    lastMessage:
                      _id: "msg_001"
                      text: "Chào bạn!"
                      senderId: "user_123"
                      createdAt: "2024-01-15T10:30:00Z"
                    unreadCount: 0
                    isPinned: false
                    isMuted: false
                    members:
                      - userId: "user_123"
                        displayName: "Nguyễn Văn A"
                        avatarUrl: "https://cdn.example.com/avatars/a.png"
                    lastMessageAt: "2024-01-15T10:30:00Z"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: User not found
