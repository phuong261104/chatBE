paths:
  /v1/groups/{groupId}/polls:
    get:
      summary: Get all polls in a group
      description: |
        Returns paginated list of polls in a group.
        Supports optional status filter: `active`, `closed`, `expired`.
        Cursor pagination via `cursor` + `limit`.
      tags: [Chat - Polls]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
          required: true
          example: "0192a3bc-def0-7abc-8901-23456789abce"
        - in: query
          name: status
          schema:
            type: string
            enum: [active, closed, expired]
          description: Filter by poll status
          required: false
        - in: query
          name: cursor
          schema:
            type: string
          description: Pagination cursor (base64 encoded)
          required: false
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Number of polls per page (default 20)
          required: false
      responses:
        "200":
          description: Paginated list of polls
          content:
            application/json:
              example:
                data:
                  polls:
                    - id: "0192a3bc-def0-7abc-8901-23456789abcf"
                      conversationId: "0192a3bc-def0-7abc-8901-23456789abce"
                      messageId: "0192a3bc-def0-7abc-8901-23456789abcd"
                      question: "Chọn ngày họp?"
                      options:
                        - id: "opt_001"
                          text: "Thứ 2"
                          voteCount: 5
                          votedUserIds: []
                        - id: "opt_002"
                          text: "Thứ 3"
                          voteCount: 3
                          votedUserIds: []
                      createdBy: "user_123"
                      isMultipleChoice: false
                      allowAddOption: true
                      allowChangeVote: false
                      showResultsBeforeClose: true
                      hideVoters: false
                      status: "active"
                      pinned: false
                      totalVotes: 8
                      createdAt: "2026-01-15T10:00:00.000Z"
                      expiresAt: "2026-01-20T10:00:00.000Z"
                nextCursor: "eyJpZCI6IjAxOTJhM2JjLWRlZjAtN2FiYy04OTAxLTIzNDU2Nzg5YWJjZiIsInVwZGF0ZWRBdCI6IjIwMjYtMDEtMTVUMTA6MDA6MDAuMDAwWiJ9"
                hasMore: false
        "401":
          description: Unauthorized
        "403":
          description: Not a group member

    post:
      summary: Create a poll
      tags: [Chat - Polls]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
          required: true
          example: "0192a3bc-def0-7abc-8901-23456789abce"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - question
                - options
              properties:
                question:
                  type: string
                  maxLength: 500
                  example: "Chọn ngày họp?"
                options:
                  type: array
                  items:
                    type: string
                  minItems: 2
                  maxItems: 10
                  example: ["Thứ 2", "Thứ 3", "Thứ 4"]
                isMultipleChoice:
                  type: boolean
                  default: false
                  description: Allow voting for multiple options
                allowAddOption:
                  type: boolean
                  default: false
                  description: Allow members to add new options
                allowChangeVote:
                  type: boolean
                  default: false
                  description: Allow members to change their vote after voting
                showResultsBeforeClose:
                  type: boolean
                  default: false
                  description: Show poll results before the poll is closed
                hideVoters:
                  type: boolean
                  default: false
                  description: Hide voter identities from normal members
                expiresAt:
                  type: string
                  format: date-time
                  description: Poll expiration time (optional)
                  example: "2026-01-20T10:00:00.000Z"
      responses:
        "201":
          description: Poll created
          content:
            application/json:
              example:
                data:
                  id: "0192a3bc-def0-7abc-8901-23456789abcf"
                  conversationId: "0192a3bc-def0-7abc-8901-23456789abce"
                  question: "Chọn ngày họp?"
                  options:
                    - id: "opt_001"
                      text: "Thứ 2"
                      voteCount: 0
                      votedUserIds: []
                    - id: "opt_002"
                      text: "Thứ 3"
                      voteCount: 0
                      votedUserIds: []
                  isMultipleChoice: false
                  allowAddOption: true
                  allowChangeVote: false
                  showResultsBeforeClose: false
                  hideVoters: false
                  status: "active"
                  totalVotes: 0
                  createdAt: "2026-01-15T10:00:00.000Z"
        "400":
          description: Validation error (e.g. less than 2 options, empty question)
        "401":
          description: Unauthorized
        "403":
          description: Only group members can create polls

  /v1/groups/{groupId}/polls/{pollId}:
    get:
      summary: Get a single poll
      tags: [Chat - Polls]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
          required: true
        - in: path
          name: pollId
          schema:
            type: string
          required: true
      responses:
        "200":
          description: Poll detail
          content:
            application/json:
              example:
                data:
                  id: "0192a3bc-def0-7abc-8901-23456789abcf"
                  question: "Chọn ngày họp?"
                  options: [...]
                  status: "active"
        "401":
          description: Unauthorized
        "403":
          description: Not a group member
        "404":
          description: Poll not found
    delete:
      summary: Delete a poll
      description: |
        Permanently removes a poll from the group.
        Only poll creator, group owner, or group admins can delete a poll.
        If the poll is pinned, its linked message is automatically unpinned.
      tags: [Chat - Polls]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
          required: true
        - in: path
          name: pollId
          schema:
            type: string
          required: true
      responses:
        "200":
          description: Poll deleted
          content:
            application/json:
              example:
                data:
                  pollId: "0192a3bc-def0-7abc-8901-23456789abcf"
        "401":
          description: Unauthorized
        "403":
          description: Only poll creator, owner or admins can delete the poll
        "404":
          description: Poll not found

  /v1/groups/{groupId}/polls/{pollId}/vote:
    post:
      summary: Vote on a poll
      description: |
        Vote for one or more options.
        For single-choice polls, send exactly one optionId.
        For multi-choice polls, send one or more optionIds.
        To change a vote on single-choice: send the new optionId (replaces old vote).
        To toggle options in multi-choice: include all currently selected optionIds.
        Sending the same current selection again is idempotent: returns 200 with current poll state,
        does not increment vote counts or activity counts, and does not emit poll:vote.
        Re-voting is blocked if poll.allowChangeVote is false.
      tags: [Chat - Polls]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
          required: true
        - in: path
          name: pollId
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - optionIds
              properties:
                optionIds:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  description: Option IDs to vote for
                  example: ["opt_001"]
      responses:
        "200":
          description: Vote recorded, or current poll returned unchanged when the submitted selection is identical
          content:
            application/json:
              example:
                data:
                  id: "0192a3bc-def0-7abc-8901-23456789abcf"
                  options:
                    - id: "opt_001"
                      text: "Thứ 2"
                      voteCount: 6
                      votedUserIds: ["user_456"]
                    - id: "opt_002"
                      text: "Thứ 3"
                      voteCount: 3
                      votedUserIds: []
                  totalVotes: 9
        "400":
          description: |
            - Poll has expired
            - Poll is closed
            - Option does not exist in poll
            - Cannot change vote (allowChangeVote is false)
            - Only one option allowed for single-choice poll
        "401":
          description: Unauthorized
        "403":
          description: Not a group member
        "404":
          description: Poll not found

  /v1/groups/{groupId}/polls/{pollId}/options:
    post:
      summary: Add an option to a poll
      description: |
        Adds a new option when the poll is active, not expired, and allowAddOption is true.
        Records who added the option via `addedBy` field.
        Creates a system message in the conversation.
      tags: [Chat - Polls]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
          required: true
        - in: path
          name: pollId
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 200
                  example: "Thứ 5"
      responses:
        "200":
          description: Option added
          content:
            application/json:
              example:
                data:
                  id: "0192a3bc-def0-7abc-8901-23456789abcf"
                  options:
                    - id: "opt_001"
                      text: "Thứ 2"
                      voteCount: 5
                      votedUserIds: []
                    - id: "opt_003"
                      text: "Thứ 5"
                      voteCount: 0
                      votedUserIds: []
                      addedBy: "user_456"
        "400":
          description: Poll is closed, expired, or does not allow new options
        "401":
          description: Unauthorized
        "403":
          description: Not a group member
        "404":
          description: Poll not found
        "409":
          description: Poll option already exists

  /v1/groups/{groupId}/polls/{pollId}/lock:
    post:
      summary: Close or lock a poll
      description: |
        Only poll creator, group owner, or group admins can close a poll.
        Once closed, no more voting or option additions are allowed.
      tags: [Chat - Polls]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
          required: true
        - in: path
          name: pollId
          schema:
            type: string
          required: true
      responses:
        "200":
          description: Poll closed
          content:
            application/json:
              example:
                data:
                  id: "0192a3bc-def0-7abc-8901-23456789abcf"
                  status: "closed"
                  closedAt: "2026-01-15T12:00:00.000Z"
                  closedBy: "user_123"
        "401":
          description: Unauthorized
        "403":
          description: Only poll creator, owner or admins can close the poll
        "404":
          description: Poll not found

  /v1/groups/{groupId}/polls/{pollId}/pin:
    post:
      summary: Pin a poll
      description: Pins the poll and its linked poll message card so pinned-message APIs can return the card.
      tags: [Chat - Polls]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
          required: true
        - in: path
          name: pollId
          schema:
            type: string
          required: true
      responses:
        "200":
          description: Poll pinned
          content:
            application/json:
              example:
                data:
                  id: "0192a3bc-def0-7abc-8901-23456789abcf"
                  pinned: true
                  pinnedAt: "2026-01-15T12:00:00.000Z"
                  pinnedBy: "user_123"
        "401":
          description: Unauthorized
        "403":
          description: Only poll creator, owner or admins can pin the poll
        "404":
          description: Poll not found

    delete:
      summary: Unpin a poll
      description: Unpins the poll and its linked poll message card.
      tags: [Chat - Polls]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
          required: true
        - in: path
          name: pollId
          schema:
            type: string
          required: true
      responses:
        "200":
          description: Poll unpinned
          content:
            application/json:
              example:
                data:
                  id: "0192a3bc-def0-7abc-8901-23456789abcf"
                  pinned: false
        "401":
          description: Unauthorized
        "403":
          description: Only poll creator, owner or admins can unpin the poll
        "404":
          description: Poll not found

  /v1/groups/{groupId}/polls/{pollId}/results:
    get:
      summary: Get poll results
      tags: [Chat - Polls]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
          required: true
        - in: path
          name: pollId
          schema:
            type: string
          required: true
      responses:
        "200":
          description: Poll results with visibility rules applied
          content:
            application/json:
              example:
                data:
                  id: "0192a3bc-def0-7abc-8901-23456789abcf"
                  question: "Chọn ngày họp?"
                  options:
                    - id: "opt_001"
                      text: "Thứ 2"
                      voteCount: 5
                      percentage: 62.5
                      votedUserIds: []
                    - id: "opt_002"
                      text: "Thứ 3"
                      voteCount: 3
                      percentage: 37.5
                      votedUserIds: []
                  totalVotes: 8
                  status: "active"
        "401":
          description: Unauthorized
        "403":
          description: Not a group member
        "404":
          description: Poll not found
