paths:
  /v1/groups/{groupId}/polls:
    get:
      summary: Get all polls in a group
      tags: [Chat - Polls]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
            example: "conv_group_001"
          required: true
      responses:
        "200":
          description: List of polls
          content:
            application/json:
              example:
                data:
                  polls:
                    - _id: "poll_001"
                      conversationId: "conv_group_001"
                      messageId: "0192a3bc-def0-7abc-8901-23456789abce"
                      question: "Chọn ngày họp?"
                      options:
                        - _id: "opt_001"
                          text: "Thứ 2"
                          voteCount: 5
                        - _id: "opt_002"
                          text: "Thứ 3"
                          voteCount: 3
                      isMultipleChoice: false
                      allowAddOption: true
                      showResultsBeforeClose: true
                      hideVoters: false
                      createdBy: "user_123"
                      createdAt: "2024-01-15T10:00:00Z"
                      expiresAt: "2024-01-20T10:00:00Z"
                      totalVotes: 8
        "401":
          description: Unauthorized

    post:
      summary: Create a poll
      tags: [Chat - Polls]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
            example: "conv_group_001"
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - question
                - options
              properties:
                question:
                  type: string
                  maxLength: 500
                  example: "Chọn ngày họp?"
                options:
                  type: array
                  items:
                    type: string
                  minItems: 2
                  maxItems: 20
                  example: ["Thứ 2", "Thứ 3", "Thứ 4"]
                isMultipleChoice:
                  type: boolean
                  default: false
                  description: Allow voting for multiple options
                  example: false
                allowAddOption:
                  type: boolean
                  default: true
                  description: Allow members to add new options
                  example: true
                showResultsBeforeClose:
                  type: boolean
                  default: true
                  description: Show poll results before the poll is closed
                  example: true
                hideVoters:
                  type: boolean
                  default: false
                  description: Hide voter identities from normal members
                  example: false
                expiresAt:
                  type: string
                  format: date-time
                  description: Poll expiration time (optional)
                  example: "2024-01-20T10:00:00Z"
      responses:
        "201":
          description: Poll created
          content:
            application/json:
              example:
                data:
                  _id: "poll_001"
                  conversationId: "conv_group_001"
                  messageId: "0192a3bc-def0-7abc-8901-23456789abce"
                  question: "Chọn ngày họp?"
                  options: [...]
                  hideVoters: false
                  createdAt: "2024-01-15T10:00:00Z"
        "401":
          description: Unauthorized
        "403":
          description: Only group members can create polls

  /v1/groups/{groupId}/polls/{pollId}/vote:
    post:
      summary: Vote on a poll
      tags: [Chat - Polls]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
            example: "conv_group_001"
          required: true
        - in: path
          name: pollId
          schema:
            type: string
            example: "poll_001"
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - optionIds
              properties:
                optionIds:
                  type: array
                  items:
                    type: string
                  description: Option IDs to vote for
                  example: ["opt_001"]
      responses:
        "200":
          description: Vote recorded
          content:
            application/json:
              example:
                data:
                  _id: "poll_001"
                  options: [...]
                  totalVotes: 9
        "401":
          description: Unauthorized
        "400":
          description: Poll has expired
        "422":
          description: Invalid option IDs

  /v1/groups/{groupId}/polls/{pollId}/options:
    post:
      summary: Add an option to a poll
      description: Adds a new option when the poll is active, not expired, and allowAddOption is true.
      tags: [Chat - Polls]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
            example: "conv_group_001"
          required: true
        - in: path
          name: pollId
          schema:
            type: string
            example: "poll_001"
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 200
                  example: "Thứ 5"
      responses:
        "200":
          description: Option added
          content:
            application/json:
              example:
                data:
                  _id: "poll_001"
                  options:
                    - _id: "opt_001"
                      text: "Thứ 2"
                      voteCount: 5
                    - _id: "opt_003"
                      text: "Thứ 5"
                      voteCount: 0
        "400":
          description: Poll is closed, expired, or does not allow new options
        "401":
          description: Unauthorized
        "403":
          description: Not a group member
        "404":
          description: Poll not found

  /v1/groups/{groupId}/polls/{pollId}/lock:
    post:
      summary: Close or lock a poll
      tags: [Chat - Polls]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
            example: "conv_group_001"
          required: true
        - in: path
          name: pollId
          schema:
            type: string
            example: "poll_001"
          required: true
      responses:
        "200":
          description: Poll closed
          content:
            application/json:
              example:
                data:
                  _id: "poll_001"
                  isClosed: true
        "401":
          description: Unauthorized
        "403":
          description: Only permitted group members can close the poll
        "404":
          description: Poll not found

  /v1/groups/{groupId}/polls/{pollId}/pin:
    post:
      summary: Pin a poll
      description: Pins the poll and its linked poll message card so pinned-message APIs can return the card.
      tags: [Chat - Polls]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
            example: "conv_group_001"
          required: true
        - in: path
          name: pollId
          schema:
            type: string
            example: "poll_001"
          required: true
      responses:
        "200":
          description: Poll pinned
          content:
            application/json:
              example:
                data:
                  _id: "poll_001"
                  pinned: true
        "401":
          description: Unauthorized
        "404":
          description: Poll not found
    delete:
      summary: Unpin a poll
      description: Unpins the poll and its linked poll message card.
      tags: [Chat - Polls]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
            example: "conv_group_001"
          required: true
        - in: path
          name: pollId
          schema:
            type: string
            example: "poll_001"
          required: true
      responses:
        "200":
          description: Poll unpinned
          content:
            application/json:
              example:
                data:
                  _id: "poll_001"
                  pinned: false
        "401":
          description: Unauthorized
        "404":
          description: Poll not found

  /v1/groups/{groupId}/polls/{pollId}/results:
    get:
      summary: Get poll results
      tags: [Chat - Polls]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: groupId
          schema:
            type: string
            example: "conv_group_001"
          required: true
        - in: path
          name: pollId
          schema:
            type: string
            example: "poll_001"
          required: true
      responses:
        "200":
          description: Poll results
          content:
            application/json:
              example:
                data:
                  _id: "poll_001"
                  question: "Chọn ngày họp?"
                  options:
                    - _id: "opt_001"
                      text: "Thứ 2"
                      voteCount: 5
                      percentage: 62.5
                      votedBy:
                        - userId: "user_001"
                          votedAt: "2024-01-15T10:30:00Z"
                    - _id: "opt_002"
                      text: "Thứ 3"
                      voteCount: 3
                      percentage: 37.5
                      votedBy:
                        - userId: "user_002"
                          votedAt: "2024-01-15T10:35:00Z"
                  totalVotes: 8
                  isExpired: false
        "401":
          description: Unauthorized
