components:
  schemas:
    ConversationResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            _id:
              type: string
              example: "conv_001"
            name:
              type: string
              example: "Nhóm Dev Team"
            type:
              type: string
              enum: [private, group]
              example: "group"
            avatarUrl:
              type: string
              format: uri
            lastMessage:
              type: object
            unreadCount:
              type: integer
            membersCount:
              type: integer
            lastMessageAt:
              type: string
              format: date-time
            isPinned:
              type: boolean
            isMuted:
              type: boolean
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    MediaAttachment:
      type: object
      properties:
        fileId:
          type: string
          description: File ID from media service
          example: "file_abc123"
        type:
          type: string
          enum: [image, video, audio, file]
          example: "image"
        url:
          type: string
          format: uri
          description: URL of the media file
        thumbnailUrl:
          type: string
          format: uri
          description: Thumbnail URL (for video/images)
        filename:
          type: string
          example: "photo.jpg"
        size:
          type: integer
          description: File size in bytes
        width:
          type: integer
          description: Image/video width in pixels
        height:
          type: integer
          description: Image/video height in pixels
        duration:
          type: integer
          description: Audio/video duration in seconds
        mimeType:
          type: string
          example: "image/jpeg"

    MessageResponse:
      type: object
      properties:
        _id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
        clientMessageId:
          type: string
          nullable: true
          description: Optional client-generated id used for idempotent sends.
        senderName:
          type: string
          description: Display name of the sender (enriched from user query)
          example: "Nguyễn Văn A"
        senderAvatar:
          type: string
          format: uri
          nullable: true
          description: Avatar URL of the sender
        type:
          type: string
          enum: [text, image, file, link, video, voice, sticker, gif, call, system, profile_card, poll, reminder]
        text:
          type: string
          nullable: true
        media:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/MediaAttachment"
        links:
          type: array
          nullable: true
          items:
            type: string
        pollId:
          type: string
          nullable: true
          description: Present when type is poll or when a system message references a poll.
        reminderId:
          type: string
          nullable: true
          description: Present when type is reminder or when a system message references a reminder.
        systemAction:
          type: string
          nullable: true
          description: System activity action, such as poll_vote_activity or reminder_due.
        systemRefId:
          type: string
          nullable: true
          description: Referenced business entity id for a system activity message.
        poll:
          type: object
          nullable: true
          description: Hydrated poll card data when loading messages or pinned messages.
        reminder:
          type: object
          nullable: true
          description: Hydrated reminder card data when loading messages or pinned messages.
        mentions:
          type: array
          nullable: true
          items:
            type: object
            properties:
              userId: {type: string, format: uuid}
              startIndex: {type: integer}
              endIndex: {type: integer}
        reactions:
          type: array
          nullable: true
          description: Reactions grouped by emoji, each with list of users
          items:
            $ref: "#/components/schemas/ReactionItem"
        replyToId:
          type: string
          format: uuid
          nullable: true
          description: ID of the message being replied to
        replyTo:
          description: Preview of the replied-to message (populated by loadMessages)
          oneOf:
            - $ref: "#/components/schemas/ReplyToPreview"
            - type: object
        quotedMessageId:
          type: string
          format: uuid
          nullable: true
        quotedMessagePreview:
          type: string
          nullable: true
        isPinned:
          type: boolean
          default: false
        pinnedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the message was pinned
        isRevoked:
          type: boolean
          default: false
        revokedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the message was revoked/deleted for everyone
        isEdited:
          type: boolean
          default: false
          description: Whether the message has been edited (computed from editedAt)
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true

    ReplyToPreview:
      type: object
      properties:
        _id:
          type: string
        senderId:
          type: string
        senderName:
          type: string
        text:
          type: string
          nullable: true

    ReactionItem:
      type: object
      properties:
        emoji:
          type: string
          example: "👍"
        count:
          type: integer
          description: Total count of this emoji reaction
          example: 5
        users:
          type: array
          description: List of users who reacted with this emoji
          items:
            type: object
            properties:
              _id:
                type: string
                format: uuid
              displayName:
                type: string
              avatarUrl:
                type: string
                format: uri
                nullable: true

    ConversationListItem:
      type: object
      properties:
        _id:
          type: string
          example: "0192a3bc-def0-7abc-8901-23456789abcd"
        name:
          type: string
          example: "Nguyễn Văn A"
        type:
          type: string
          enum: [private, group]
          example: "private"
        avatarUrl:
          type: string
          format: uri
          nullable: true
        lastMessage:
          type: object
          nullable: true
          properties:
            _id:
              type: string
            text:
              type: string
              nullable: true
            senderId:
              type: string
            senderName:
              type: string
            createdAt:
              type: string
              format: date-time
        unreadCount:
          type: integer
          example: 3
        isPinned:
          type: boolean
          example: false
        isMuted:
          type: boolean
          example: false
        isArchived:
          type: boolean
          example: false
        members:
          type: array
          description: Only for private conversations (2 members)
          items:
            type: object
            properties:
              userId:
                type: string
              displayName:
                type: string
              avatarUrl:
                type: string
                format: uri
                nullable: true
        memberIds:
          type: array
          description: Only for group conversations
          items:
            type: string
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    ConversationDetail:
      type: object
      properties:
        _id:
          type: string
          example: "0192a3bc-def0-7abc-8901-23456789abcd"
        name:
          type: string
          nullable: true
        type:
          type: string
          enum: [private, group]
          example: "group"
        avatarUrl:
          type: string
          format: uri
          nullable: true
        pairKey:
          type: string
          nullable: true
        createdBy:
          type: string
        ownerId:
          type: string
          nullable: true
        adminIds:
          type: array
          items:
            type: string
        membersCount:
          type: integer
        settings:
          type: object
          nullable: true
          properties:
            allowSendLink:
              type: boolean
            requireApproval:
              type: boolean
            allowMemberInvite:
              type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ConversationMemberItem:
      type: object
      properties:
        _id:
          type: string
          example: "0192a3bc-def0-7abc-8901-23456789abce"
        userId:
          type: string
          example: "user_123"
        displayName:
          type: string
          example: "Nguyễn Văn A"
        avatarUrl:
          type: string
          format: uri
          nullable: true
        role:
          type: string
          enum: [owner, admin, member]
          example: "admin"
        joinedAt:
          type: string
          format: date-time
        lastReadAt:
          type: string
          format: date-time
          nullable: true
        isOnline:
          type: boolean
          example: false

    ConversationStatistics:
      type: object
      properties:
        memberCount:
          type: integer
          example: 5
        activeMemberCount:
          type: integer
          example: 4
        lastActivity:
          type: string
          format: date-time
          nullable: true
          example: "2024-01-15T14:30:00Z"
        createdAt:
          type: string
          format: date-time

    OnlineMember:
      type: object
      properties:
        userId:
          type: string
          example: "user_123"
        isOnline:
          type: boolean
          example: false
        lastSeen:
          type: string
          format: date-time
          nullable: true

    Draft:
      type: object
      properties:
        id:
          type: string
          example: "draft_001"
        conversationId:
          type: string
          example: "0192a3bc-def0-7abc-8901-23456789abcd"
        userId:
          type: string
          example: "user_123"
        text:
          type: string
          example: "Draft message text..."
        media:
          type: array
          items:
            $ref: "#/components/schemas/MediaAttachment"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CopyConversationResult:
      type: object
      properties:
        conversation:
          type: object
          properties:
            _id:
              type: string
              example: "0192a3bc-def0-7abc-8901-23456789abce"
            type:
              type: string
              enum: [private]
            createdBy:
              type: string
            membersCount:
              type: integer
            createdAt:
              type: string
              format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/MessageResponse"
        totalCopied:
          type: integer
          description: Total number of messages copied
          example: 5

    ReactionDetail:
      type: object
      properties:
        _id:
          type: string
          example: "0192a3bc-def0-7abc-8901-23456789abcd"
        messageId:
          type: string
          example: "0192a3bc-def0-7abc-8901-23456789abce"
        userId:
          type: string
          example: "user_123"
        emoji:
          type: string
          example: "👍"
        createdAt:
          type: string
          format: date-time
