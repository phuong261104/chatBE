paths:
  /friendships:
    get:
      summary: Get list of friends
      tags: [Friendships]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: "So trang"
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: "So luong moi trang"
      responses:
        "200":
          description: A list of friends
          content:
            application/json:
              example:
                data:
                  items:
                    - id: "60d0fe4f5311236168a20000"
                      userA: "60d0fe4f5311236168a10001"
                      userB: "60d0fe4f5311236168a10002"
                      createdAt: "2026-04-01T10:00:00.000Z"
                  total: 1
                  page: 1
                  limit: 20
                  hasMore: false

  /friendships/{friendId}:
    delete:
      summary: Unfriend a user
      tags: [Friendships]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: friendId
          schema:
            type: string
            example: "user-2"
          required: true
      responses:
        "204":
          description: Unfriended successfully

  /friendships/{friendId}/check:
    get:
      summary: Check friendship status
      tags: [Friendships]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: friendId
          schema:
            type: string
            example: "user-2"
          required: true
      responses:
        "200":
          description: Friendship status
          content:
            application/json:
              example:
                data:
                  isFriend: true

  /users/{id}/mutual-friends:
    get:
      summary: Get mutual friends
      tags: [Friendships]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
            example: "user-2"
          required: true
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of mutual friends
          content:
            application/json:
              example:
                data:
                  items:
                    - id: "60d0fe4f5311236168a30000"
                      displayName: "Bạn chung 1"
                  total: 1

  /users/{id}/suggestions:
    get:
      summary: Get friend suggestions
      tags: [Friendships]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
            example: "60d0fe4f5311236168a1"
          required: true
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of friend suggestions
          content:
            application/json:
              example:
                data:
                  items:
                    - id: "60d0fe4f5311236168a40000"
                      displayName: "Gợi ý kết bạn"
                  total: 1
