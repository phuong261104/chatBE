components:
  schemas:
    CloudItemType:
      type: string
      enum: [file, image, video, voice, link, note]
      description: "Loại item trong My Cloud"
      example: "note"

    CloudItem:
      type: object
      description: "Một item trong My Cloud"
      properties:
        id:
          type: string
          format: uuid
          description: "UUID của item"
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        userId:
          type: string
          format: uuid
          description: "UUID của người dùng sở hữu"
          example: "f1e2d3c4-b5a6-7890-1234-567890abcdef"
        collectionId:
          type: string
          format: uuid
          nullable: true
          description: "UUID của collection chứa item"
          example: "c1d2e3f4-a5b6-7890-1234-567890abcdef"
        type:
          $ref: '#/components/schemas/CloudItemType'
        title:
          type: string
          description: "Tiêu đề item"
          example: "Ghi chú công việc"
        content:
          type: string
          nullable: true
          description: "Nội dung (cho loại note)"
          example: "Mua sữa, trả bills..."
        fileUrl:
          type: string
          format: uri
          nullable: true
          description: "URL của file đính kèm"
          example: "https://cdn.example.com/files/doc.pdf"
        fileName:
          type: string
          nullable: true
          description: "Tên file gốc"
          example: "baocao-thang6.pdf"
        fileSize:
          type: integer
          nullable: true
          description: "Kích thước file (bytes)"
          example: 1048576
        mimetype:
          type: string
          nullable: true
          description: "MIME type của file"
          example: "application/pdf"
        thumbnailUrl:
          type: string
          format: uri
          nullable: true
          description: "URL thumbnail (cho ảnh/video)"
        isPinned:
          type: boolean
          description: "Đã ghim lên đầu"
          example: false
        isDeleted:
          type: boolean
          description: "Đã xóa (thùng rác)"
          example: false
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: "Thời điểm xóa"
        shareToken:
          type: string
          nullable: true
          description: "Token chia sẻ công khai"
        shareExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: "Hết hạn chia sẻ"
        createdAt:
          type: string
          format: date-time
          description: "Thời điểm tạo"
          example: "2026-04-21T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          description: "Thời điểm cập nhật"
          example: "2026-04-21T10:00:00Z"

    Collection:
      type: object
      description: "Một collection (thư mục) trong My Cloud"
      properties:
        id:
          type: string
          format: uuid
          description: "UUID của collection"
          example: "c1d2e3f4-a5b6-7890-1234-567890abcdef"
        userId:
          type: string
          format: uuid
          description: "UUID của người dùng sở hữu"
          example: "f1e2d3c4-b5a6-7890-1234-567890abcdef"
        name:
          type: string
          description: "Tên collection"
          example: "My Document"
        description:
          type: string
          nullable: true
          description: "Mô tả collection"
          example: "Your default document collection"
        color:
          type: string
          nullable: true
          description: "Màu sắc collection (hex code)"
          example: "#4F46E5"
        icon:
          type: string
          nullable: true
          description: "Icon của collection"
          example: "folder"
        coverImageUrl:
          type: string
          format: uri
          nullable: true
          description: "URL ảnh bìa collection"
        parentId:
          type: string
          format: uuid
          nullable: true
          description: "UUID của collection cha (null = root)"
        isDefault:
          type: boolean
          description: "Là collection mặc định (không thể xóa)"
          example: true
        isDeleted:
          type: boolean
          description: "Đã xóa"
          example: false
        itemCount:
          type: integer
          description: "Số lượng items trong collection"
          example: 15
        createdAt:
          type: string
          format: date-time
          description: "Thời điểm tạo"
          example: "2026-04-21T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          description: "Thời điểm cập nhật"
          example: "2026-04-21T10:00:00Z"

    PresignedUploadResult:
      type: object
      description: "Kết quả tạo presigned URL để upload lên S3"
      properties:
        uploadUrl:
          type: string
          format: uri
          description: "Presigned URL để upload file"
          example: "https://bucket.s3.amazonaws.com/file.pdf?X-Amz-Signature=..."
        fileKey:
          type: string
          description: "Key của file trong S3"
          example: "uploads/file-uuid.pdf"
        draftToken:
          type: string
          description: "Token để xác nhận upload sau khi hoàn tất"
          example: "draft-token-uuid"
        expiresIn:
          type: integer
          description: "Thời gian hết hạn (giây)"
          example: 3600

    CloudItemStats:
      type: object
      description: "Thống kê My Cloud của người dùng"
      properties:
        totalItems:
          type: integer
          description: "Tổng số item"
          example: 42
        totalSize:
          type: integer
          description: "Tổng kích thước (bytes)"
          example: 52428800
        pinnedCount:
          type: integer
          description: "Số item đã ghim"
          example: 3
        trashCount:
          type: integer
          description: "Số item trong thùng rác"
          example: 5
        byType:
          type: object
          description: "Thống kê theo từng loại"
          properties:
            image:
              type: object
              properties:
                count: { type: integer, example: 10 }
                size: { type: integer, example: 20971520 }
            video:
              type: object
              properties:
                count: { type: integer, example: 5 }
                size: { type: integer, example: 31457280 }
            voice:
              type: object
              properties:
                count: { type: integer, example: 2 }
                size: { type: integer, example: 102400 }
            file:
              type: object
              properties:
                count: { type: integer, example: 15 }
                size: { type: integer, example: 5242880 }
            link:
              type: object
              properties:
                count: { type: integer, example: 8 }
                size: { type: integer, example: 0 }
            note:
              type: object
              properties:
                count: { type: integer, example: 2 }
                size: { type: integer, example: 0 }

    ShareResult:
      type: object
      description: "Kết quả tạo link chia sẻ"
      properties:
        shareToken:
          type: string
          description: "Token chia sẻ"
          example: "abc123xyz"
        shareUrl:
          type: string
          format: uri
          description: "URL chia sẻ"
          example: "https://app.example.com/my-cloud/shared/abc123xyz"
        expiresAt:
          type: string
          format: date-time
          description: "Thời điểm hết hạn"
          example: "2026-04-28T10:00:00Z"

paths:
  # ==================== MY CLOUD CRUD ====================

  /v1/my-cloud:
    get:
      summary: "Get all my cloud items"
      tags: [My Cloud]
      description: |
        Lấy danh sách tất cả items của người dùng hiện tại (không tính thùng rác).
        Hỗ trợ lọc theo loại item và phân trang.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: type
          schema:
            $ref: '#/components/schemas/CloudItemType'
          description: "Lọc theo loại item (mặc định: all)"
          example: "image"
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: "Số trang"
          example: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: "Số item mỗi trang"
          example: 20
      responses:
        '200':
          description: "Danh sách items"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/CloudItem'
                      hasMore:
                        type: boolean
                        example: true
                      total:
                        type: integer
                        example: 42
        '401':
          description: "Unauthorized"
        '422':
          description: "Validation error"

    post:
      summary: "Create a new my cloud item"
      tags: [My Cloud]
      description: |
        Tạo một item mới trong My Cloud.

        ## Loại item và trường bắt buộc

        | Loại | Bắt buộc |
        |------|----------|
        | note | title |
        | image | title, fileUrl, fileName |
        | video | title, fileUrl, fileName |
        | voice | title, fileUrl, fileName |
        | file | title, fileUrl, fileName |
        | link | title, fileUrl |
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - title
              properties:
                type:
                  $ref: '#/components/schemas/CloudItemType'
                  example: "note"
                title:
                  type: string
                  minLength: 1
                  maxLength: 500
                  example: "Ghi chú học tập"
                content:
                  type: string
                  description: "Nội dung (cho loại note)"
                  example: "Học typescript tuần này"
                fileUrl:
                  type: string
                  format: uri
                  description: "URL của file (cho image/video/voice/file/link)"
                  example: "https://cdn.example.com/image.jpg"
                fileName:
                  type: string
                  description: "Tên file gốc (cho image/video/voice/file)"
                  example: "photo.jpg"
                fileSize:
                  type: integer
                  description: "Kích thước file (bytes)"
                  example: 204800
                mimetype:
                  type: string
                  description: "MIME type"
                  example: "image/jpeg"
                thumbnailUrl:
                  type: string
                  format: uri
                  description: "URL thumbnail"
                  example: "https://cdn.example.com/thumb.jpg"
            example:
              type: "note"
              title: "Todo hôm nay"
              content: "- Meeting 10h\n- Code review\n- Gửi email"
      responses:
        '201':
          description: "Item đã được tạo"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CloudItem'
        '401':
          description: "Unauthorized"
        '422':
          description: "Validation error"
          content:
            application/json:
              example:
                error:
                  code: "VALIDATION_ERROR"
                  message: "Validation error"

  # ==================== MY CLOUD - PAGINATED LIST ====================

  /v1/my-cloud/items:
    get:
      summary: "Get my cloud items (cursor-based pagination)"
      tags: [My Cloud]
      description: |
        Lấy danh sách items với cursor-based pagination.
        Hỗ trợ lọc theo loại, trạng thái xóa, và trạng thái ghim.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: "Số item mỗi lần load"
          example: 20
        - in: query
          name: cursor
          schema:
            type: string
          description: "Cursor từ response trước"
          example: "eyJpZCI6ImFiY2RlIn0="
        - in: query
          name: type
          schema:
            $ref: '#/components/schemas/CloudItemType'
          description: "Lọc theo loại"
        - in: query
          name: isDeleted
          schema:
            type: boolean
          description: "Lọc items đã xóa (true = thùng rác)"
        - in: query
          name: isPinned
          schema:
            type: boolean
          description: "Lọc items đã ghim"
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: "Thứ tự sắp xếp theo thời gian tạo"
      responses:
        '200':
          description: "Danh sách items với cursor"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CloudItem'
                  nextCursor:
                    type: string
                    nullable: true
                    description: "Cursor cho lần load tiếp theo"
                    example: "eyJpZCI6ImFiY2RlIn0="
        '401':
          description: "Unauthorized"

  # ==================== MY CLOUD - GET SINGLE ====================

  /v1/my-cloud/{id}:
    get:
      summary: "Get a single my cloud item"
      tags: [My Cloud]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: "UUID của item"
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
      responses:
        '200':
          description: "Item details"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CloudItem'
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden - không sở hữu item này"
        '404':
          description: "Item not found"

    patch:
      summary: "Update a my cloud item"
      tags: [My Cloud]
      description: "Cập nhật tiêu đề và nội dung của một item."
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: "UUID của item"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 500
                  example: "Tiêu đề đã cập nhật"
                content:
                  type: string
                  description: "Nội dung mới (cho note)"
                  example: "Nội dung đã cập nhật"
      responses:
        '200':
          description: "Item đã được cập nhật"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CloudItem'
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"
        '404':
          description: "Item not found"
        '422':
          description: "Validation error"

    delete:
      summary: "Soft delete a my cloud item (move to trash)"
      tags: [My Cloud]
      description: |
        Xóa mềm - di chuyển item vào thùng rác.
        Item vẫn còn trong DB và có thể khôi phục.
        Tự động xóa vĩnh viễn sau 30 ngày.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: "UUID của item"
      responses:
        '204':
          description: "Item đã được xóa (soft delete)"
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"
        '404':
          description: "Item not found"

  # ==================== MY CLOUD - PIN ====================

  /v1/my-cloud/{id}/pin:
    patch:
      summary: "Pin or unpin a my cloud item"
      tags: [My Cloud]
      description: "Ghim hoặc bỏ ghim một item để hiển thị ở đầu danh sách."
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: "UUID của item"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pinned
              properties:
                pinned:
                  type: boolean
                  description: "`true` = ghim, `false` = bỏ ghim"
                  example: true
      responses:
        '200':
          description: "Item đã được ghim/bỏ ghim"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CloudItem'
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"
        '404':
          description: "Item not found"

  # ==================== MY CLOUD - TRASH ====================

  /v1/my-cloud/{id}/restore:
    post:
      summary: "Restore a my cloud item from trash"
      tags: [My Cloud]
      description: "Khôi phục một item từ thùng rác."
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: "UUID của item"
      responses:
        '200':
          description: "Item đã được khôi phục"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CloudItem'
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"
        '404':
          description: "Item not found or not in trash"

  /v1/my-cloud/{id}/permanent:
    delete:
      summary: "Permanently delete a my cloud item"
      tags: [My Cloud]
      description: |
        Xóa vĩnh viễn một item (khỏi thùng rác).
        **Hành động này không thể hoàn tác.**
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: "UUID của item"
      responses:
        '204':
          description: "Item đã được xóa vĩnh viễn"
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"
        '404':
          description: "Item not found"

  /v1/my-cloud/trash/empty:
    post:
      summary: "Empty the trash (delete all trashed items permanently)"
      tags: [My Cloud]
      description: |
        Xóa vĩnh viễn tất cả items trong thùng rác của người dùng.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: "Trash emptied successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deleted:
                        type: integer
                        description: "Số items đã xóa"
                        example: 5
        '401':
          description: "Unauthorized"

  # ==================== MY CLOUD - SEARCH ====================

  /v1/my-cloud/search:
    get:
      summary: "Search my cloud items"
      tags: [My Cloud]
      description: "Tìm kiếm items theo tiêu đề. Không tìm trong thùng rác."
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 1
          description: "Từ khóa tìm kiếm"
          example: "báo cáo"
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          description: "Số kết quả tối đa"
      responses:
        '200':
          description: "Kết quả tìm kiếm"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CloudItem'
        '400':
          description: "Thiếu tham số q"
        '401':
          description: "Unauthorized"

  # ==================== MY CLOUD - STATS ====================

  /v1/my-cloud/stats:
    get:
      summary: "Get my cloud statistics"
      tags: [My Cloud]
      description: |
        Lấy thống kê My Cloud của người dùng hiện tại.
        Bao gồm tổng số item, tổng kích thước, số item đã ghim,
        số item trong thùng rác, và thống kê theo từng loại.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: "Thống kê My Cloud"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CloudItemStats'
        '401':
          description: "Unauthorized"

  # ==================== MY CLOUD - BATCH DELETE ====================

  /v1/my-cloud/batch-delete:
    post:
      summary: "Batch delete my cloud items"
      tags: [My Cloud]
      description: |
        Xóa mềm nhiều items cùng lúc (di chuyển vào thùng rác).
        Tối đa 100 items mỗi lần gọi.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - itemIds
              properties:
                itemIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
                  maxItems: 100
                  description: "Danh sách UUID của các items cần xóa"
                  example: ["a1b2c3d4-e5f6-7890-abcd-ef1234567890", "b2c3d4e5-f6a7-8901-bcde-f23456789012"]
            example:
              itemIds:
                - "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                - "b2c3d4e5-f6a7-8901-bcde-f23456789012"
      responses:
        '200':
          description: "Items đã được xóa"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deleted:
                        type: integer
                        description: "Số items đã xóa"
                        example: 2
        '401':
          description: "Unauthorized"
        '422':
          description: "Validation error"

  # ==================== MY CLOUD - SHARE ====================

  /v1/my-cloud/{id}/share:
    post:
      summary: "Create a public share link for an item"
      tags: [My Cloud]
      description: |
        Tạo link chia sẻ công khai cho một item.
        Ai có link đều có thể xem item mà không cần đăng nhập.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: "UUID của item"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresInDays:
                  type: integer
                  minimum: 1
                  maximum: 365
                  default: 7
                  description: "Số ngày hết hạn (mặc định: 7)"
                  example: 7
            example:
              expiresInDays: 7
      responses:
        '200':
          description: "Link chia sẻ đã được tạo"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ShareResult'
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"
        '404':
          description: "Item not found"

  /v1/my-cloud/shared/{shareToken}:
    get:
      summary: "Get a shared item by share token (public)"
      tags: [My Cloud]
      description: |
        Lấy thông tin một item được chia sẻ qua link công khai.
        **Không cần đăng nhập** - endpoint này public.
      parameters:
        - in: path
          name: shareToken
          required: true
          schema:
            type: string
          description: "Share token từ link chia sẻ"
          example: "abc123xyz"
      responses:
        '200':
          description: "Thông tin item được chia sẻ"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CloudItem'
        '404':
          description: "Shared item not found or expired"

  # ==================== MY CLOUD - UPLOAD ====================

  /v1/my-cloud/upload:
    post:
      summary: "Upload a file to My Cloud"
      tags: [My Cloud]
      description: |
        Upload một file lên My Cloud qua server.
        File sẽ được lưu trên S3 và tự động phân loại theo MIME type.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: "File cần upload"
                title:
                  type: string
                  description: "Tiêu đề (mặc định = tên file)"
      responses:
        '201':
          description: "File đã được upload và tạo item"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CloudItem'
        '400':
          description: "Không có file được upload"
        '401':
          description: "Unauthorized"

  /v1/my-cloud/upload/presigned:
    post:
      summary: "Get presigned URL for direct S3 upload"
      tags: [My Cloud]
      description: |
        Lấy presigned URL để client có thể upload trực tiếp lên S3.
        Sau khi upload xong, client cần gọi `/my-cloud/upload/confirm` để tạo CloudItem.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fileName
                - contentType
              properties:
                fileName:
                  type: string
                  description: "Tên file gốc"
                  example: "document.pdf"
                contentType:
                  type: string
                  description: "MIME type của file"
                  example: "application/pdf"
                fileSize:
                  type: integer
                  description: "Kích thước file (bytes)"
                  example: 1048576
            example:
              fileName: "bao-cao.pdf"
              contentType: "application/pdf"
              fileSize: 524288
      responses:
        '200':
          description: "Presigned URL đã được tạo"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PresignedUploadResult'
        '401':
          description: "Unauthorized"
        '422':
          description: "Validation error"

  /v1/my-cloud/upload/confirm:
    post:
      summary: "Confirm uploaded file and create CloudItem"
      tags: [My Cloud]
      description: |
        Xác nhận file đã upload lên S3 và tạo CloudItem.
        Gọi sau khi client đã upload file thành công qua presigned URL.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fileKey
                - contentType
              properties:
                draftToken:
                  type: string
                  description: "Token từ bước presigned"
                fileKey:
                  type: string
                  description: "Key của file trong S3"
                  example: "uploads/document-uuid.pdf"
                fileName:
                  type: string
                  description: "Tên file gốc"
                  example: "bao-cao.pdf"
                contentType:
                  type: string
                  description: "MIME type"
                  example: "application/pdf"
                fileSize:
                  type: integer
                  description: "Kích thước file"
                  example: 524288
                title:
                  type: string
                  description: "Tiêu đề item"
                collectionId:
                  type: string
                  format: uuid
                  description: "UUID của collection (mặc định = My Document)"
            example:
              fileKey: "uploads/document-uuid.pdf"
              fileName: "bao-cao.pdf"
              contentType: "application/pdf"
              fileSize: 524288
              title: "Báo cáo tháng 4"
      responses:
        '201':
          description: "CloudItem đã được tạo"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CloudItem'
        '400':
          description: "Thiếu thông tin file"
        '401':
          description: "Unauthorized"

  # ==================== MY CLOUD - FORWARD TO CHAT ====================

  /v1/my-cloud/{id}/forward:
    post:
      summary: "Forward a cloud item to a chat conversation"
      tags: [My Cloud]
      description: |
        Gửi một cloud item đến một cuộc trò chuyện chat.
        Item sẽ được gửi dưới dạng media attachment trong tin nhắn.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: "UUID của cloud item"
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - conversationId
              properties:
                conversationId:
                  type: string
                  format: uuid
                  description: "UUID của cuộc trò chuyện"
                  example: "c2d3e4f5-a6b7-8901-2345-67890abcdef0"
            example:
              conversationId: "c2d3e4f5-a6b7-8901-2345-67890abcdef0"
      responses:
        '200':
          description: "Item đã được gửi đến chat"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: "Message object đã được tạo"
        '400':
          description: "Thiếu conversationId"
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden - không sở hữu item này"
        '404':
          description: "Item not found hoặc conversation not found"

  # ==================== MY CLOUD - COLLECTIONS ====================

  /v1/my-cloud/collections:
    get:
      summary: "List user's collections"
      tags: [My Cloud]
      description: |
        Lấy danh sách tất cả collections của người dùng.
        Luôn bao gồm collection mặc định "My Document".
      security:
        - BearerAuth: []
      responses:
        '200':
          description: "Danh sách collections"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Collection'
        '401':
          description: "Unauthorized"

    post:
      summary: "Create a new collection"
      tags: [My Cloud]
      description: |
        Tạo một collection mới.
        Hệ thống sẽ tự động đảm bảo collection mặc định "My Document" tồn tại.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: "Tên collection"
                  example: "Công việc"
                description:
                  type: string
                  maxLength: 500
                  description: "Mô tả collection"
                  example: "Tài liệu liên quan đến công việc"
                color:
                  type: string
                  maxLength: 20
                  description: "Màu sắc (hex code)"
                  example: "#4F46E5"
                icon:
                  type: string
                  maxLength: 50
                  description: "Icon name"
                  example: "folder"
                coverImageUrl:
                  type: string
                  format: uri
                  description: "URL ảnh bìa"
                parentId:
                  type: string
                  format: uuid
                  description: "UUID của collection cha"
            example:
              name: "Công việc"
              description: "Tài liệu công việc"
              color: "#4F46E5"
      responses:
        '201':
          description: "Collection đã được tạo"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Collection'
        '401':
          description: "Unauthorized"
        '422':
          description: "Validation error"

  /v1/my-cloud/collections/{id}:
    get:
      summary: "Get a single collection"
      tags: [My Cloud]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: "UUID của collection"
      responses:
        '200':
          description: "Collection details"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Collection'
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"
        '404':
          description: "Collection not found"

    patch:
      summary: "Update a collection"
      tags: [My Cloud]
      description: "Cập nhật thông tin collection. Không thể cập nhật collection mặc định."
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: "UUID của collection"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                description:
                  type: string
                  maxLength: 500
                color:
                  type: string
                  maxLength: 20
                icon:
                  type: string
                  maxLength: 50
                coverImageUrl:
                  type: string
                  format: uri
                parentId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: "Collection đã được cập nhật"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Collection'
        '400':
          description: "Không thể cập nhật collection mặc định"
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"
        '404':
          description: "Collection not found"

    delete:
      summary: "Delete a collection"
      tags: [My Cloud]
      description: |
        Xóa một collection (soft delete).
        Items trong collection sẽ được di chuyển sang "My Document".
        **Không thể xóa collection mặc định.**
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: "UUID của collection"
      responses:
        '204':
          description: "Collection đã được xóa"
        '400':
          description: "Không thể xóa collection mặc định"
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"
        '404':
          description: "Collection not found"

  /v1/my-cloud/collections/{id}/items:
    get:
      summary: "Get items in a collection"
      tags: [My Cloud]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: "UUID của collection"
      responses:
        '200':
          description: "Danh sách items trong collection"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CloudItem'
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"
        '404':
          description: "Collection not found"

    post:
      summary: "Add item to collection"
      tags: [My Cloud]
      description: "Thêm một item vào collection."
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: "UUID của collection"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - itemId
              properties:
                itemId:
                  type: string
                  format: uuid
                  description: "UUID của item cần thêm"
            example:
              itemId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
      responses:
        '200':
          description: "Item đã được thêm vào collection"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"
        '404':
          description: "Collection hoặc item not found"

  /v1/my-cloud/collections/{id}/items/{itemId}:
    delete:
      summary: "Remove item from collection"
      tags: [My Cloud]
      description: |
        Xóa một item khỏi collection.
        Item sẽ được di chuyển vào collection mặc định "My Document".
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: "UUID của collection"
        - in: path
          name: itemId
          required: true
          schema:
            type: string
            format: uuid
          description: "UUID của item"
      responses:
        '200':
          description: "Item đã được xóa khỏi collection"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"
        '404':
          description: "Collection hoặc item not found"
