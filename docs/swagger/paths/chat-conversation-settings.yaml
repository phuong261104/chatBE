paths:
  /v1/conversations/{conversationId}/nickname:
    patch:
      summary: Set nickname for a member in conversation
      description: |
        Allows a user to set a custom nickname for another member in a conversation.
        The nickname is only visible to the user who sets it.
      tags: [Chat - Conversations]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
          required: true
          description: Conversation ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetUserId, nickname]
              properties:
                targetUserId:
                  type: string
                  description: User ID of the member whose nickname is being set
                  example: "0192a3bc-def0-7abc-8901-23456789abcd"
                nickname:
                  type: string
                  minLength: 1
                  maxLength: 50
                  description: Custom nickname (no whitespace-only strings)
                  example: "Đức FE"
            example:
              targetUserId: "0192a3bc-def0-7abc-8901-23456789abcd"
              nickname: "Đức FE"
      responses:
        "200":
          description: Nickname set successfully
          content:
            application/json:
              example:
                success: true
        "400":
          description: Invalid nickname (empty, too long, or whitespace-only)
        "401":
          description: Unauthorized
        "403":
          description: Not a member of this conversation or target user is not a member

    delete:
      summary: Remove nickname for a member in conversation
      description: |
        Removes a previously set nickname for a member in a conversation.
        Falls back to displaying the member's original display name.
      tags: [Chat - Conversations]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
          required: true
          description: Conversation ID
        - in: path
          name: targetUserId
          schema:
            type: string
          required: true
          description: User ID of the member whose nickname is being removed
      responses:
        "200":
          description: Nickname removed successfully
          content:
            application/json:
              example:
                success: true
        "401":
          description: Unauthorized
        "403":
          description: Not a member of this conversation or target user is not a member

  /v1/conversations/{conversationId}/wallpaper:
    patch:
      summary: Set wallpaper for conversation
      description: |
        Sets a custom wallpaper for a conversation. The wallpaper is only visible
        to the user who sets it (personal wallpaper).
      tags: [Chat - Conversations]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
          required: true
          description: Conversation ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wallpaperUrl]
              properties:
                wallpaperUrl:
                  type: string
                  format: uri
                  nullable: true
                  description: |
                    URL of the wallpaper image. Set to null to reset to default.
                    Supported formats: JPG, PNG, WEBP.
                  example: "https://cdn.example.com/wallpapers/sunset.jpg"
            example:
              wallpaperUrl: "https://cdn.example.com/wallpapers/sunset.jpg"
      responses:
        "200":
          description: Wallpaper set successfully
          content:
            application/json:
              example:
                success: true
        "400":
          description: Invalid wallpaper URL
        "401":
          description: Unauthorized
        "403":
          description: Not a member of this conversation

    delete:
      summary: Remove wallpaper for conversation
      description: |
        Removes the custom wallpaper and resets to the default conversation wallpaper.
      tags: [Chat - Conversations]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: conversationId
          schema:
            type: string
          required: true
          description: Conversation ID
      responses:
        "200":
          description: Wallpaper removed successfully
          content:
            application/json:
              example:
                success: true
        "401":
          description: Unauthorized
        "403":
          description: Not a member of this conversation
