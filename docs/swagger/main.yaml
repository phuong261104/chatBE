  /v1/auth/change-password:
    $ref: "./paths/auth.yaml#/paths/~1v1~1auth~1change-password"

  # Auth - Session Management
  /v1/auth/sessions:
    $ref: "./paths/auth.yaml#/paths/~1v1~1auth~1sessions"
  /v1/auth/sessions/{deviceId}:
    $ref: "./paths/auth.yaml#/paths/~1v1~1auth~1sessions~1{deviceId}"

  # Auth - Avatar
  /v1/auth/avatar:
    $ref: "./paths/auth.yaml#/paths/~1v1~1auth~1avatar"

  # ==================== USER V2 (migrated from v1) ====================
  # v1 equivalents removed: /v1/users/search, /v1/users/search-by-phone,
  #   /v1/users/{id}/presence, /v1/users/{id}/public

  # ==================== CHAT - CONVERSATIONS V2 ====================
  # v1 equivalents removed: /v1/conversations, /v1/conversations/cursor,
  #   /v1/conversations/private, /v1/conversations/{conversationId}
  #   (use v2 endpoints below)

  # ==================== CHAT - MESSAGES V2 ====================
  # v1 equivalents removed: /v1/conversations/{conversationId}/messages,
  #   /v1/conversations/{conversationId}/seen, /v1/conversations/{conversationId}/delivered,
  #   /v1/conversations/{conversationId}/pinned-messages, /v1/conversations/{conversationId}/search,
  #   /v1/conversations/{conversationId}/media, /v1/messages/{messageId},
  #   /v1/messages/{messageId}/* actions, /v1/messages/forward,
  #   /v1/messages/{messageId}/reactions, /v1/messages/{messageId}/react,
  #   /v1/conversations/{conversationId}/messages/bulk-delete,
  #   /v1/messages/{messageId}/translate
  # (use v2 endpoints below)

  # ==================== CHAT - GROUPS V2 ====================
  # v1 equivalents removed: /v1/groups, /v1/groups/{groupId}, /v1/groups/{groupId}/info,
  #   /v1/groups/{groupId}/members, /v1/groups/{groupId}/members/{userId},
  #   /v1/groups/{groupId}/leave, /v1/groups/{groupId}/set-admin,
  #   /v1/groups/{groupId}/transfer-owner, /v1/groups/{groupId}/members/pending,
  #   /v1/groups/{groupId}/members/{userId}/approve,
  #   /v1/groups/{groupId}/members/{userId}/reject, /v1/groups/{groupId}/settings
  # (use v2 endpoints below)

  # ==================== CHAT - POLLS ====================
  # (pending migration to v2)

