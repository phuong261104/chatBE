  /v1/auth/logout-all:
    $ref: "./paths/auth.yaml#/paths/~1v1~1auth~1logout-all"
  /v1/auth/introspect:
    $ref: "./paths/auth.yaml#/paths/~1v1~1auth~1introspect"

  # Auth - Email Verification
  /v1/auth/send-verification:
    $ref: "./paths/auth.yaml#/paths/~1v1~1auth~1send-verification"
  /v1/auth/verify-email:
    $ref: "./paths/auth.yaml#/paths/~1v1~1auth~1verify-email"
  /v1/auth/resend-verification:
    $ref: "./paths/auth.yaml#/paths/~1v1~1auth~1resend-verification"

  # Auth - Password Management
  /v1/auth/forgot-password:
    $ref: "./paths/auth.yaml#/paths/~1v1~1auth~1forgot-password"
  /v1/auth/verify-reset-otp:
    $ref: "./paths/auth.yaml#/paths/~1v1~1auth~1verify-reset-otp"
  /v1/auth/resend-reset-otp:
