openapi: 3.0.0
info:
  title: BEMVP Chat API Documentation
  version: 1.0.0
  description: API Docs for Chat Application
servers:
  - url: http://localhost:3000
    description: Local Server
  - url: https://api.chatbe.example.com
    description: Production Server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessResponse:
      type: object
      properties:
        data:
          type: object
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Lỗi hệ thống hoặc lỗi dữ liệu đầu vào."
    ApiError:
      type: object
      properties:
        error:
          type: string
          example: "Error message"

