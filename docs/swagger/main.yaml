openapi: 3.0.0
info:
  title: BEMVP Chat API Documentation
  version: 1.0.0
  description: API Docs for Chat Application
servers:
  - url: http://localhost:3000/v1
    description: Local Server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessResponse:
      type: object
      properties:
        data:
          type: object
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: "VALIDATION_ERROR"
            message:
              type: string
              example: "Lỗi hệ thống hoặc lỗi dữ liệu đầu vào."
    ApiError:
      type: object
      properties:
        code:
          type: string
          example: "ERROR_CODE"
        message:
          type: string
          example: "Error message"

