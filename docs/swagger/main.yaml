openapi: 3.0.0
info:
  title: BEMVP Chat API Documentation
  version: 1.0.0
  description: API Docs for Chat Application
servers:
  - url: http://localhost:3000/v1
    description: Local Server

components:
  $ref: './components.yaml#/components'

paths:
  # Auth - Register & Login
  /auth/register:
    $ref: './paths/auth.yaml#/paths/~1auth~1register'
  /auth/login:
    $ref: './paths/auth.yaml#/paths/~1auth~1login'
  /auth/refresh:
    $ref: './paths/auth.yaml#/paths/~1auth~1refresh'
  /auth/logout:
    $ref: './paths/auth.yaml#/paths/~1auth~1logout'
  /auth/logout-all:
    $ref: './paths/auth.yaml#/paths/~1auth~1logout-all'
  /auth/introspect:
    $ref: './paths/auth.yaml#/paths/~1auth~1introspect'

  # Auth - Email Verification
  /auth/send-verification:
    $ref: './paths/auth.yaml#/paths/~1auth~1send-verification'
  /auth/verify-email:
    $ref: './paths/auth.yaml#/paths/~1auth~1verify-email'
  /auth/resend-verification:
    $ref: './paths/auth.yaml#/paths/~1auth~1resend-verification'

  # Auth - Password Management
  /auth/forgot-password:
    $ref: './paths/auth.yaml#/paths/~1auth~1forgot-password'
  /auth/verify-reset-otp:
    $ref: './paths/auth.yaml#/paths/~1auth~1verify-reset-otp'
  /auth/resend-reset-otp:
    $ref: './paths/auth.yaml#/paths/~1auth~1resend-reset-otp'
  /auth/reset-password:
    $ref: './paths/auth.yaml#/paths/~1auth~1reset-password'
  /auth/change-password:
    $ref: './paths/auth.yaml#/paths/~1auth~1change-password'

  # Auth - Session Management
  /auth/sessions:
    $ref: './paths/auth.yaml#/paths/~1auth~1sessions'
  /auth/sessions/{deviceId}:
    $ref: './paths/auth.yaml#/paths/~1auth~1sessions~1{deviceId}'

  # Auth - Avatar
  /auth/avatar:
    $ref: './paths/auth.yaml#/paths/~1auth~1avatar'

  # User
  /profile:
    $ref: './paths/user.yaml#/paths/~1profile'
  /users:
    $ref: './paths/user.yaml#/paths/~1users'
  /users/search:
    $ref: './paths/user.yaml#/paths/~1users~1search'
  /users/{id}:
    $ref: './paths/user.yaml#/paths/~1users~1{id}'
  /users/{id}/presence:
    $ref: './paths/user.yaml#/paths/~1users~1{id}~1presence'

  # Chat
  /conversations:
    $ref: './paths/chat.yaml#/paths/~1conversations'
  /conversations/{conversationId}/messages:
    $ref: './paths/chat.yaml#/paths/~1conversations~1{conversationId}~1messages'
  /groups/{groupId}/members:
    $ref: './paths/chat.yaml#/paths/~1groups~1{groupId}~1members'
  /groups/{groupId}/leave:
    $ref: './paths/chat.yaml#/paths/~1groups~1{groupId}~1leave'

  # Media
  /media/upload/image:
    $ref: './paths/media.yaml#/paths/~1media~1upload~1image'
  /media/upload/video:
    $ref: './paths/media.yaml#/paths/~1media~1upload~1video'
  /media/files/{id}:
    $ref: './paths/media.yaml#/paths/~1media~1files~1{id}'

  # Friendships
  /friendships:
    $ref: './paths/friendships.yaml#/paths/~1friendships'
  /friendships/{friendId}:
    $ref: './paths/friendships.yaml#/paths/~1friendships~1{friendId}'
  /friendships/{friendId}/check:
    $ref: './paths/friendships.yaml#/paths/~1friendships~1{friendId}~1check'
  /users/{id}/mutual-friends:
    $ref: './paths/friendships.yaml#/paths/~1users~1{id}~1mutual-friends'
  /users/{id}/suggestions:
    $ref: './paths/friendships.yaml#/paths/~1users~1{id}~1suggestions'

  # Friend Requests
  /friend-requests/{receiverId}:
    $ref: './paths/friend-requests.yaml#/paths/~1friend-requests~1{receiverId}'
  /friend-requests/{requestId}:
    $ref: './paths/friend-requests.yaml#/paths/~1friend-requests~1{requestId}'
  /friend-requests/received:
    $ref: './paths/friend-requests.yaml#/paths/~1friend-requests~1received'
  /friend-requests/sent:
    $ref: './paths/friend-requests.yaml#/paths/~1friend-requests~1sent'

  # Blocks
  /blocks/{blockedUserId}:
    $ref: './paths/blocks.yaml#/paths/~1blocks~1{blockedUserId}'
  /blocks:
    $ref: './paths/blocks.yaml#/paths/~1blocks'
  /blocks/{blockedUserId}/check:
    $ref: './paths/blocks.yaml#/paths/~1blocks~1{blockedUserId}~1check'

  # My Cloud
  /my-cloud:
    $ref: './paths/my-cloud.yaml#/paths/~1my-cloud'
  /my-cloud/{id}:
    $ref: './paths/my-cloud.yaml#/paths/~1my-cloud~1{id}'

  # Search
  /search:
    $ref: './paths/search.yaml#/paths/~1search'

  # Posts
  /posts:
    $ref: './paths/posts.yaml#/paths/~1posts'
  /posts/{id}:
    $ref: './paths/posts.yaml#/paths/~1posts~1{id}'
  /posts/{id}/react:
    $ref: './paths/posts.yaml#/paths/~1posts~1{id}~1react'
  /posts/{id}/comments:
    $ref: './paths/posts.yaml#/paths/~1posts~1{id}~1comments'
  /posts/{id}/comments/{commentId}:
    $ref: './paths/posts.yaml#/paths/~1posts~1{id}~1comments~1{commentId}'
  /posts/{id}/share:
    $ref: './paths/posts.yaml#/paths/~1posts~1{id}~1share'

  # Stories
  /stories:
    $ref: './paths/stories.yaml#/paths/~1stories'
  /stories/{id}:
    $ref: './paths/stories.yaml#/paths/~1stories~1{id}'
  /stories/{id}/view:
    $ref: './paths/stories.yaml#/paths/~1stories~1{id}~1view'
  /stories/{id}/views:
    $ref: './paths/stories.yaml#/paths/~1stories~1{id}~1views'
  /stories/{id}/reply:
    $ref: './paths/stories.yaml#/paths/~1stories~1{id}~1reply'
