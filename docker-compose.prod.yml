services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-chatbe-backend:prod}
    container_name: ${BACKEND_CONTAINER_NAME:-chatbe-backend-prod}
    env_file:
      - ${BACKEND_ENV_FILE:-.env.production}
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/v1/users/profile', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - chatbe-network

  redis:
    container_name: ${REDIS_CONTAINER_NAME:-chatbe-redis-prod}
    restart: always
