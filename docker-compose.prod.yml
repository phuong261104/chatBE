services:
  backend:
    image: ${BACKEND_IMAGE}
    container_name: ${BACKEND_CONTAINER_NAME:-chatbe-backend-prod}
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    env_file:
      - ${BACKEND_ENV_FILE:-/opt/chatbe/.env.production}
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/v1/users/profile', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - chatbe-network

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-chatbe-redis-prod}
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - chatbe-network

volumes:
  backend_uploads:
  backend_logs:
  redis_data:

networks:
  chatbe-network:
    driver: bridge
