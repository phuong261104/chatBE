<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Test - Socket.IO</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; }
    .container { display: flex; height: 100vh; max-width: 1200px; margin: 0 auto; }
    .sidebar { width: 300px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
    .sidebar-header { padding: 16px; border-bottom: 1px solid #ddd; background: #3a86ff; color: #fff; }
    .sidebar-header h2 { font-size: 18px; margin-bottom: 8px; }
    .user-select { margin-top: 12px; }
    .user-select select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.2); color: #fff; }
    .user-select select option { color: #333; }
    .conversation-list { flex: 1; overflow-y: auto; }
    .conversation-item { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background 0.2s; }
    .conversation-item:hover { background: #f5f5f5; }
    .conversation-item.active { background: #e8f0fe; border-left: 3px solid #3a86ff; }
    .conversation-name { font-weight: 600; color: #1a1a1a; }
    .conversation-preview { font-size: 13px; color: #666; margin-top: 4px; }
    .chat-area { flex: 1; display: flex; flex-direction: column; background: #fff; }
    .chat-header { padding: 16px; border-bottom: 1px solid #ddd; display: flex; align-items: center; justify-content: space-between; }
    .chat-header h3 { font-size: 16px; }
    .online-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #666; }
    .online-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; }
    .online-badge .dot.online { background: #4caf50; }
    .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .message { max-width: 70%; padding: 10px 14px; border-radius: 18px; position: relative; }
    .message.sent { align-self: flex-end; background: #3a86ff; color: #fff; border-bottom-right-radius: 4px; }
    .message.received { align-self: flex-start; background: #f0f0f0; color: #1a1a1a; border-bottom-left-radius: 4px; }
    .message-time { font-size: 10px; opacity: 0.7; margin-top: 4px; text-align: right; }
    .message-sender { font-size: 11px; opacity: 0.8; margin-bottom: 4px; }
    .message-input { padding: 16px; border-top: 1px solid #ddd; display: flex; gap: 12px; align-items: flex-end; }
    .message-input input { flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 24px; outline: none; font-size: 14px; }
    .message-input input:focus { border-color: #3a86ff; }
    .message-input button { padding: 10px 20px; background: #3a86ff; color: #fff; border: none; border-radius: 24px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
    .message-input button:hover { background: #2a76ef; }
    .message-input button:disabled { background: #ccc; cursor: not-allowed; }
    .events-panel { width: 280px; background: #1a1a2e; color: #fff; padding: 16px; overflow-y: auto; }
    .events-panel h3 { font-size: 14px; margin-bottom: 12px; color: #888; text-transform: uppercase; }
    .event { font-size: 12px; padding: 6px 10px; border-radius: 4px; margin-bottom: 6px; background: rgba(255,255,255,0.05); }
    .event .event-name { color: #3a86ff; font-weight: 600; }
    .event .event-data { color: #aaa; margin-top: 4px; word-break: break-all; }
    .login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .login-box { background: #fff; padding: 32px; border-radius: 16px; width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .login-box h2 { text-align: center; margin-bottom: 24px; color: #333; }
    .login-box .form-group { margin-bottom: 16px; }
    .login-box label { display: block; margin-bottom: 6px; color: #666; font-size: 14px; }
    .login-box input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
    .login-box button { width: 100%; padding: 14px; background: #3a86ff; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    .login-box button:hover { background: #2a76ef; }
    .user-info { display: flex; align-items: center; gap: 8px; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: #3a86ff; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; }
    .no-chat { flex: 1; display: flex; align-items: center; justify-content: center; color: #999; }
    .typing-indicator { font-size: 12px; color: #666; font-style: italic; margin: 8px 0; }
    .reaction-bar { display: flex; gap: 4px; margin-top: 4px; }
    .reaction-btn { cursor: pointer; padding: 2px 6px; border-radius: 12px; font-size: 14px; background: transparent; border: 1px solid #ddd; transition: all 0.2s; }
    .reaction-btn:hover { background: #f0f0f0; }
    .reaction-btn.active { background: #e8f0fe; border-color: #3a86ff; }
    @media (max-width: 768px) {
      .events-panel { display: none; }
      .sidebar { width: 100%; }
      .container { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <h2>Chat Test Login</h2>
      <div class="form-group">
        <label>Test Users (Pre-seeded)</label>
        <select id="userSelect" class="form-control">
          <option value="">-- Select User --</option>
          <option value="0912345678">User 1: 0912345678</option>
          <option value="0987654321">User 2: 0987654321</option>
        </select>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" value="Test123456!" placeholder="Password" readonly>
      </div>
      <button onclick="login()">Login</button>
    </div>
  </div>

  <div class="container">
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>Chat Test</h2>
        <div class="user-info">
          <div class="user-avatar" id="userAvatar">?</div>
          <div>
            <div id="displayName" style="font-weight:600;">Not logged in</div>
            <div id="userId" style="font-size:11px;opacity:0.8;"></div>
          </div>
        </div>
        <div class="user-select">
          <select id="targetUserSelect">
            <option value="">-- Chat with --</option>
            <option value="0912345678">User 1</option>
            <option value="0987654321">User 2</option>
          </select>
        </div>
      </div>
      <div class="conversation-list" id="conversationList">
        <div style="padding:16px;color:#666;text-align:center;">No conversations</div>
      </div>
    </div>

    <div class="chat-area">
      <div class="chat-header" id="chatHeader">
        <h3>Select a conversation</h3>
        <div class="online-badge"><span class="dot"></span> Offline</div>
      </div>
      <div class="messages" id="messages">
        <div class="no-chat">Select a conversation to start chatting</div>
      </div>
      <div class="message-input" id="messageInput" style="display:none;">
        <input type="text" id="messageText" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()" id="sendBtn">Send</button>
      </div>
    </div>

    <div class="events-panel">
      <h3>Socket Events</h3>
      <div id="eventsList"></div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000';
    const SOCKET_URL = 'http://localhost:3000';
    
    let currentUser = null;
    let accessToken = null;
    let socket = null;
    let messagesSocket = null;
    let currentConversationId = null;
    let conversations = [];

    function logEvent(name, data) {
      const list = document.getElementById('eventsList');
      const div = document.createElement('div');
      div.className = 'event';
      div.innerHTML = `<div class="event-name">${name}</div><div class="event-data">${JSON.stringify(data)}</div>`;
      list.insertBefore(div, list.firstChild);
      if (list.children.length > 50) list.removeChild(list.lastChild);
    }

    async function login() {
      const phone = document.getElementById('userSelect').value;
      const password = document.getElementById('password').value;
      
      if (!phone) { alert('Please select a user'); return; }
      
      try {
        const res = await fetch(`${API_BASE}/v1/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        });
        const data = await res.json();
        
        if (data.status === 'success') {
          currentUser = data.data.user;
          accessToken = data.data.accessToken;
          document.getElementById('loginOverlay').style.display = 'none';
          document.getElementById('displayName').textContent = currentUser.displayName;
          document.getElementById('userId').textContent = currentUser.id.substring(0, 8) + '...';
          document.getElementById('userAvatar').textContent = currentUser.displayName.charAt(0).toUpperCase();
          
          connectSocket();
          loadConversations();
        } else {
          alert('Login failed: ' + data.msg);
        }
      } catch (err) {
        alert('Connection error: ' + err.message);
      }
    }

    function connectSocket() {
      socket = io(SOCKET_URL, {
        auth: { token: accessToken },
        transports: ['websocket']
      });

      socket.on('connect', () => {
        logEvent('connect', { socketId: socket.id });
      });

      socket.on('connected', (data) => {
        logEvent('connected', data);
      });

      socket.on('user:online', (data) => {
        logEvent('user:online', data);
        updateConversationOnlineStatus(data.userId, true);
      });

      socket.on('user:offline', (data) => {
        logEvent('user:offline', data);
        updateConversationOnlineStatus(data.userId, false);
      });

      socket.on('disconnect', (reason) => {
        logEvent('disconnect', { reason });
      });

      messagesSocket = io(`${SOCKET_URL}/messages`, {
        auth: { token: accessToken },
        transports: ['websocket']
      });

      messagesSocket.on('connect', () => {
        logEvent('/messages connect', { socketId: messagesSocket.id });
      });

      messagesSocket.on('receiveMessage', (data) => {
        logEvent('receiveMessage', data);
        if (data.conversationId === currentConversationId) {
          addMessageToUI(data.message, false);
        }
        updateConversationPreview(data.conversationId, data.message.text);
      });

      messagesSocket.on('message:edited', (data) => {
        logEvent('message:edited', data);
      });

      messagesSocket.on('message:deleted', (data) => {
        logEvent('message:deleted', data);
      });

      messagesSocket.on('message:reaction', (data) => {
        logEvent('message:reaction', data);
      });

      messagesSocket.on('messageSeen', (data) => {
        logEvent('messageSeen', data);
      });

      messagesSocket.on('messageDelivered', (data) => {
        logEvent('messageDelivered', data);
      });

      messagesSocket.on('typing:start', (data) => {
        logEvent('typing:start', data);
        showTypingIndicator(data.userId);
      });

      messagesSocket.on('typing:stop', (data) => {
        logEvent('typing:stop', data);
        hideTypingIndicator();
      });
    }

    async function loadConversations() {
      try {
        const res = await fetch(`${API_BASE}/v1/conversations`, {
          headers: { 'Authorization': `Bearer ${accessToken}` }
        });
        const data = await res.json();
        if (data.status === 'success') {
          conversations = data.data;
          renderConversations();
        }
      } catch (err) {
        console.error('Load conversations error:', err);
      }
    }

    function renderConversations() {
      const list = document.getElementById('conversationList');
      if (conversations.length === 0) {
        list.innerHTML = '<div style="padding:16px;color:#666;text-align:center;">No conversations yet.<br>Use "Chat with" dropdown to create one.</div>';
        return;
      }
      list.innerHTML = conversations.map(conv => `
        <div class="conversation-item" data-id="${conv.id}" onclick="selectConversation('${conv.id}')">
          <div class="conversation-name">${conv.name || 'Private Chat'}</div>
          <div class="conversation-preview">${conv.lastMessage?.text || ''}</div>
        </div>
      `).join('');
    }

    async function selectConversation(convId) {
      currentConversationId = convId;
      
      document.querySelectorAll('.conversation-item').forEach(el => el.classList.remove('active'));
      document.querySelector(`[data-id="${convId}"]`)?.classList.add('active');

      const conv = conversations.find(c => c.id === convId);
      document.getElementById('chatHeader').innerHTML = `
        <h3>${conv?.name || 'Private Chat'}</h3>
        <div class="online-badge"><span class="dot"></span> Offline</div>
      `;
      
      document.querySelector('.no-chat')?.parentElement?.classList.contains('messages') 
        ? null 
        : (document.getElementById('messages').innerHTML = '');
      
      document.getElementById('messageInput').style.display = 'flex';
      
      messagesSocket.emit('joinGroup', { conversationId: convId });
      
      await loadMessages(convId);
    }

    async function loadMessages(convId) {
      try {
        const res = await fetch(`${API_BASE}/v1/conversations/${convId}/messages?limit=50`, {
          headers: { 'Authorization': `Bearer ${accessToken}` }
        });
        const data = await res.json();
        if (data.status === 'success') {
          const messages = data.data.messages || [];
          document.getElementById('messages').innerHTML = '';
          messages.reverse().forEach(msg => {
            addMessageToUI(msg, msg.senderId === currentUser.id);
          });
          scrollToBottom();
        }
      } catch (err) {
        console.error('Load messages error:', err);
      }
    }

    function addMessageToUI(message, isSent) {
      const messagesDiv = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = `message ${isSent ? 'sent' : 'received'}`;
      div.dataset.id = message.id;
      div.innerHTML = `
        ${!isSent && message.senderName ? `<div class="message-sender">${message.senderName}</div>` : ''}
        <div class="message-content">${message.text || '[Media]'}</div>
        <div class="message-time">${message.createdAt ? new Date(message.createdAt).toLocaleTimeString() : ''}</div>
        <div class="reaction-bar">
          <button class="reaction-btn" onclick="addReaction('${message.id}', '👍')">👍</button>
          <button class="reaction-btn" onclick="addReaction('${message.id}', '❤️')">❤️</button>
          <button class="reaction-btn" onclick="addReaction('${message.id}', '😂')">😂</button>
        </div>
      `;
      messagesDiv.appendChild(div);
      scrollToBottom();
    }

    async function sendMessage() {
      const text = document.getElementById('messageText').value.trim();
      if (!text || !currentConversationId) return;
      
      document.getElementById('messageText').value = '';
      
      try {
        const res = await fetch(`${API_BASE}/v1/conversations/${currentConversationId}/messages`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${accessToken}`
          },
          body: JSON.stringify({
            senderId: currentUser.id,
            text
          })
        });
        const data = await res.json();
        if (data.status === 'success') {
          addMessageToUI(data.data, true);
        }
      } catch (err) {
        console.error('Send message error:', err);
      }
    }

    async function addReaction(messageId, emoji) {
      try {
        await fetch(`${API_BASE}/v1/messages/${messageId}/reactions`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${accessToken}`
          },
          body: JSON.stringify({
            userId: currentUser.id,
            emoji
          })
        });
      } catch (err) {
        console.error('Add reaction error:', err);
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function scrollToBottom() {
      const messagesDiv = document.getElementById('messages');
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function showTypingIndicator(userId) {
      let indicator = document.getElementById('typingIndicator');
      if (!indicator) {
        indicator = document.createElement('div');
        indicator.id = 'typingIndicator';
        indicator.className = 'typing-indicator';
        document.getElementById('messages').appendChild(indicator);
      }
      indicator.textContent = `${userId.substring(0,8)} is typing...`;
      indicator.style.display = 'block';
    }

    function hideTypingIndicator() {
      const indicator = document.getElementById('typingIndicator');
      if (indicator) indicator.style.display = 'none';
    }

    function updateConversationOnlineStatus(userId, isOnline) {
      const badge = document.querySelector('.online-badge .dot');
      if (badge) {
        badge.classList.toggle('online', isOnline);
      }
    }

    function updateConversationPreview(convId, text) {
      const convEl = document.querySelector(`[data-id="${convId}"] .conversation-preview`);
      if (convEl) convEl.textContent = text;
    }

    document.getElementById('targetUserSelect').addEventListener('change', async (e) => {
      const targetPhone = e.target.value;
      if (!targetPhone || targetPhone === currentUser?.phone) return;
      
      try {
        const res = await fetch(`${API_BASE}/v1/conversations/private`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${accessToken}`
          },
          body: JSON.stringify({
            currentUserId: currentUser.id,
            targetUserId: targetPhone
          })
        });
        const data = await res.json();
        if (data.status === 'success') {
          currentConversationId = data.data.conversation.id;
          conversations.push(data.data.conversation);
          renderConversations();
          selectConversation(currentConversationId);
        } else {
          console.error('Create conversation error:', data);
        }
      } catch (err) {
        console.error('Create conversation error:', err);
      }
    });

    let typingTimeout = null;
    document.getElementById('messageText').addEventListener('input', () => {
      messagesSocket.emit('typing:start', { groupId: currentConversationId });
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        messagesSocket.emit('typing:stop', { groupId: currentConversationId });
      }, 2000);
    });
  </script>
</body>
</html>
