name: CD

on:
  push:
    branches:
      - main

concurrency:
  group: cd-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/chatbe
  APP_DIR: /opt/chatbe
  BACKEND_PORT: "3000"

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Install cloudflared
        run: |
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare-main.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared jammy main" | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update
          sudo apt-get install -y cloudflared
          cloudflared --version

      - name: Write SSH config for Cloudflare Access
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat > ~/.ssh/config <<'EOF'
          Host vps-chatbe
            HostName ssh.iamphuong.dev
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/id_rsa
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 30
            ServerAliveCountMax 3
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id "${{ secrets.CF_ACCESS_CLIENT_ID }}" --service-token-secret "${{ secrets.CF_ACCESS_CLIENT_SECRET }}"
          EOF
          chmod 600 ~/.ssh/config

      - name: Create app directory on VPS
        run: |
          ssh -o ConnectTimeout=30 vps-chatbe \
            'sudo mkdir -p ${{ env.APP_DIR }} && sudo chown deploy:deploy ${{ env.APP_DIR }}'

      - name: Copy docker-compose.yml to VPS
        run: |
          cat docker-compose.prod.yml | ssh vps-chatbe \
            'cat > ${{ env.APP_DIR }}/docker-compose.yml && chown deploy:deploy ${{ env.APP_DIR }}/docker-compose.yml'

      - name: Create .env file on VPS
        run: |
          ssh vps-chatbe \
            "printf 'BACKEND_IMAGE=%s\nBACKEND_PORT=%s\nBACKEND_ENV_FILE=/opt/chatbe/.env.production\nBACKEND_CONTAINER_NAME=chatbe-backend-prod\nREDIS_CONTAINER_NAME=chatbe-redis-prod\n' \
              '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest' \
              '${{ env.BACKEND_PORT }}' \
              > ${{ env.APP_DIR }}/.env && chown deploy:deploy ${{ env.APP_DIR }}/.env"

      - name: GHCR login on VPS
        run: |
          ssh vps-chatbe \
            'echo "${{ secrets.GHCR_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin'

      - name: Pull Docker image on VPS
        run: |
          ssh vps-chatbe \
            'docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest'

      - name: Stop old backend container (free port 3000)
        run: |
          ssh vps-chatbe \
            'docker rm -f chatbe-backend-prod || true'

      - name: Start containers with new image
        run: |
          ssh vps-chatbe \
            'docker compose --env-file ${{ env.APP_DIR }}/.env -f ${{ env.APP_DIR }}/docker-compose.yml up -d'

      - name: Wait for backend to be healthy
        run: |
          echo "Waiting for backend to start..."
          sleep 30
          for i in $(seq 1 15); do
            status=$(ssh vps-chatbe \
              'curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:${{ env.BACKEND_PORT }}/v1/users/profile || echo "000"')
            if [ "$status" != "000" ] && [ "$status" != "503" ]; then
              echo "Backend is up (HTTP $status)"
              exit 0
            fi
            echo "Attempt $i/15: backend not ready (HTTP $status), retrying in 10s..."
            sleep 10
          done
          echo "WARNING: Backend health check timed out after 150s"
          exit 1

      - name: Inspect running containers
        run: |
          ssh vps-chatbe \
            'docker ps --filter "name=chatbe-backend"'
