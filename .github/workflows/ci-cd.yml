name: CI/CD Backend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/chatbe
  IMAGE_TAG: ${{ github.sha }}
  APP_DIR: /opt/chatbe
  BACKEND_PORT: "3000"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    name: Deploy to Production
    needs: build-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Create app directory on VPS
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'sudo mkdir -p ${{ env.APP_DIR }} && sudo chown deploy:deploy ${{ env.APP_DIR }}'

      - name: Copy docker-compose.yml to VPS
        run: |
          cat docker-compose.prod.yml | ssh -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'cat > ${{ env.APP_DIR }}/docker-compose.yml && chown deploy:deploy ${{ env.APP_DIR }}/docker-compose.yml'

      - name: Create .env file on VPS
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'cat > ${{ env.APP_DIR }}/.env << '\''ENVEOF'\''
BACKEND_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
BACKEND_PORT=${{ env.BACKEND_PORT }}
BACKEND_ENV_FILE=/opt/chatbe/.env.production
BACKEND_CONTAINER_NAME=chatbe-backend-prod
REDIS_CONTAINER_NAME=chatbe-redis-prod
ENVEOF'
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'chown deploy:deploy ${{ env.APP_DIR }}/.env'

      - name: GHCR login on VPS
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "echo '${{ secrets.GHCR_TOKEN }}' | docker login ${{ env.REGISTRY }} -u '${{ github.actor }}' --password-stdin"

      - name: Pull Docker image on VPS
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest'

      - name: Start containers with new image
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'docker compose --env-file ${{ env.APP_DIR }}/.env -f ${{ env.APP_DIR }}/docker-compose.yml up -d'

      - name: Wait for backend to be healthy
        run: |
          echo "Waiting for backend to start..."
          sleep 30
          for i in $(seq 1 15); do
            status=$(ssh -o StrictHostKeyChecking=no \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              'curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:${{ env.BACKEND_PORT }}/v1/users/profile || echo "000"')
            if [ "$status" != "000" ] && [ "$status" != "503" ]; then
              echo "Backend is up (HTTP $status)"
              exit 0
            fi
            echo "Attempt $i/15: backend not ready (HTTP $status), retrying in 10s..."
            sleep 10
          done
          echo "WARNING: Backend health check timed out after 150s"
          exit 1

      - name: Inspect running containers
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'docker ps --filter "name=chatbe-backend" --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"'
