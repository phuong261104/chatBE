name: CI/CD Backend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/chatbe
  APP_DIR: /opt/chatbe
  BACKEND_PORT: "3000"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push with Docker metadata
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Inspect pushed image
        run: |
          echo "Pushed tags: ${{ steps.meta.outputs.tags }}"

  deploy:
    name: Deploy to Production
    needs: build-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Configure SSH for Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >> ~/.ssh/config << 'EOF'
          Host ssh.iamphuong.dev
              HostName ssh.iamphuong.dev
              User deploy
              ProxyCommand cloudflared access ssh --hostname %h
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              ConnectTimeout 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Create app directory on VPS
        run: |
          ssh ssh.iamphuong.dev "sudo mkdir -p ${{ env.APP_DIR }} && sudo chown deploy:deploy ${{ env.APP_DIR }}"

      - name: Copy docker-compose.yml to VPS
        run: |
          cat docker-compose.prod.yml | ssh ssh.iamphuong.dev "cat > ${{ env.APP_DIR }}/docker-compose.yml && chown deploy:deploy ${{ env.APP_DIR }}/docker-compose.yml"

      - name: Create .env file on VPS
        run: |
          ssh ssh.iamphuong.dev "cat > ${{ env.APP_DIR }}/.env << 'ENVEOF'
BACKEND_IMAGE=${{ needs.build-push.outputs.image_tag }}
BACKEND_PORT=${{ env.BACKEND_PORT }}
BACKEND_ENV_FILE=/opt/chatbe/.env.production
BACKEND_CONTAINER_NAME=chatbe-backend-prod
REDIS_CONTAINER_NAME=chatbe-redis-prod
ENVEOF
          chown deploy:deploy ${{ env.APP_DIR }}/.env"

      - name: GHCR login on VPS
        run: |
          ssh ssh.iamphuong.dev "echo '${{ secrets.GHCR_TOKEN }}' | docker login ${{ env.REGISTRY }} -u '${{ github.actor }}' --password-stdin"

      - name: Pull Docker image on VPS
        run: |
          ssh ssh.iamphuong.dev "docker pull '${{ needs.build-push.outputs.image_tag }}'"

      - name: Start containers with new image
        run: |
          ssh ssh.iamphuong.dev \
            "docker compose --env-file ${{ env.APP_DIR }}/.env -f ${{ env.APP_DIR }}/docker-compose.yml up -d"

      - name: Wait for backend to be healthy
        run: |
          echo "Waiting for backend to start..."
          sleep 30
          for i in $(seq 1 15); do
            status=$(ssh ssh.iamphuong.dev "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:${{ env.BACKEND_PORT }}/v1/users/profile || echo '000'")
            if [ "$status" != "000" ] && [ "$status" != "503" ]; then
              echo "Backend is up (HTTP $status)"
              exit 0
            fi
            echo "Attempt $i/15: backend not ready (HTTP $status), retrying in 10s..."
            sleep 10
          done
          echo "WARNING: Backend health check timed out after 150s"
          exit 1

      - name: Inspect running containers
        run: |
          ssh ssh.iamphuong.dev "docker ps --filter 'name=chatbe-backend' --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'"
