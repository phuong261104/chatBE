name: CI/CD Backend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/chatbe

jobs:
  build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_sha: ${{ env.IMAGE_TAG_SHA }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Set image tag sha env
        run: echo "IMAGE_TAG_SHA=sha-$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push with Docker metadata
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Inspect pushed image
        run: |
          echo "Pushed tags: ${{ steps.meta.outputs.tags }}"

  deploy:
    name: Deploy to Production
    needs: build-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check Jenkins alive
        id: check_jenkins
        run: |
          echo "Checking Jenkins at https://jenkins.iamphuong.dev..."
          status_code=$(curl -sS -o /dev/null -w "%{http_code}" \
            https://jenkins.iamphuong.dev/whoAmI/api/json \
            -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}")
          echo "Jenkins HTTP status: $status_code"
          if [ "$status_code" -ne 200 ]; then
            echo "ERROR: Jenkins is not responding (HTTP $status_code). Deploy aborted."
            exit 1
          fi
          echo "Jenkins is alive."

      - name: Trigger Jenkins deploy job
        run: |
          echo "Triggering Jenkins job: chatbe-deploy"
          echo "Image: ${{ needs.build-push.outputs.image_tag }}"
          response=$(curl -sS -w "\n%{http_code}" \
            -X POST "https://jenkins.iamphuong.dev/job/chatbe-deploy/buildWithParameters" \
            -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
            --data-urlencode "IMAGE_NAME=${{ needs.build-push.outputs.image_tag }}")
          http_code=$(echo "$response" | tail -1)
          echo "Jenkins response code: $http_code"
          if [ "$http_code" != "201" ] && [ "$http_code" != "200" ]; then
            echo "ERROR: Failed to trigger Jenkins job (HTTP $http_code). Deploy aborted."
            exit 1
          fi
          echo "Jenkins job triggered successfully."
          echo "Waiting for Jenkins queue to start..."
          sleep 10
          echo "Jenkins deploy pipeline is running."
